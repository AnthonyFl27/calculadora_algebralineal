      }

      marcoMatriz.appendChild(grid);
    }

    function limpiarMatriz() {
      for (const fila of entradasMatriz) {
        for (const entrada of fila) entrada.value = "";
      }
      ultimoResultado = null;
      botonComprobar.disabled = true;
      panelResultado.innerHTML = "";
    }

    function obtenerMatriz() {
      const matriz = [];
      for (const filaEntradas of entradasMatriz) {
        const fila = [];
        for (const entrada of filaEntradas) {
          const texto = entrada.value.trim();
          if (texto === "") throw new Error("vacio");
          fila.push(texto);
        }
        matriz.push(fila);
      }
      return matriz;
    }

    async function resolverInterno() {
      let matriz;
      try {
        matriz = obtenerMatriz();
      } catch (error) {
        mostrarError("Complete todos los campos de la matriz con números.");
        return null;
      }

      try {
        const resultado = await llamarApi("/api/sistema", { metodo, matriz, modo });
        ultimoResultado = resultado;
        botonComprobar.disabled = false;
        return resultado;
      } catch (error) {
        mostrarError(error.message);
        return null;
      }
    }

    function encabezadosDe(resultado) {
      const variables = resultado.matriz_inicial[0].length - 1;
      return Array.from({ length: variables }, (_, j) => `x${j + 1}`).concat(["b"]);
    }

    async function resolverSistema() {
      const resultado = await resolverInterno();
      if (!resultado) return;

      panelResultado.innerHTML = "";
      panelResultado.appendChild(tarjetaResultadoSistema(resultado.tipo, resultado.soluciones));
      agregarGraficaEscena(panelResultado, resultado.escena, "Gráfica del sistema");
    }

    async function mostrarPasos() {
      let resultado = ultimoResultado;
      if (!resultado) {
        resultado = await resolverInterno();
        if (!resultado) return;
      }

      panelResultado.innerHTML = "";
      renderProcedimientoSistema(panelResultado, resultado, encabezadosDe(resultado), `Procedimiento (${titulo})`);
      panelResultado.appendChild(tarjetaResultadoSistema(resultado.tipo, resultado.soluciones));
      agregarGraficaEscena(panelResultado, resultado.escena, "Gráfica del sistema");
    }

    function comprobarResultado() {
      if (!ultimoResultado) {
        mostrarAviso("Primero resuelva el sistema para poder comprobarlo.");
        return;
      }
      panelResultado.innerHTML = "";
      panelResultado.appendChild(tarjetaComprobacion(ultimoResultado.comprobacion));
    }

    const controles = crearControles([
      el("label", { texto: "Ecuaciones:" }),
      entradaEcuaciones,
      el("label", { texto: "Variables:" }),
      entradaVariables,
      el("button", { class: "btn", texto: "Crear matriz", onclick: crearMatriz }),
      el("button", { class: "btn", texto: "Limpiar", onclick: limpiarMatriz }),
    ]);

    const radioFraccion = el("input", { type: "radio", name: `modo-${metodo}`, value: "fraccion", checked: "checked" });
    const radioDecimal = el("input", { type: "radio", name: `modo-${metodo}`, value: "decimal" });
    radioFraccion.addEventListener("change", () => { modo = "fraccion"; });
    radioDecimal.addEventListener("change", () => { modo = "decimal"; });

    const formato = el("div", { class: "formato" }, [
      el("span", { texto: "Mostrar resultados en:" }),
      el("label", {}, [radioFraccion, document.createTextNode(" Fracciones")]),
      el("label", {}, [radioDecimal, document.createTextNode(" Decimales")]),
    ]);

    const botones = el("div", { class: "botones" }, [
      el("button", { class: "btn btn-grande", texto: "Resolver", onclick: resolverSistema }),
      el("button", { class: "btn btn-grande", texto: "Mostrar pasos", onclick: mostrarPasos }),
      botonComprobar,
    ]);

    const contenedor = el("div", {}, [
      el("div", { class: "titulo", texto: titulo }),
      controles,
      marcoMatriz,
      formato,
      botones,
      panelResultado,
    ]);

    crearMatriz();

    if (ejercicio && ejercicio.datos.matriz) {
      const matriz = ejercicio.datos.matriz;
      entradaEcuaciones.value = String(matriz.length);
      entradaVariables.value = String(matriz[0].length - 1);
      crearMatriz();
      llenarEntradas(entradasMatriz, matriz);
    }

    return contenedor;
  }

  /* ==========================================================
     VISTA: CONVERSIÓN DE BASES
     ========================================================== */

  const DIGITOS = "0123456789ABCDEF";

  function renderPasoDivision(paso, indice, total) {
    const digito = DIGITOS[paso.residuo];
    return el("div", { class: "paso-conversion" }, [
      el("span", { class: "paso-numero", texto: `Paso ${indice + 1} de ${total}` }),
      el("div", { class: "division-visual" }, [
        el("span", { texto: String(paso.dividendo) }),
        el("span", { class: "division-operador", texto: `÷ ${paso.base}` }),
        el("span", { class: "division-igual", texto: "=" }),
        el("span", { class: "division-cociente", texto: String(paso.cociente) }),
      ]),
      el("div", {
        class: "division-residuo",
        texto: paso.base > 10
          ? `Residuo = ${paso.residuo} (${digito})`
          : `Residuo = ${paso.residuo}`,
      }),
    ]);
  }

  function renderPasoTermino(paso, indice, total) {
    return el("div", { class: "paso-conversion" }, [
      el("span", { class: "paso-numero", texto: `Paso ${indice + 1} de ${total}` }),
      el("div", { class: "termino-visual" }, [
        el("span", { texto: paso.digito }),
        el("span", { texto: `× ${paso.base}^${paso.exponente}` }),
        el("span", { class: "termino-igual", texto: "=" }),
        el("span", { class: "termino-resultado", texto: String(paso.contribucion) }),
      ]),
    ]);
  }

  function crearTarjetaResultadoConversion(resultado) {
    const detalle = resultado.pasos.length === 0
      ? "El número ya estaba en la base solicitada."
      : resultado.tipo === "a_otra_base"
        ? "Los residuos, leídos de abajo hacia arriba, forman el resultado."
        : "La suma de cada término (dígito × base elevado a su posición) da el resultado.";

    return crearTarjetaVeredicto({
      tipoClase: "tipo-unica",
      icono: "✓",
      titulo: "Resultado de la conversión",
      detalle,
      cuerpoNodo: el("div", {
        class: "resultado-conversion-numero",
        texto: `${resultado.numero_entrada} (${resultado.nombre_base_entrada}) = `
          + `${resultado.resultado} (${resultado.nombre_base_salida})`,
      }),
    });
  }

  function vistaConversion(ejercicio) {
    const BASES_A_OTRA = ["binario", "octal", "hexadecimal"];
    const BASES_A_DECIMAL = ["binario", "octal", "hexadecimal", "decimal"];
    const NOMBRE_A_BASE = { binario: 2, octal: 8, decimal: 10, hexadecimal: 16 };

    let direccion = "a_otra_base";

    const panelResultado = el("div", { class: "resultado-panel" });
    const selectBase = el("select", {});

    function actualizarOpcionesBase() {
      const opciones = direccion === "a_otra_base" ? BASES_A_OTRA : BASES_A_DECIMAL;
      selectBase.innerHTML = "";
      for (const opcion of opciones) {
        selectBase.appendChild(el("option", { value: opcion, texto: opcion }));
      }
    }

    const radioAOtra = el("input", { type: "radio", name: "direccion-conv", value: "a_otra_base", checked: "checked" });
    const radioADecimal = el("input", { type: "radio", name: "direccion-conv", value: "a_decimal" });
    radioAOtra.addEventListener("change", () => { direccion = "a_otra_base"; actualizarOpcionesBase(); });
    radioADecimal.addEventListener("change", () => { direccion = "a_decimal"; actualizarOpcionesBase(); });

    const direccionMarco = el("div", { class: "controles controles-radios" }, [
      el("span", { texto: "Dirección:" }),
      el("label", {}, [radioAOtra, document.createTextNode(" Decimal → otra base")]),
      el("label", {}, [radioADecimal, document.createTextNode(" Otra base → Decimal")]),
    ]);

    const entradaNumero = crearCelda({ placeholder: "Número" });
    entradaNumero.style.width = "220px";

    async function convertir() {
      const numero = entradaNumero.value.trim();
      const baseNombre = selectBase.value;
      const baseNumero = NOMBRE_A_BASE[baseNombre];

      let baseEntrada, baseSalida;
      if (direccion === "a_otra_base") {
        baseEntrada = 10; baseSalida = baseNumero;
      } else {
        baseEntrada = baseNumero; baseSalida = 10;
      }

      let resultado;
      try {
        resultado = await llamarApi("/api/conversion", {
          numero, base_entrada: baseEntrada, base_salida: baseSalida,
        });
      } catch (error) {
        mostrarError(error.message);
        return;
      }

      panelResultado.innerHTML = "";
      panelResultado.appendChild(el("div", { class: "bloque-titulo", texto: "Procedimiento" }));

      if (resultado.pasos.length === 0) {
        panelResultado.appendChild(el("p", {
          class: "nota-sin-pasos",
          texto: "El número ya está en la base solicitada; no se requieren operaciones.",
        }));
      } else if (resultado.tipo === "a_otra_base") {
        panelResultado.appendChild(crearStepperGenerico(resultado.pasos, renderPasoDivision));
      } else {
        panelResultado.appendChild(crearStepperGenerico(resultado.pasos, renderPasoTermino));
      }

      panelResultado.appendChild(crearTarjetaResultadoConversion(resultado));
    }

    const controles = crearControles([
      el("label", { texto: "Base:" }),
      selectBase,
      el("label", { texto: "Número:" }),
      entradaNumero,
      el("button", { class: "btn btn-grande", texto: "Convertir", onclick: convertir }),
    ]);

    actualizarOpcionesBase();

    if (ejercicio && ejercicio.datos.numero !== undefined) {
      const { numero, base_entrada, base_salida } = ejercicio.datos;
      const nombreDeBase = (base) => Object.keys(NOMBRE_A_BASE).find((n) => NOMBRE_A_BASE[n] === base);

      direccion = base_entrada === 10 ? "a_otra_base" : "a_decimal";
      radioAOtra.checked = direccion === "a_otra_base";
      radioADecimal.checked = direccion === "a_decimal";
      actualizarOpcionesBase();
      selectBase.value = nombreDeBase(direccion === "a_otra_base" ? base_salida : base_entrada);
      entradaNumero.value = numero;
    }

    return el("div", {}, [
      el("div", { class: "titulo", texto: "Conversión de bases" }),
      direccionMarco,
      controles,
      panelResultado,
    ]);
  }

  /* ==========================================================
     VISTA: VECTORES Y MATRICES
     ========================================================== */

  const TITULOS_OPERACION = {
    suma_vectores: "Suma de vectores",
    resta_vectores: "Resta de vectores",
    escalar_vector: "Multiplicación de vector por escalar",
    suma_matrices: "Suma de matrices",
    resta_matrices: "Resta de matrices",
    escalar_matriz: "Multiplicación de matriz por escalar",
    multiplicacion_matrices: "Multiplicación de matrices",
  };

  function renderFilaPasoVector(paso, indice, tipo) {
    let expresion;
    if (tipo === "suma_vectores") expresion = paso.valores.join(" + ");
    else if (tipo === "resta_vectores") expresion = `${paso.valor_a} - ${paso.valor_b}`;
    else expresion = `${paso.escalar} × ${paso.valor}`;

    return el("div", { class: "fila-paso", style: `animation-delay:${indice * 35}ms` }, [
      el("span", { class: "paso-etiqueta", texto: `Componente ${paso.componente + 1}` }),
      el("span", { class: "paso-expresion", texto: `${expresion} = ${paso.resultado}` }),
    ]);
  }

  function renderFilaPasoMatriz(paso, indice, tipo) {
    let expresion;
    if (tipo === "escalar_matriz") {
      expresion = `${paso.escalar} × ${paso.valor}`;
    } else if (tipo === "multiplicacion_matrices") {
      expresion = paso.factores.map(([a, b]) => `(${a}×${b})`).join(" + ");
    } else {
      const signo = tipo === "suma_matrices" ? "+" : "-";
      expresion = `${paso.valor_a} ${signo} ${paso.valor_b}`;
    }

    return el("div", { class: "fila-paso", style: `animation-delay:${indice * 35}ms` }, [
      el("span", { class: "paso-etiqueta", texto: `(${paso.fila + 1}, ${paso.columna + 1})` }),
      el("span", { class: "paso-expresion", texto: `${expresion} = ${paso.resultado}` }),
    ]);
  }

  function renderOperacionSimple(contenedor, bloque) {
    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: TITULOS_OPERACION[bloque.tipo] }));

    const esVector = bloque.tipo.endsWith("_vectores") || bloque.tipo === "escalar_vector";
    contenedor.appendChild(crearListaPasos(bloque.pasos, (paso, i) => (
      esVector ? renderFilaPasoVector(paso, i, bloque.tipo) : renderFilaPasoMatriz(paso, i, bloque.tipo)
    )));

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Resultado" }));
    if (Array.isArray(bloque.resultado[0])) {
      contenedor.appendChild(crearTablaMatriz(bloque.resultado, {}));
    } else {
      contenedor.appendChild(el("div", { class: "resultado-vector", texto: `(${bloque.resultado.join(", ")})` }));
    }
  }

  function renderCombinacionLineal(contenedor, bloque) {
    const planteamiento = bloque.entradas.vectores
      .map((v, i) => `c${i + 1}(${v.join(", ")})`)
      .join(" + ") + ` = (${bloque.entradas.objetivo.join(", ")})`;

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Combinación lineal" }));
    contenedor.appendChild(el("div", { class: "planteamiento", texto: `Planteamiento: ${planteamiento}` }));

    const encabezados = bloque.entradas.vectores.map((_, i) => `c${i + 1}`).concat(["obj"]);

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Sistema planteado" }));
    contenedor.appendChild(crearTablaMatriz(bloque.sistema, {
      encabezados, separadorAntesDe: encabezados.length - 1,
    }));

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Procedimiento" }));
    renderStepperYFinal(contenedor, bloque.sistema_resuelto, encabezados);

    if (bloque.es_combinacion) {
      const detalle = bloque.tipo_solucion === "infinitas"
        ? "Hay infinitas combinaciones posibles; se muestra una particular:"
        : "Los escalares encontrados son:";
      const chips = el("div", { class: "lista-escalares" }, bloque.escalares.map(
        (valor, i) => el("span", { class: "chip-escalar", texto: `c${i + 1} = ${valor}` })
      ));
      contenedor.appendChild(crearTarjetaVeredicto({
        tipoClase: "tipo-unica", icono: "✓", titulo: "Sí es combinación lineal",
        detalle, cuerpoNodo: chips,
      }));
    } else {
      contenedor.appendChild(crearTarjetaVeredicto({
        tipoClase: "tipo-incompatible", icono: "✕", titulo: "No es combinación lineal",
        detalle: "El sistema planteado es incompatible.",
      }));
    }
  }

  function renderEcuacionMatricial(contenedor, bloque) {
    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Ecuación matricial A·X = B" }));

    const columnasA = bloque.entradas.matriz_a[0].length;
    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Matriz aumentada [A | B]" }));
    contenedor.appendChild(crearTablaMatriz(bloque.matriz_aumentada, { separadorAntesDe: columnasA }));

    const encabezadosColumna = Array.from({ length: columnasA }, (_, j) => `x${j + 1}`).concat(["b"]);

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Resolución por columna de B" }));
    bloque.columnas.forEach((columna, indice) => {
      const cuerpo = el("div", { class: "accordion-body" });
      renderStepperYFinal(cuerpo, columna, encabezadosColumna);
      contenedor.appendChild(crearAccordion(`Columna ${indice + 1} de B`, cuerpo, indice === 0));
    });

    if (bloque.tipo_solucion === "incompatible") {
      contenedor.appendChild(crearTarjetaVeredicto({
        tipoClase: "tipo-incompatible", icono: "✕", titulo: "Sin solución",
        detalle: "La ecuación matricial no tiene solución.",
      }));
      return;
    }

    const detalle = bloque.tipo_solucion === "infinitas"
      ? "Tiene infinitas soluciones; se muestra una solución particular X:"
      : "Solución única X:";

    contenedor.appendChild(crearTarjetaVeredicto({
      tipoClase: "tipo-unica", icono: "✓", titulo: "Resultado", detalle,
      cuerpoNodo: crearTablaMatriz(bloque.resultado, {}),
    }));
  }

  function renderMatrizInversa(contenedor, bloque) {
    const n = bloque.entradas.matriz.length;
    const nombreMetodo = bloque.metodo === "pivoteo" ? "Pivoteo" : "Gauss-Jordan";
    const encabezados = Array.from({ length: n }, (_, j) => `a${j + 1}`)
      .concat(Array.from({ length: n }, (_, j) => `i${j + 1}`));

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: `Matriz inversa (${nombreMetodo})` }));
    contenedor.appendChild(el("div", {
      class: "planteamiento",
      texto: "Se reduce [A | I] hasta obtener [I | A⁻¹].",
    }));

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Matriz ampliada [A | I]" }));
    contenedor.appendChild(crearTablaMatriz(bloque.matriz_aumentada, {
      encabezados, separadorAntesDe: n,
    }));

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Procedimiento" }));
    renderStepperYFinal(contenedor, {
      pasos: bloque.pasos,
      pivotes: bloque.pivotes,
      matriz_final: bloque.matriz_final,
    }, encabezados, n);

    if (!bloque.existe) {
      contenedor.appendChild(crearTarjetaVeredicto({
        tipoClase: "tipo-incompatible", icono: "✕", titulo: "La inversa no existe",
        detalle: "La matriz A es singular (no invertible).",
        cuerpoTexto: bloque.motivo,
      }));
      return;
    }

    contenedor.appendChild(crearTarjetaVeredicto({
      tipoClase: "tipo-unica", icono: "✓", titulo: "La matriz es invertible",
      detalle: "A⁻¹ es el bloque derecho de la matriz reducida:",
      cuerpoNodo: crearTablaMatriz(bloque.resultado, {}),
    }));

    const comp = bloque.comprobacion;
    const tarjetaComp = (ok, formula, izquierda, derecha, producto, etiquetaProducto) =>
      crearTarjetaVeredicto({
        tipoClase: ok ? "tipo-unica" : "tipo-incompatible",
        icono: ok ? "✓" : "✕",
        titulo: ok ? "Comprobación correcta" : "Comprobación incorrecta",
        detalle: `Se verifica que ${formula} = I`,
        cuerpoNodo: el("div", { class: "ecuacion-comprobacion" }, [
          tablaConEtiqueta(izquierda[0], izquierda[1]),
          el("span", { class: "simbolo-ecuacion", texto: "·" }),
          tablaConEtiqueta(derecha[0], derecha[1]),
          el("span", { class: "simbolo-ecuacion", texto: "=" }),
          tablaConEtiqueta(etiquetaProducto, producto),
        ]),
      });
    contenedor.appendChild(tarjetaComp(
      comp.correcto_derecha, "A · A⁻¹",
      ["A", bloque.entradas.matriz], ["A⁻¹", bloque.resultado],
      comp.producto, "A · A⁻¹"));
    contenedor.appendChild(tarjetaComp(
      comp.correcto_izquierda, "A⁻¹ · A",
      ["A⁻¹", bloque.resultado], ["A", bloque.entradas.matriz],
      comp.producto_izquierda, "A⁻¹ · A"));
  }

  function renderBloqueOperacion(contenedor, bloque) {
    contenedor.innerHTML = "";
    if (bloque.tipo === "matriz_inversa") renderMatrizInversa(contenedor, bloque);
    else if (bloque.tipo === "combinacion_lineal") renderCombinacionLineal(contenedor, bloque);
    else if (bloque.tipo === "ecuacion_matricial") renderEcuacionMatricial(contenedor, bloque);
    else renderOperacionSimple(contenedor, bloque);
    if (bloque.escena) agregarGraficaEscena(contenedor, bloque.escena, TITULOS_GRAFICA[bloque.tipo]);
    if (bloque.escenas && bloque.escenas.length) {
      agregarGraficasEscenas(contenedor, bloque.escenas, TITULOS_GRAFICA[bloque.tipo]);
    }
  }

  const TITULOS_GRAFICA = {
    suma_vectores: "Gráfica de la suma",
    resta_vectores: "Gráfica de la resta",
    escalar_vector: "Gráfica del vector por escalar",
    combinacion_lineal: "Gráfica de la combinación lineal",
    matriz_inversa: "Gráfica de la matriz inversa",
    ecuacion_matricial: "Gráfica de la ecuación matricial",
    multiplicacion_matrices: "Gráfica del producto A × B",
  };

  function vistaVectoresMatrices(ejercicio) {
    let modo = "fraccion";
    const panelResultado = el("div", { class: "resultado-panel" });

    /* ---------- Sub-vista: Vectores ---------- */

    let entradasVectores = [];
    let entradasObjetivo = [];
    let entradaEscalarVector = null;

    const operacionVector = el("select", {}, [
      el("option", { value: "Suma", texto: "Suma" }),
      el("option", { value: "Resta", texto: "Resta" }),
      el("option", { value: "Vector por escalar", texto: "Vector por escalar" }),
      el("option", { value: "Combinación lineal", texto: "Combinación lineal" }),
    ]);

    const dimensionVector = el("input", { type: "number", min: "1", value: "3" });
    dimensionVector.style.width = "55px";
    const cantidadVectores = el("input", { type: "number", min: "1", value: "2" });
    cantidadVectores.style.width = "55px";

    const marcoVectores = el("div", { class: "grupo-vectores" });

    operacionVector.addEventListener("change", crearCamposVectores);

    function crearCamposVectores() {
      let dimension, cantidad;
      try {
        dimension = enteroPositivo(dimensionVector.value, "La dimensión");
      } catch (error) {
        mostrarError(error.message);
        return;
      }

      const operacion = operacionVector.value;

      if (operacion === "Suma" || operacion === "Combinación lineal") {
        try {
          cantidad = enteroPositivo(cantidadVectores.value, "La cantidad de vectores");
        } catch (error) {
          mostrarError(error.message);
          return;
        }
      } else {
        cantidad = 2;
      }

      marcoVectores.innerHTML = "";
      entradasVectores = [];
      entradasObjetivo = [];
      entradaEscalarVector = null;

      let total;
      if (operacion === "Suma" || operacion === "Combinación lineal") total = cantidad;
      else if (operacion === "Vector por escalar") total = 1;
      else total = 2;

      for (let j = 0; j < total; j++) {
        const columnaEntradas = [];
        const columna = el("div", { class: "columna-vector" });
        columna.appendChild(el("div", { class: "titulo-tabla", texto: `v${j + 1}` }));
        for (let i = 0; i < dimension; i++) {
          const entrada = crearCelda();
          columna.appendChild(entrada);
          columnaEntradas.push(entrada);
        }
        entradasVectores.push(columnaEntradas);
        marcoVectores.appendChild(columna);
      }

      if (operacion === "Combinación lineal") {
        const columna = el("div", { class: "columna-vector" });
        columna.appendChild(el("div", { class: "titulo-tabla", texto: "objetivo" }));
        for (let i = 0; i < dimension; i++) {
          const entrada = crearCelda();
          columna.appendChild(entrada);
          entradasObjetivo.push(entrada);
        }
        marcoVectores.appendChild(columna);
      } else if (operacion === "Vector por escalar") {
        entradaEscalarVector = crearCelda();
        const columna = el("div", { class: "columna-vector" });
        columna.appendChild(el("div", { class: "titulo-tabla", texto: "Escalar" }));
        columna.appendChild(entradaEscalarVector);
        marcoVectores.appendChild(columna);
      }
    }

    function leerVector(entradas) {
      return entradas.map((entrada) => entrada.value.trim());
    }

    async function calcularVectores() {
      const operacion = operacionVector.value;
      const vectores = entradasVectores.map(leerVector);

      let cuerpo;
      if (operacion === "Suma") {
        cuerpo = { operacion, vectores, modo };
      } else if (operacion === "Resta") {
        cuerpo = { operacion, vectores: [vectores[0], vectores[1]], modo };
      } else if (operacion === "Vector por escalar") {
        cuerpo = {
          operacion,
          vectores: [vectores[0]],
          escalar: entradaEscalarVector.value.trim(),
          modo,
        };
      } else {
        cuerpo = { operacion, vectores, objetivo: leerVector(entradasObjetivo), modo };
      }

      try {
        const resultado = await llamarApi("/api/vectores", cuerpo);
        renderBloqueOperacion(panelResultado, resultado);
      } catch (error) {
        mostrarError(error.message);
      }
    }

    const controlesVectores = crearControles([
      el("label", { texto: "Operación:" }),
      operacionVector,
      el("label", { texto: "Dimensión:" }),
      dimensionVector,
      el("label", { texto: "Vectores:" }),
      cantidadVectores,
      el("button", { class: "btn", texto: "Crear campos", onclick: crearCamposVectores }),
      el("button", { class: "btn", texto: "Calcular", onclick: calcularVectores }),
    ]);

    const tabVectores = el("div", {}, [controlesVectores, marcoVectores]);

    /* ---------- Sub-vista: Matrices ---------- */

    let entradasMatrizA = [];
    let entradasMatrizB = [];
    let entradaEscalarMatriz = null;

    const operacionMatriz = el("select", {}, [
      el("option", { value: "Suma", texto: "Suma" }),
      el("option", { value: "Resta", texto: "Resta" }),
      el("option", { value: "Matriz por escalar", texto: "Matriz por escalar" }),
      el("option", { value: "Multiplicación A × B", texto: "Multiplicación A × B" }),
    ]);

    const filasA = el("input", { type: "number", min: "1", value: "2" });
    filasA.style.width = "50px";
    const columnasA = el("input", { type: "number", min: "1", value: "2" });
    columnasA.style.width = "50px";
    const filasB = el("input", { type: "number", min: "1", value: "2" });
    filasB.style.width = "50px";
    const columnasB = el("input", { type: "number", min: "1", value: "2" });
    columnasB.style.width = "50px";

    const marcoMatrices = el("div", { class: "grupo-tablas" });

    operacionMatriz.addEventListener("change", crearCamposMatrices);

    function crearTabla(padre, filas, columnas, titulo) {
      const marco = el("div", { class: "marco-tabla" });
      marco.appendChild(el("div", { class: "titulo-tabla", texto: titulo }));
      const grid = el("div", {
        class: "tabla-genérica",
        style: `grid-template-columns: repeat(${columnas}, auto);`,
      });
      const entradas = [];
      for (let i = 0; i < filas; i++) {
        const fila = [];
        for (let j = 0; j < columnas; j++) {
          const entrada = crearCelda();
          grid.appendChild(entrada);
          fila.push(entrada);
        }
        entradas.push(fila);
      }
      marco.appendChild(grid);
      padre.appendChild(marco);
      return entradas;
    }

    function crearCamposMatrices() {
      let fa, ca, fb, cb;
      try {
        fa = enteroPositivo(filasA.value, "Las filas de A");
        ca = enteroPositivo(columnasA.value, "Las columnas de A");
      } catch (error) {
        mostrarError(error.message);
        return;
      }

      const operacion = operacionMatriz.value;

      if (operacion !== "Matriz por escalar") {
        try {
          fb = enteroPositivo(filasB.value, "Las filas de B");
          cb = enteroPositivo(columnasB.value, "Las columnas de B");
        } catch (error) {
          mostrarError(error.message);
          return;
        }
      }

      marcoMatrices.innerHTML = "";
      entradasMatrizA = crearTabla(marcoMatrices, fa, ca, "Matriz A");
      entradasMatrizB = [];
      entradaEscalarMatriz = null;

      if (operacion === "Matriz por escalar") {
        const marco = el("div", { class: "marco-tabla" });
        marco.appendChild(el("div", { class: "titulo-tabla", texto: "Escalar" }));
        entradaEscalarMatriz = crearCelda();
        marco.appendChild(entradaEscalarMatriz);
        marcoMatrices.appendChild(marco);
      } else {
        entradasMatrizB = crearTabla(marcoMatrices, fb, cb, "Matriz B");
      }
    }

    function leerMatriz(entradas) {
      return entradas.map((fila) => fila.map((entrada) => entrada.value.trim()));
    }

    async function calcularMatrices() {
      const operacion = operacionMatriz.value;
      const matrizA = leerMatriz(entradasMatrizA);

      let cuerpo;
      if (operacion === "Matriz por escalar") {
        cuerpo = { operacion, matriz_a: matrizA, escalar: entradaEscalarMatriz.value.trim(), modo };
      } else {
        cuerpo = { operacion, matriz_a: matrizA, matriz_b: leerMatriz(entradasMatrizB), modo };
      }

      try {
        const resultado = await llamarApi("/api/matrices", cuerpo);
        renderBloqueOperacion(panelResultado, resultado);
      } catch (error) {
        mostrarError(error.message);
      }
    }

    const controlesMatrices = crearControles([
      el("label", { texto: "Operación:" }),
      operacionMatriz,
      el("label", { texto: "A filas:" }), filasA,
      el("label", { texto: "A cols:" }), columnasA,
      el("label", { texto: "B filas:" }), filasB,
      el("label", { texto: "B cols:" }), columnasB,
      el("button", { class: "btn", texto: "Crear", onclick: crearCamposMatrices }),
      el("button", { class: "btn", texto: "Calcular", onclick: calcularMatrices }),
    ]);

    const tabMatrices = el("div", {}, [controlesMatrices, marcoMatrices]);

    /* ---------- Sub-vista: Ecuación A·X = B ---------- */

    let entradasEcuacionA = [];
    let entradasEcuacionB = [];

    const ecFilasA = el("input", { type: "number", min: "1", value: "2" });
    ecFilasA.style.width = "50px";
    const ecColumnasA = el("input", { type: "number", min: "1", value: "2" });
    ecColumnasA.style.width = "50px";
    const ecColumnasB = el("input", { type: "number", min: "1", value: "1" });
    ecColumnasB.style.width = "50px";

    const marcoEcuacion = el("div", { class: "grupo-tablas" });

    function crearCamposEcuacion() {
      let filas, ca, cb;
      try {
        filas = enteroPositivo(ecFilasA.value, "Las filas de A");
        ca = enteroPositivo(ecColumnasA.value, "Las columnas de A");
        cb = enteroPositivo(ecColumnasB.value, "Las columnas de B");
      } catch (error) {
        mostrarError(error.message);
        return;
      }

      marcoEcuacion.innerHTML = "";
      entradasEcuacionA = crearTabla(marcoEcuacion, filas, ca, "Matriz A");
      entradasEcuacionB = crearTabla(marcoEcuacion, filas, cb, "Matriz B");
    }

    async function calcularEcuacion() {
      const cuerpo = {
        matriz_a: leerMatriz(entradasEcuacionA),
        matriz_b: leerMatriz(entradasEcuacionB),
        modo,
      };

      try {
        const resultado = await llamarApi("/api/ecuacion-matricial", cuerpo);
        renderBloqueOperacion(panelResultado, resultado);
      } catch (error) {
        mostrarError(error.message);
      }
    }

    const controlesEcuacion = crearControles([
      el("label", { texto: "A filas:" }), ecFilasA,
      el("label", { texto: "A cols:" }), ecColumnasA,
      el("label", { texto: "B cols:" }), ecColumnasB,
      el("button", { class: "btn", texto: "Crear campos", onclick: crearCamposEcuacion }),
      el("button", { class: "btn", texto: "Resolver", onclick: calcularEcuacion }),
    ]);

    const tabEcuacion = el("div", {}, [controlesEcuacion, marcoEcuacion]);

    /* ---------- Sub-vista: Matriz inversa ---------- */

    let entradasInversa = [];

    const inversaN = el("input", { type: "number", min: "1", value: "3" });
    inversaN.style.width = "50px";
    const metodoInversa = el("select", {}, [
      el("option", { value: "gauss_jordan", texto: "Gauss-Jordan" }),
      el("option", { value: "pivoteo", texto: "Pivoteo" }),
    ]);
    const marcoInversa = el("div", { class: "grupo-tablas" });

    function crearCamposInversa() {
      let n;
      try {
        n = enteroPositivo(inversaN.value, "El tamaño n");
      } catch (error) {
        mostrarError(error.message);
        return;
      }

      marcoInversa.innerHTML = "";
      entradasInversa = crearTabla(marcoInversa, n, n, "Matriz A");
    }

    async function calcularInversa() {
      const cuerpo = {
        matriz: leerMatriz(entradasInversa),
        metodo: metodoInversa.value,
        modo,
      };

      try {
        const resultado = await llamarApi("/api/inversa", cuerpo);
        renderBloqueOperacion(panelResultado, resultado);
      } catch (error) {
        mostrarError(error.message);
      }
    }

    const controlesInversa = crearControles([
      el("label", { texto: "Tamaño n (n × n):" }), inversaN,
      el("label", { texto: "Método:" }), metodoInversa,
      el("button", { class: "btn", texto: "Crear campos", onclick: crearCamposInversa }),
      el("button", { class: "btn", texto: "Calcular inversa", onclick: calcularInversa }),
    ]);

    const tabInversa = el("div", {}, [controlesInversa, marcoInversa]);

    /* ---------- Ensamblado de pestañas ---------- */

    const contenidoVectores = el("div", { class: "tab-contenido activa" }, [tabVectores]);
    const contenidoMatrices = el("div", { class: "tab-contenido" }, [tabMatrices]);
    const contenidoEcuacion = el("div", { class: "tab-contenido" }, [tabEcuacion]);
    const contenidoInversa = el("div", { class: "tab-contenido" }, [tabInversa]);

    const botonTabVectores = el("button", { class: "tab-btn active", texto: "Vectores" });
    const botonTabMatrices = el("button", { class: "tab-btn", texto: "Matrices" });
    const botonTabEcuacion = el("button", { class: "tab-btn", texto: "Ecuación A·X = B" });
    const botonTabInversa = el("button", { class: "tab-btn", texto: "Matriz inversa" });

    function activarPestana(boton, contenido) {
      for (const [b, c] of [
        [botonTabVectores, contenidoVectores],
        [botonTabMatrices, contenidoMatrices],
        [botonTabEcuacion, contenidoEcuacion],
        [botonTabInversa, contenidoInversa],
      ]) {
        b.classList.toggle("active", b === boton);
        c.classList.toggle("activa", c === contenido);
      }
      // En pantallas angostas las pestañas hacen scroll: la activa queda a la vista.
      if (boton.isConnected) boton.scrollIntoView({ block: "nearest", inline: "nearest" });
      // El panel de resultado es compartido por todas las pestañas: se limpia
      // al cambiar de pestaña para no dejar visible el resultado de una
      // operación distinta (p. ej. un resultado de "Vectores" mientras se
      // mira la pestaña "Matrices").
      panelResultado.innerHTML = "";
    }

    botonTabVectores.addEventListener("click", () => activarPestana(botonTabVectores, contenidoVectores));
    botonTabMatrices.addEventListener("click", () => activarPestana(botonTabMatrices, contenidoMatrices));
    botonTabEcuacion.addEventListener("click", () => activarPestana(botonTabEcuacion, contenidoEcuacion));
    botonTabInversa.addEventListener("click", () => activarPestana(botonTabInversa, contenidoInversa));

    const tabs = el("div", { class: "tabs" }, [botonTabVectores, botonTabMatrices, botonTabEcuacion, botonTabInversa]);
    const panelTabs = el("div", { class: "tab-panel" }, [
      contenidoVectores, contenidoMatrices, contenidoEcuacion, contenidoInversa,
    ]);

    const radioFraccion = el("input", { type: "radio", name: "modo-vm", value: "fraccion", checked: "checked" });
    const radioDecimal = el("input", { type: "radio", name: "modo-vm", value: "decimal" });
    radioFraccion.addEventListener("change", () => { modo = "fraccion"; });
    radioDecimal.addEventListener("change", () => { modo = "decimal"; });

    const formato = el("div", { class: "formato" }, [
      el("span", { texto: "Mostrar resultados en:" }),
      el("label", {}, [radioFraccion, document.createTextNode(" Fracciones")]),
      el("label", {}, [radioDecimal, document.createTextNode(" Decimales")]),
    ]);

    crearCamposVectores();
    crearCamposMatrices();
    crearCamposEcuacion();
    crearCamposInversa();

    if (ejercicio && ejercicio.categoria) {
      cargarEjercicio(ejercicio);
    }

    /* Abre la pestaña de la operación y rellena sus campos con los datos del
       ejercicio (sin calcular). */
    function cargarEjercicio(ej) {
      const d = ej.datos;

      if (ej.categoria === "vectores") {
        operacionVector.value = ej.operacion;
        dimensionVector.value = String(d.vectores[0].length);
        cantidadVectores.value = String(d.vectores.length);
        crearCamposVectores();
        d.vectores.forEach((vector, j) => llenarVector(entradasVectores[j], vector));
        if (d.objetivo) llenarVector(entradasObjetivo, d.objetivo);
        if (d.escalar !== undefined) entradaEscalarVector.value = d.escalar;
        activarPestana(botonTabVectores, contenidoVectores);
      } else if (ej.categoria === "matrices") {
        operacionMatriz.value = ej.operacion;
        filasA.value = String(d.matriz_a.length);
        columnasA.value = String(d.matriz_a[0].length);
        if (d.matriz_b) {
          filasB.value = String(d.matriz_b.length);
          columnasB.value = String(d.matriz_b[0].length);
        }
        crearCamposMatrices();
        llenarEntradas(entradasMatrizA, d.matriz_a);
        if (d.matriz_b) llenarEntradas(entradasMatrizB, d.matriz_b);
        if (d.escalar !== undefined) entradaEscalarMatriz.value = d.escalar;
        activarPestana(botonTabMatrices, contenidoMatrices);
      } else if (ej.categoria === "ecuacion-matricial") {
        ecFilasA.value = String(d.matriz_a.length);
        ecColumnasA.value = String(d.matriz_a[0].length);
        ecColumnasB.value = String(d.matriz_b[0].length);
        crearCamposEcuacion();
        llenarEntradas(entradasEcuacionA, d.matriz_a);
        llenarEntradas(entradasEcuacionB, d.matriz_b);
        activarPestana(botonTabEcuacion, contenidoEcuacion);
      } else if (ej.categoria === "inversa") {
        inversaN.value = String(d.matriz.length);
        crearCamposInversa();
        llenarEntradas(entradasInversa, d.matriz);
        activarPestana(botonTabInversa, contenidoInversa);
      }
    }

    return el("div", {}, [
      el("div", { class: "titulo", texto: "Vectores y matrices" }),
      tabs,
      panelTabs,
      formato,
      panelResultado,
    ]);
  }

  /* ==========================================================
     VISTA: DETERMINANTE (cofactores / LU)
     ========================================================== */

  const NOMBRE_METODO_DET = { cofactores: "Cofactores", lu: "LU" };

  /* Detalle recursivo de una expansión por cofactores (ya formateada). */
  function renderExpansionDetalle(paso) {
    if (paso.tipo === "base_1x1") {
      return el("div", { class: "termino-linea", texto: `det = ${paso.valor}` });
    }
    if (paso.tipo === "base_2x2") {
      return el("div", { class: "termino-linea", texto: paso.texto });
    }
    return el("div", { class: "termino-detalle" }, [
      el("div", { class: "termino-linea", texto: paso.expansion.motivo }),
      ...paso.terminos.map((t) => renderTerminoCofactor(t)),
    ]);
  }

  function renderTerminoCofactor(t) {
    const signo = t.signo > 0 ? "+" : "−";
    const nombre = `a${t.fila}${t.columna} = ${t.valor}  (signo ${signo})`;
    if (t.omitido) {
      return el("div", { class: "termino-linea omitido", texto: `${nombre}: vale 0, se omite.` });
    }
    return el("div", { class: "termino-detalle" }, [
      el("div", { class: "termino-linea", texto: `${nombre} · menor M${t.fila}${t.columna}:` }),
      crearTablaMatriz(t.menor, {}),
      renderExpansionDetalle(t.paso_menor),
      el("div", { class: "termino-linea", texto: `det(M${t.fila}${t.columna}) = ${t.det_menor}  →  aporte = ${t.aporte}` }),
    ]);
  }

  function renderPasoCofactores(t, indice, total) {
    return el("div", { class: "paso-tarjeta" }, [
      el("div", { class: "paso-encabezado" }, [
        el("span", { class: "paso-numero", texto: `Término ${indice + 1} de ${total}` }),
        el("span", { class: "paso-operacion tipo-eliminar", texto: `a${t.fila}${t.columna}` }),
      ]),
      renderTerminoCofactor(t),
    ]);
  }

  function renderPasoLU(paso, indice, total, n) {
    const encabezado = el("div", { class: "paso-encabezado" }, [
      el("span", { class: "paso-numero", texto: `Paso ${indice + 1} de ${total}` }),
      el("span", { class: "paso-operacion tipo-eliminar", texto: paso.tipo === "producto_diagonal" ? "Determinante" : `Columna ${paso.columna}` }),
    ]);

    if (paso.tipo === "producto_diagonal") {
      return el("div", { class: "paso-tarjeta" }, [
        encabezado,
        el("div", { class: "paso-descripcion", texto: "Producto de la diagonal de U, con el signo de los intercambios de filas:" }),
        el("div", { class: "planteamiento", texto: paso.texto }),
      ]);
    }

    if (paso.tipo === "sin_pivote") {
      return el("div", { class: "paso-tarjeta" }, [
        encabezado,
        el("div", { class: "paso-descripcion", texto: `No hay pivote en la columna ${paso.columna}: la diagonal de U tendrá un 0 y el determinante es 0.` }),
        el("div", { class: "ecuacion-comprobacion" }, [tablaConEtiqueta("U", paso.U)]),
      ]);
    }

    const partes = [encabezado];
    partes.push(el("div", { class: "paso-descripcion", texto: `Pivote: ${paso.pivote}` }));
    if (paso.intercambio) {
      partes.push(el("div", { class: "termino-linea", texto: `Intercambio de filas F${paso.intercambio[0]} ↔ F${paso.intercambio[1]} (cambia el signo).` }));
    }
    if (paso.multiplicadores.length) {
      partes.push(el("div", { class: "multiplicadores" }, paso.multiplicadores.map((m) =>
        el("div", { texto: `l${m.fila}${paso.columna} = ${m.valor}   →   F${m.fila} ← F${m.fila} − l${m.fila}${paso.columna}·F${paso.columna}` }))));
    } else {
      partes.push(el("div", { class: "termino-linea omitido", texto: "No hay nada que eliminar debajo del pivote." }));
    }
    const k = paso.columna - 1;
    partes.push(el("div", { class: "ecuacion-comprobacion" }, [
      el("div", { class: "matriz-etiquetada" }, [
        crearTablaMatriz(paso.U, { pivote: { fila: k, columna: k } }),
        el("div", { class: "matriz-etiqueta", texto: "U (hasta ahora)" }),
      ]),
      tablaConEtiqueta("L (multiplicadores)", paso.L),
    ]));
    return el("div", { class: "paso-tarjeta" }, partes);
  }

  function renderDeterminante(contenedor, bloque) {
    contenedor.innerHTML = "";
    const nombre = NOMBRE_METODO_DET[bloque.metodo];
    const matriz = bloque.entradas.matriz;
    const n = matriz.length;

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: `Determinante (${nombre})` }));
    contenedor.appendChild(el("div", { class: "ecuacion-comprobacion" }, [tablaConEtiqueta("A", matriz)]));

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Procedimiento" }));
    if (bloque.metodo === "cofactores") {
      const raiz = bloque.pasos[0];
      if (raiz.tipo === "expansion") {
        contenedor.appendChild(el("div", { class: "planteamiento", texto: raiz.expansion.motivo }));
        contenedor.appendChild(crearStepperGenerico(
          raiz.terminos, (t, i, total) => renderPasoCofactores(t, i, total)));
        contenedor.appendChild(el("div", { class: "planteamiento", texto:
          "det(A) = " + raiz.terminos.map((t) => `(${t.aporte})`).join(" + ") + ` = ${bloque.resultado}` }));
      } else {
        contenedor.appendChild(el("div", { class: "planteamiento" }, [renderExpansionDetalle(raiz)]));
      }
    } else {
      contenedor.appendChild(crearStepperGenerico(
        bloque.pasos, (paso, i, total) => renderPasoLU(paso, i, total, n)));
      contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Factorización P·A = L·U" }));
      contenedor.appendChild(el("div", { class: "ecuacion-comprobacion" }, [
        tablaConEtiqueta("P", bloque.P),
        el("span", { class: "simbolo-ecuacion", texto: "·A =" }),
        tablaConEtiqueta("L", bloque.L),
        el("span", { class: "simbolo-ecuacion", texto: "·" }),
        tablaConEtiqueta("U", bloque.U),
      ]));
    }

    const estimado = bloque.recomendacion[bloque.metodo].texto;
    contenedor.appendChild(crearTarjetaVeredicto({
      tipoClase: bloque.singular ? "tipo-infinitas" : "tipo-unica",
      icono: bloque.singular ? "∞" : "✓",
      titulo: `det(A) = ${bloque.resultado}`,
      detalle: bloque.singular
        ? "A es singular: su determinante es 0 y no tiene inversa."
        : "A no es singular: tiene inversa.",
      cuerpoTexto: `Método ${nombre}: ${bloque.multiplicaciones} multiplicaciones realizadas (estimación: ${estimado}).`,
    }));

    const comp = bloque.comprobacion;
    const ok = comp.correcto;
    const fact = comp.factorizacion;

    if (fact) {
      const marca = (bien) => (bien ? "✓" : "✕");
      contenedor.appendChild(crearTarjetaVeredicto({
        tipoClase: fact.correcto ? "tipo-unica" : "tipo-incompatible",
        icono: marca(fact.correcto),
        titulo: fact.correcto ? "L·U coincide con P·A" : "L·U no coincide con P·A",
        detalle: "Se vuelve a multiplicar L · U y se compara con P · A (A con las filas reordenadas por los intercambios).",
        cuerpoNodo: el("div", {}, [
          el("div", { class: "ecuacion-comprobacion" }, [
            tablaConEtiqueta("L", bloque.L),
            el("span", { class: "simbolo-ecuacion", texto: "·" }),
            tablaConEtiqueta("U", bloque.U),
            el("span", { class: "simbolo-ecuacion", texto: "=" }),
            tablaConEtiqueta("L · U", fact.LU),
          ]),
          el("div", { class: "ecuacion-comprobacion" }, [
            tablaConEtiqueta("P", bloque.P),
            el("span", { class: "simbolo-ecuacion", texto: "·" }),
            tablaConEtiqueta("A", matriz),
            el("span", { class: "simbolo-ecuacion", texto: "=" }),
            tablaConEtiqueta("P · A", fact.PA),
          ]),
          el("div", { class: "termino-linea", texto: `${marca(fact.igual)} L·U = P·A` }),
          el("div", { class: "termino-linea", texto: `${marca(fact.L_triangular)} L es triangular inferior con unos en la diagonal` }),
          el("div", { class: "termino-linea", texto: `${marca(fact.U_triangular)} U es triangular superior` }),
        ]),
      }));
    }

    if (comp.valor !== null) {
      contenedor.appendChild(crearTarjetaVeredicto({
        tipoClase: comp.valor === bloque.resultado ? "tipo-unica" : "tipo-incompatible",
        icono: comp.valor === bloque.resultado ? "✓" : "✕",
        titulo: ok ? "Comprobación correcta" : "Comprobación incorrecta",
        detalle: `Con ${NOMBRE_METODO_DET[comp.metodo]} se obtiene det(A) = ${comp.valor}.`,
      }));
    }

    if (bloque.escena) agregarGraficaEscena(contenedor, bloque.escena, "Gráfica del determinante");
  }

  function vistaDeterminante(ejercicio) {
    let modo = "fraccion";
    let entradas = [];
    let recomendacion = null;
    let metodoElegido = "lu";
    const panelResultado = el("div", { class: "resultado-panel" });
    const marcoMatriz = el("div", { class: "grupo-tablas" });
    const panelRecomendacion = el("div", {});

    const entradaN = el("input", { type: "number", min: "1", value: "3" });
    entradaN.style.width = "50px";
    const selectorExpansion = el("select", {}, [el("option", { value: "auto", texto: "Automática (más ceros)" })]);
    const campoExpansion = el("label", { class: "campo" }, [el("span", { texto: "Expandir por:" }), selectorExpansion]);

    function actualizarExpansion(n) {
      selectorExpansion.innerHTML = "";
      selectorExpansion.appendChild(el("option", { value: "auto", texto: "Automática (más ceros)" }));
      for (let i = 1; i <= n; i++) selectorExpansion.appendChild(el("option", { value: `fila:${i}`, texto: `Fila ${i}` }));
      for (let j = 1; j <= n; j++) selectorExpansion.appendChild(el("option", { value: `columna:${j}`, texto: `Columna ${j}` }));
    }

    function mostrarOpcionExpansion() {
      campoExpansion.style.display = metodoElegido === "cofactores" ? "" : "none";
    }

    function elegirMetodo(metodo) {
      metodoElegido = metodo;
      renderRecomendacion();
      mostrarOpcionExpansion();
    }

    function renderRecomendacion() {
      panelRecomendacion.innerHTML = "";
      if (!recomendacion) return;
      const r = recomendacion;
      const opcion = (clave) => {
        const disponible = r[`${clave}_disponible`];
        const radio = el("input", { type: "radio", name: "metodo-det", value: clave });
        radio.checked = metodoElegido === clave;
        radio.disabled = !disponible;
        radio.addEventListener("change", () => elegirMetodo(clave));
        return el("label", {
          class: `metodo-opcion${metodoElegido === clave ? " elegido" : ""}${disponible ? "" : " no-disponible"}`,
        }, [
          el("span", { class: "metodo-opcion-nombre" }, [
            radio, document.createTextNode(NOMBRE_METODO_DET[clave]),
            r.recomendado === clave ? el("span", { class: "etiqueta-recomendado", texto: "Recomendado" }) : null,
          ]),
          el("span", { class: "metodo-opcion-costo", texto: disponible
            ? r[clave].texto
            : `No disponible para n > ${r[`maximo_${clave}`]}` }),
        ]);
      };
      panelRecomendacion.appendChild(el("div", { class: "recomendacion" }, [
        el("div", { class: "recomendacion-titulo", texto: `¿Cuál conviene para n = ${r.n}?` }),
        el("div", { class: "recomendacion-motivo", texto: r.motivo }),
        el("div", { class: "metodo-opciones" }, [opcion("cofactores"), opcion("lu")]),
      ]));
    }

    function crearGrilla(n) {
      marcoMatriz.innerHTML = "";
      const marco = el("div", { class: "marco-tabla" });
      marco.appendChild(el("div", { class: "titulo-tabla", texto: "Matriz A" }));
      const grid = el("div", { class: "tabla-genérica", style: `grid-template-columns: repeat(${n}, auto);` });
      entradas = [];
      for (let i = 0; i < n; i++) {
        const fila = [];
        for (let j = 0; j < n; j++) {
          const entrada = crearCelda();
          grid.appendChild(entrada);
          fila.push(entrada);
        }
        entradas.push(fila);
      }
      marco.appendChild(grid);
      marcoMatriz.appendChild(marco);
    }

    /* Pide la recomendación al servidor (la web nunca calcula) y arma los campos. */
    async function crearCampos() {
      let n;
      try {
        n = enteroPositivo(entradaN.value, "El tamaño n");
        const r = await llamarApi("/api/determinante/recomendar", { n });
        if (!r.lu_disponible) {
          throw new Error(`El tamaño máximo admitido es n = ${r.maximo_lu}.`);
        }
        recomendacion = r;
      } catch (error) {
        mostrarError(error.message);
        return false;
      }
      metodoElegido = recomendacion.recomendado;
      crearGrilla(n);
      actualizarExpansion(n);
      renderRecomendacion();
      mostrarOpcionExpansion();
      panelResultado.innerHTML = "";
      return true;
    }

    async function calcular() {
      if (!entradas.length) {
        mostrarError("Crea primero los campos de la matriz.");
        return;
      }
      const cuerpo = {
        matriz: entradas.map((fila) => fila.map((e) => e.value.trim())),
        metodo: metodoElegido,
        modo,
      };
      if (metodoElegido === "cofactores" && selectorExpansion.value !== "auto") {
        const [tipo, indice] = selectorExpansion.value.split(":");
        cuerpo.expansion = { tipo, indice: parseInt(indice, 10) };
      }
      try {
        const resultado = await llamarApi("/api/determinante", cuerpo);
        renderDeterminante(panelResultado, resultado);
      } catch (error) {
        mostrarError(error.message);
      }
    }

    const controles = crearControles([
      el("label", { texto: "Tamaño n (n × n):" }), entradaN,
      el("button", { class: "btn", texto: "Crear campos", onclick: crearCampos }),
      campoExpansion,
      el("button", { class: "btn", texto: "Calcular determinante", onclick: calcular }),
    ]);

    const radioFraccion = el("input", { type: "radio", name: "modo-det", value: "fraccion", checked: "checked" });
    const radioDecimal = el("input", { type: "radio", name: "modo-det", value: "decimal" });
    radioFraccion.addEventListener("change", () => { modo = "fraccion"; });
    radioDecimal.addEventListener("change", () => { modo = "decimal"; });
    const formato = el("div", { class: "formato" }, [
      el("span", { texto: "Mostrar resultados en:" }),
      el("label", {}, [radioFraccion, document.createTextNode(" Fracciones")]),
      el("label", {}, [radioDecimal, document.createTextNode(" Decimales")]),
    ]);

    /* Ejercicio de práctica: carga la matriz y el método sugerido, sin calcular. */
    async function cargarEjercicio(ej) {
      entradaN.value = String(ej.datos.matriz.length);
      if (await crearCampos()) {
        llenarEntradas(entradas, ej.datos.matriz);
        if (ej.datos.metodo && recomendacion[`${ej.datos.metodo}_disponible`]) elegirMetodo(ej.datos.metodo);
      }
    }

    crearCampos().then(() => {
      if (ejercicio && ejercicio.datos) cargarEjercicio(ejercicio);
    });

    return el("div", {}, [
      el("div", { class: "titulo", texto: "Determinante" }),
      controles,
      panelRecomendacion,
      marcoMatriz,
      formato,
      panelResultado,
    ]);
  }

  /* ==========================================================
     VISTA: BISECCIÓN (búsqueda de raíces)
     ========================================================== */

  const DECISION_BISECCION = {
    izquierda: "f(a)·f(c) < 0: la raíz está en [a, c], así que b = c.",
    derecha: "f(a)·f(c) > 0: la raíz está en [c, b], así que a = c.",
    raiz_exacta: "f(c) = 0: c es la raíz exacta. Fin.",
  };

  const MOTIVO_BISECCION = {
    tolerancia: "Se alcanzó la tolerancia: εa/100 < E.",
    raiz_exacta: "Se encontró una raíz exacta: f(c) = 0.",
    max_iter: "Se agotó el máximo de iteraciones sin llegar a E.",
  };

  /* Métodos de raíces con el mismo formato de bloque (bisección y Regula Falsi):
     cada uno trae su título, ruta, cómo se calcula c y el texto del botón. */
  const METODOS_RAICES = {
    biseccion: {
      titulo: "Método de bisección", ruta: "/api/biseccion", boton: "Calcular raíz",
      calculoC: (p) => `c = (a + b) / 2 = (${p.a} + ${p.b}) / 2 = ${p.c}`,
    },
    falsa_posicion: {
      titulo: "Método de Regula Falsi", ruta: "/api/falsa-posicion", boton: "Calcular raíz",
      calculoC: (p) => `c = b − f(b)·(b − a) / (f(b) − f(a)) = ${p.b} − (${p.fb})·(${p.b} − ${p.a}) / (${p.fb} − (${p.fa})) = ${p.c}`,
      ayudaC: "c es donde la recta secante por (a, f(a)) y (b, f(b)) corta el eje x.",
    },
  };

  function renderPasoRaices(tipo, p, indice, total) {
    const cfg = METODOS_RAICES[tipo];
    const partes = [
      el("div", { class: "paso-encabezado" }, [
        el("span", { class: "paso-numero", texto: `Iteración ${p.i} de ${total}` }),
        el("span", { class: "paso-operacion tipo-eliminar", texto: `c = ${p.c}` }),
      ]),
      el("div", { class: "termino-linea", texto: cfg.calculoC(p) }),
      el("div", { class: "termino-linea", texto: `f(a) = ${p.fa}   f(c) = ${p.fc}` }),
      el("div", { class: "termino-linea", texto: DECISION_BISECCION[p.decision] }),
    ];
    if (p.decision !== "raiz_exacta") {
      partes.push(el("div", { class: "termino-linea", texto: `Nuevo intervalo: [${p.a_nuevo}, ${p.b_nuevo}]` }));
    }
    partes.push(el("div", {
      class: "termino-linea" + (p.error === "—" ? " omitido" : ""),
      texto: p.error === "—"
        ? "εa: se calcula desde la segunda iteración."
        : `εa = |(c − c anterior) / c| · 100 = ${p.error} %`,
    }));
    return el("div", { class: "paso-tarjeta" }, partes);
  }

  function svgEl(tag, atributos, texto) {
    const nodo = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [clave, valor] of Object.entries(atributos || {})) nodo.setAttribute(clave, valor);
    if (texto !== undefined) nodo.textContent = texto;
    return nodo;
  }

  /* Gráfica de f(x): solo dibuja los datos que arma metodos/grafica.py.
     El deslizador elige hasta qué iteración se muestran los puntos c y el
     intervalo [a, b] vigente. Es interactiva: arrastrar mueve la vista; la
     rueda, el pellizco y los botones hacen zoom; doble clic la restablece.
     La web nunca evalúa f: al mover o hacer zoom pide la curva de la nueva
     ventana a POST /api/grafica (metodos/grafica.curva_ventana). */
  let contadorGraficas = 0;

  function crearGraficaBiseccion(bloque) {
    const g = bloque.grafica, e = bloque.entradas, r = bloque.resultado;
    const total = g.iteraciones.length;
    const idRecorte = "g-recorte-" + (++contadorGraficas);
    let actual = total;

    // Vista actual (ventana de datos) y lo que el servidor dibujó para ella.
    const vistaInicial = { x0: g.x_min, x1: g.x_max, y0: g.y_min, y1: g.y_max };
    const vista = { ...vistaInicial };
    let curva = g.curva, marcasX = g.marcas_x, marcasY = g.marcas_y;
    let geo = { izq: 50, arr: 10, anchoUtil: 1, altoUtil: 1 };

    const lienzo = el("div", {
      class: "grafica-lienzo", tabindex: "0", role: "group",
      title: "Arrastra para mover · rueda o pellizco para zoom · Shift/Alt + rueda: solo x / solo y",
      "aria-label": "Gráfica interactiva. Flechas para mover, más y menos para el zoom, cero para restablecer.",
    });
    const estado = el("div", { class: "grafica-estado", "aria-live": "polite" });
    const cursor = el("div", { class: "grafica-cursor", "aria-hidden": "true" });
    const deslizador = el("input", {
      type: "range", min: 0, max: total, value: total, step: 1, id: "grafica-iteracion",
      "aria-label": "Iteración que se muestra en la gráfica",
    });
    const etiquetaIter = el("label", { for: "grafica-iteracion" });
    const control = el("div", { class: "grafica-control" }, [etiquetaIter, deslizador]);

    const botonMas = el("button", { type: "button", class: "grafica-boton", "aria-label": "Acercar", title: "Acercar (+)", texto: "+" });
    const botonMenos = el("button", { type: "button", class: "grafica-boton", "aria-label": "Alejar", title: "Alejar (−)", texto: "−" });
    const botonReset = el("button", { type: "button", class: "grafica-boton grafica-boton-texto", title: "Volver a la vista inicial (0 o doble clic)", texto: "Restablecer vista" });
    const herramientas = el("div", { class: "grafica-herramientas" }, [
      el("div", { class: "grafica-zoom", role: "group", "aria-label": "Zoom" }, [botonMas, botonMenos]),
      botonReset,
    ]);

    function textoEstado() {
      if (actual === 0) return `Intervalo inicial [${e.a}, ${e.b}]`;
      const p = bloque.pasos[actual - 1];
      return `Iteración ${actual}: c = ${p.c}, f(c) = ${p.fc} → nuevo intervalo [${p.a_nuevo}, ${p.b_nuevo}]`;
    }

    const acotar = (v) => Math.max(-1e6, Math.min(1e6, v));

    function dibujar() {
      const ancho = Math.max(240, Math.round(lienzo.clientWidth || 600));
      const alto = Math.round(Math.max(220, Math.min(380, ancho * 0.6)));
      const izq = 50, der = 12, arr = 10, aba = 28;
      const anchoUtil = ancho - izq - der, altoUtil = alto - arr - aba;
      geo = { izq, arr, anchoUtil, altoUtil };
      const sx = (x) => izq + ((x - vista.x0) / (vista.x1 - vista.x0)) * anchoUtil;
      const sy = (y) => arr + ((vista.y1 - y) / (vista.y1 - vista.y0)) * altoUtil;
      const xl = (x) => acotar(sx(x));          // coordenadas acotadas
      const yl = (y) => acotar(sy(y));

      const svg = svgEl("svg", {
        viewBox: `0 0 ${ancho} ${alto}`, role: "img",
        "aria-label": `Gráfica de f(x) = ${e.funcion} en [${e.a}, ${e.b}]` + (total ? ` con ${total} iteraciones` : ""),
      });
      const defs = svgEl("defs");
      const recorte = svgEl("clipPath", { id: idRecorte });
      recorte.appendChild(svgEl("rect", { x: izq, y: arr, width: anchoUtil, height: altoUtil }));
      defs.appendChild(recorte);
      svg.appendChild(defs);
      svg.appendChild(svgEl("rect", { class: "g-fondo", x: izq, y: arr, width: anchoUtil, height: altoUtil }));

      // Marcas: las que llegaron del servidor que caen dentro de la vista.
      for (const [v, texto] of marcasX) {
        const x = sx(v);
        if (x < izq - 1 || x > izq + anchoUtil + 1) continue;
        svg.appendChild(svgEl("line", { class: "g-rejilla", x1: x, x2: x, y1: arr, y2: arr + altoUtil }));
        svg.appendChild(svgEl("text", { class: "g-tick", x, y: alto - 9, "text-anchor": "middle" }, texto));
      }
      for (const [v, texto] of marcasY) {
        const y = sy(v);
        if (y < arr - 1 || y > arr + altoUtil + 1) continue;
        svg.appendChild(svgEl("line", { class: "g-rejilla", x1: izq, x2: izq + anchoUtil, y1: y, y2: y }));
        svg.appendChild(svgEl("text", { class: "g-tick", x: izq - 6, y: y + 4, "text-anchor": "end" }, texto));
      }

      // Todo lo que se mueve con la vista va recortado al área de la gráfica.
      const area = svgEl("g", { "clip-path": `url(#${idRecorte})` });
      svg.appendChild(area);

      // Intervalo [a, b] vigente (inicial o tras la iteración elegida).
      const [ia, ib] = actual === 0 ? g.intervalo : [g.iteraciones[actual - 1].a, g.iteraciones[actual - 1].b];
      const xa = xl(ia), xb = xl(ib);
      area.appendChild(svgEl("rect", { class: "g-intervalo", x: xa, y: arr, width: Math.max(xb - xa, 1.5), height: altoUtil }));
      for (const x of [xa, xb]) {
        area.appendChild(svgEl("line", { class: "g-intervalo-borde", x1: x, x2: x, y1: arr, y2: arr + altoUtil }));
      }

      // Discontinuidades detectadas (línea si es un punto, banda si es un tramo).
      for (const d of g.discontinuidades) {
        const x1 = xl(d.desde), x2 = xl(d.hasta);
        if (x2 - x1 > 3) area.appendChild(svgEl("rect", { class: "g-disc-banda", x: x1, y: arr, width: x2 - x1, height: altoUtil }));
        else area.appendChild(svgEl("line", { class: "g-disc", x1: (x1 + x2) / 2, x2: (x1 + x2) / 2, y1: arr, y2: arr + altoUtil }));
      }

      // Ejes y = 0 y x = 0 (cuando caen dentro de la vista).
      if (vista.y0 < 0 && vista.y1 > 0) {
        area.appendChild(svgEl("line", { class: "g-eje", x1: izq, x2: izq + anchoUtil, y1: sy(0), y2: sy(0) }));
      }
      if (vista.x0 < 0 && vista.x1 > 0) {
        area.appendChild(svgEl("line", { class: "g-eje", x1: sx(0), x2: sx(0), y1: arr, y2: arr + altoUtil }));
      }

      for (const tramo of curva) {
        area.appendChild(svgEl("path", { class: "g-curva", d: tramo.map((p, k) => `${k ? "L" : "M"}${xl(p[0]).toFixed(1)} ${yl(p[1]).toFixed(1)}`).join("") }));
      }

      // Regula Falsi: la recta secante de la iteración mostrada (de (a, f(a)) a (b, f(b))).
      if (actual > 0 && g.iteraciones[actual - 1].secante) {
        const [[x1, y1], [x2, y2]] = g.iteraciones[actual - 1].secante;
        area.appendChild(svgEl("line", { class: "g-secante", x1: xl(x1), y1: yl(y1), x2: xl(x2), y2: yl(y2) }));
      }

      // Un punto cuyo f queda fuera de la vista se pega al borde.
      const enBorde = (y) => Math.max(arr, Math.min(arr + altoUtil, sy(y)));
      const dentroX = (x) => { const px = sx(x); return px >= izq - 8 && px <= izq + anchoUtil + 8; };

      // Puntos c de las iteraciones mostradas; el último, resaltado y rotulado.
      g.iteraciones.slice(0, actual).forEach((p, k) => {
        if (!dentroX(p.x)) return;
        const ultimo = k === actual - 1;
        area.appendChild(svgEl("circle", { class: ultimo ? "g-punto g-punto-actual" : "g-punto", cx: sx(p.x), cy: enBorde(p.valor), r: ultimo ? 6 : 3.5 }));
      });
      if (actual > 0 && dentroX(g.iteraciones[actual - 1].x)) {
        const p = g.iteraciones[actual - 1];
        const derecha = sx(p.x) < izq + anchoUtil * 0.7;
        area.appendChild(svgEl("text", {
          class: "g-etiqueta", x: sx(p.x) + (derecha ? 9 : -9), y: Math.min(Math.max(enBorde(p.valor) - 9, arr + 12), arr + altoUtil - 4),
          "text-anchor": derecha ? "start" : "end",
        }, `c${actual}`));
      }

      // Raíz final (solo cuando se muestran todas las iteraciones).
      if (total > 0 && actual === total && g.raiz && dentroX(g.raiz.x)) {
        area.appendChild(svgEl("circle", { class: "g-raiz", cx: sx(g.raiz.x), cy: enBorde(g.raiz.valor), r: 5 }));
      }

      svg.appendChild(svgEl("rect", { class: "g-marco", x: izq, y: arr, width: anchoUtil, height: altoUtil }));

      lienzo.replaceChildren(svg);
      if (total === 0) {
        estado.textContent = `f(x) = ${e.funcion} en [${e.a}, ${e.b}]`;
        return;
      }
      etiquetaIter.textContent = `Iteración: ${actual} de ${total}`;
      estado.textContent = textoEstado() + (actual === total ? ` · raíz ≈ ${r.raiz}` : "");
    }

    let cuadro = 0;
    function redibujar() {
      if (cuadro) return;
      cuadro = requestAnimationFrame(() => { cuadro = 0; dibujar(); });
    }

    /* ---- Pedir al servidor la curva de la ventana visible ---- */
    let temporizador = 0, enviadas = 0, aplicada = 0;
    function pedirCurva() {
      if (temporizador) return;
      temporizador = setTimeout(async () => {
        temporizador = 0;
        const numero = ++enviadas;
        try {
          const d = await llamarApi("/api/grafica", {
            funcion: e.funcion, x_min: vista.x0, x_max: vista.x1, y_min: vista.y0, y_max: vista.y1,
          });
          if (numero < aplicada) return;      // llegó una respuesta más nueva antes
          aplicada = numero;
          curva = d.curva; marcasX = d.marcas_x; marcasY = d.marcas_y;
          redibujar();
        } catch (error) { /* se queda con lo dibujado; el siguiente movimiento reintenta */ }
      }, 70);
    }

    function vistaValida(v) {
      const ok = (a, b) => {
        const escala = Math.max(1, Math.abs(a), Math.abs(b));
        return Number.isFinite(a) && Number.isFinite(b) && b - a > 1e-10 * escala && b - a < 1e10 && escala < 1e11;
      };
      return ok(v.x0, v.x1) && ok(v.y0, v.y1);
    }
    function aplicarVista(nueva) {
      if (!vistaValida(nueva)) return;
      Object.assign(vista, nueva);
      redibujar();
      pedirCurva();
    }

    // Zoom por un factor (< 1 acerca) alrededor de una posición (0..1) de la vista.
    function zoom(factor, fx, fy, ejes) {
      const ex = ejes !== "y", ey = ejes !== "x";
      const wx = vista.x1 - vista.x0, wy = vista.y1 - vista.y0;
      const cx = vista.x0 + fx * wx, cy = vista.y1 - fy * wy;
      aplicarVista({
        x0: ex ? cx - (cx - vista.x0) * factor : vista.x0,
        x1: ex ? cx + (vista.x1 - cx) * factor : vista.x1,
        y0: ey ? cy - (cy - vista.y0) * factor : vista.y0,
        y1: ey ? cy + (vista.y1 - cy) * factor : vista.y1,
      });
    }
    // Mover la vista una fracción de su tamaño (positivo: hacia la derecha / arriba).
    function mover(fracX, fracY) {
      const wx = vista.x1 - vista.x0, wy = vista.y1 - vista.y0;
      aplicarVista({
        x0: vista.x0 + fracX * wx, x1: vista.x1 + fracX * wx,
        y0: vista.y0 + fracY * wy, y1: vista.y1 + fracY * wy,
      });
    }
    function restablecer() {
      Object.assign(vista, vistaInicial);
      curva = g.curva; marcasX = g.marcas_x; marcasY = g.marcas_y;
      aplicada = ++enviadas;                  // descarta respuestas en camino
      redibujar();
    }

    /* ---- Gestos ---- */
    const punteros = new Map();               // id → {x, y} en px del lienzo
    const posicion = (ev) => {
      const caja = lienzo.getBoundingClientRect();
      return { x: ev.clientX - caja.left, y: ev.clientY - caja.top };
    };
    const fraccion = (p) => ({
      fx: Math.max(0, Math.min(1, (p.x - geo.izq) / geo.anchoUtil)),
      fy: Math.max(0, Math.min(1, (p.y - geo.arr) / geo.altoUtil)),
    });
    const dentroDelArea = (p) => p.x >= geo.izq && p.x <= geo.izq + geo.anchoUtil &&
      p.y >= geo.arr && p.y <= geo.arr + geo.altoUtil;

    lienzo.addEventListener("pointerdown", (ev) => {
      if (ev.pointerType === "mouse" && ev.button !== 0) return;
      punteros.set(ev.pointerId, posicion(ev));
      try { lienzo.setPointerCapture(ev.pointerId); } catch (error) { /* sin captura */ }
      lienzo.classList.add("arrastrando");
    });
    lienzo.addEventListener("pointermove", (ev) => {
      const p = posicion(ev);
      if (!punteros.has(ev.pointerId)) {
        if (dentroDelArea(p)) {
          const { fx, fy } = fraccion(p);
          cursor.textContent = `x = ${(vista.x0 + fx * (vista.x1 - vista.x0)).toPrecision(5)}   y = ${(vista.y1 - fy * (vista.y1 - vista.y0)).toPrecision(5)}`;
        } else cursor.textContent = "";
        return;
      }
      const anterior = punteros.get(ev.pointerId);
      const otros = [...punteros.entries()].filter(([id]) => id !== ev.pointerId).map(([, q]) => q);
      punteros.set(ev.pointerId, p);
      const wx = vista.x1 - vista.x0, wy = vista.y1 - vista.y0;
      if (otros.length === 0) {              // un dedo / el ratón: mover
        const dx = p.x - anterior.x, dy = p.y - anterior.y;
        aplicarVista({
          x0: vista.x0 - (dx / geo.anchoUtil) * wx, x1: vista.x1 - (dx / geo.anchoUtil) * wx,
          y0: vista.y0 + (dy / geo.altoUtil) * wy, y1: vista.y1 + (dy / geo.altoUtil) * wy,
        });
      } else {                               // dos dedos: pellizco (zoom + mover)
        const otro = otros[0];
        const antes = Math.hypot(anterior.x - otro.x, anterior.y - otro.y);
        const ahora = Math.hypot(p.x - otro.x, p.y - otro.y);
        if (antes > 8 && ahora > 8) {
          const centro = { x: (p.x + otro.x) / 2, y: (p.y + otro.y) / 2 };
          const { fx, fy } = fraccion(centro);
          zoom(antes / ahora, fx, fy);
        }
      }
    });
    const soltar = (ev) => {
      punteros.delete(ev.pointerId);
      if (punteros.size === 0) lienzo.classList.remove("arrastrando");
    };
    lienzo.addEventListener("pointerup", soltar);
    lienzo.addEventListener("pointercancel", soltar);
    lienzo.addEventListener("pointerleave", (ev) => { if (!punteros.has(ev.pointerId)) cursor.textContent = ""; });
    lienzo.addEventListener("dblclick", restablecer);

    lienzo.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      const delta = (ev.deltaY || ev.deltaX) * (ev.deltaMode === 1 ? 16 : 1);
      const { fx, fy } = fraccion(posicion(ev));
      zoom(Math.exp(Math.max(-200, Math.min(200, delta)) * 0.0015), fx, fy,
        ev.shiftKey ? "x" : ev.altKey ? "y" : undefined);
    }, { passive: false });

    lienzo.addEventListener("keydown", (ev) => {
      const teclas = {
        ArrowLeft: () => mover(-0.1, 0), ArrowRight: () => mover(0.1, 0),
        ArrowUp: () => mover(0, 0.1), ArrowDown: () => mover(0, -0.1),
        "+": () => zoom(0.8, 0.5, 0.5), "=": () => zoom(0.8, 0.5, 0.5),
        "-": () => zoom(1.25, 0.5, 0.5), "_": () => zoom(1.25, 0.5, 0.5),
        "0": restablecer,
      };
      if (teclas[ev.key]) { ev.preventDefault(); teclas[ev.key](); }
    });

    botonMas.addEventListener("click", () => zoom(0.7, 0.5, 0.5));
    botonMenos.addEventListener("click", () => zoom(1 / 0.7, 0.5, 0.5));
    botonReset.addEventListener("click", restablecer);
    deslizador.addEventListener("input", () => { actual = Number(deslizador.value); dibujar(); });

    const leyenda = el("div", { class: "grafica-leyenda" }, [
      el("span", {}, [el("i"), document.createTextNode("f(x)")]),
      el("span", {}, [el("i", { class: "l-punto" }), document.createTextNode(bloque.tipo === "falsa_posicion" ? "punto c de cada iteración (corte de la secante)" : "punto medio c de cada iteración")]),
      g.iteraciones.some((p) => p.secante) ? el("span", {}, [el("i", { class: "l-secante" }), document.createTextNode("recta secante de la iteración")]) : null,
      el("span", {}, [el("i", { class: "l-intervalo" }), document.createTextNode("intervalo [a, b] vigente")]),
      el("span", {}, [el("i", { class: "l-raiz" }), document.createTextNode("raíz aproximada")]),
      g.discontinuidades.length ? el("span", {}, [el("i", { class: "l-disc" }), document.createTextNode("posible discontinuidad")]) : null,
    ]);

    const marco = el("div", { class: "grafica-marco" }, [herramientas, lienzo, cursor, ...(total > 0 ? [control] : []), estado, leyenda]);
    let anchoPrevio = 0;
    if (typeof ResizeObserver === "function") {
      new ResizeObserver(() => {
        const w = Math.round(lienzo.clientWidth);
        if (w > 0 && w !== anchoPrevio) { anchoPrevio = w; dibujar(); }
      }).observe(lienzo);
    }
    requestAnimationFrame(dibujar);
    return marco;
  }

  /* Sección que muestra u oculta `cuerpo` (el elemento que le sigue): un botón
     con el título y una flecha. `oculto`
     dice cómo empieza; el usuario decide cuándo cambiarlo. */
  function crearSeccionDesplegable(texto, cuerpo, oculto, icono) {
    const flecha = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" ' +
      'stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
    const boton = el("button", { type: "button", class: "seccion-desplegable" }, [
      icono ? el("span", { class: "sd-pictograma", "aria-hidden": "true", html: icono }) : null,
      el("span", { class: "sd-titulo", texto }),
      el("span", { class: "sd-icono", "aria-hidden": "true", html: flecha }),
    ]);
    function aplicar() {
      cuerpo.hidden = oculto;
      boton.setAttribute("aria-expanded", String(!oculto));
      boton.setAttribute("title", `${oculto ? "Mostrar" : "Ocultar"}: ${texto}`);
    }
    boton.addEventListener("click", () => { oculto = !oculto; aplicar(); });
    aplicar();
    return boton;
  }

  /* ---------- Escenas geométricas (spec 014) ----------
     Python (metodos/escena.py y escenas.py) decide qué se dibuja; aquí solo
     se pinta. Lo único que se calcula en la web es presentación: las marcas
     de los ejes y el movimiento de la vista (mover, zoom). */

  /* Marcas "bonitas" (pasos 1-2-5) de un eje; solo para rotular. */
  function marcasEje(minimo, maximo, aprox) {
    const ancho = maximo - minimo;
    if (!(ancho > 0)) return [];
    const bruto = ancho / aprox;
    const potencia = Math.pow(10, Math.floor(Math.log10(bruto)));
    let paso = potencia;
    for (const f of [1, 2, 5, 10]) { paso = f * potencia; if (paso >= bruto) break; }
    const escala = Math.max(Math.abs(minimo), Math.abs(maximo));
    const lista = [];
    for (let k = Math.ceil(minimo / paso - 1e-9); k * paso <= maximo + 1e-9 * paso; k++) {
      const v = Math.abs(k * paso) <= 1e-9 * escala ? 0 : Number((k * paso).toPrecision(12));
      lista.push([v, String(Number(v.toPrecision(4)))]);
    }
    return lista;
  }

  /* Mover (un puntero), pellizcar (dos), rueda, doble clic y teclado sobre
     `lienzo`. `acc`: { arrastrar(dx, dy), zoom(factor, px, py, ev), pellizco(factor, px, py),
     restablecer(), tecla(ev), cursor(px, py) | cursor(null) }; px, py en píxeles del lienzo. */
  function instalarGestosEscena(lienzo, acc) {
    const punteros = new Map();
    const posicion = (ev) => {
      const caja = lienzo.getBoundingClientRect();
      return { x: ev.clientX - caja.left, y: ev.clientY - caja.top };
    };
    /* Inercia (solo si `acc.inercia`): al soltar un arrastre rápido, la vista
       sigue girando y se frena sola. Cualquier otra acción la detiene. */
    const vel = { x: 0, y: 0, t: 0 };
    let animacionInercia = 0;
    const reducido = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function detenerInercia() {
      if (animacionInercia) { cancelAnimationFrame(animacionInercia); animacionInercia = 0; }
    }
    function iniciarInercia() {
      if (!acc.inercia || reducido() || performance.now() - vel.t > 80) return;
      if (Math.hypot(vel.x, vel.y) < 0.05) return;        // px por ms
      let previo = performance.now();
      const paso = (ahora) => {
        const dt = Math.min(48, ahora - previo);
        previo = ahora;
        vel.x *= Math.exp(-dt / 320); vel.y *= Math.exp(-dt / 320);
        if (!lienzo.isConnected || Math.hypot(vel.x, vel.y) < 0.015) { animacionInercia = 0; return; }
        acc.arrastrar(vel.x * dt, vel.y * dt);
        animacionInercia = requestAnimationFrame(paso);
      };
      animacionInercia = requestAnimationFrame(paso);
    }
    lienzo.addEventListener("pointerdown", (ev) => {
      if (ev.pointerType === "mouse" && ev.button !== 0) return;
      detenerInercia();
      vel.x = 0; vel.y = 0; vel.t = 0;
      punteros.set(ev.pointerId, posicion(ev));
      try { lienzo.setPointerCapture(ev.pointerId); } catch (error) { /* sin captura */ }
      lienzo.classList.add("arrastrando");
    });
    lienzo.addEventListener("pointermove", (ev) => {
      const p = posicion(ev);
      if (!punteros.has(ev.pointerId)) { acc.cursor(p.x, p.y); return; }
      const anterior = punteros.get(ev.pointerId);
      const otros = [...punteros.entries()].filter(([id]) => id !== ev.pointerId).map(([, q]) => q);
      punteros.set(ev.pointerId, p);
      if (otros.length === 0) {
        const ahora = performance.now();
        const dt = Math.max(1, ahora - (vel.t || ahora - 16));
        vel.x = 0.6 * ((p.x - anterior.x) / dt) + 0.4 * vel.x;
        vel.y = 0.6 * ((p.y - anterior.y) / dt) + 0.4 * vel.y;
        vel.t = ahora;
        acc.arrastrar(p.x - anterior.x, p.y - anterior.y);
      } else {
        vel.x = 0; vel.y = 0;
        const otro = otros[0];
        const antes = Math.hypot(anterior.x - otro.x, anterior.y - otro.y);
        const ahora = Math.hypot(p.x - otro.x, p.y - otro.y);
        if (antes > 8 && ahora > 8) acc.pellizco(antes / ahora, (p.x + otro.x) / 2, (p.y + otro.y) / 2);
      }
    });
    const soltar = (ev) => {
      punteros.delete(ev.pointerId);
      if (punteros.size === 0) lienzo.classList.remove("arrastrando");
    };
    lienzo.addEventListener("pointerup", (ev) => {
      const eraUnico = punteros.size === 1;
      soltar(ev);
      if (eraUnico) iniciarInercia();
    });
    lienzo.addEventListener("pointercancel", soltar);
    lienzo.addEventListener("pointerleave", (ev) => { if (!punteros.has(ev.pointerId)) acc.cursor(null); });
    lienzo.addEventListener("dblclick", () => { detenerInercia(); acc.restablecer(); });
    lienzo.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      detenerInercia();
      const delta = (ev.deltaY || ev.deltaX) * (ev.deltaMode === 1 ? 16 : 1);
      const p = posicion(ev);
      acc.zoom(Math.exp(Math.max(-200, Math.min(200, delta)) * 0.0015), p.x, p.y, ev);
    }, { passive: false });
    lienzo.addEventListener("keydown", (ev) => {
      detenerInercia();
      if (acc.tecla(ev)) ev.preventDefault();
    });
  }

  function crearAvisoEscena(texto) {
    return el("div", { class: "grafica-marco escena-no-disponible", texto });
  }

  let contadorEscenas = 0;

  /* Barra de zoom (+ / −) y "Restablecer vista" de una escena. */
  function crearHerramientasEscena() {
    const mas = el("button", { type: "button", class: "grafica-boton", "aria-label": "Acercar", title: "Acercar (+)", texto: "+" });
    const menos = el("button", { type: "button", class: "grafica-boton", "aria-label": "Alejar", title: "Alejar (−)", texto: "−" });
    const reset = el("button", { type: "button", class: "grafica-boton grafica-boton-texto", title: "Volver a la vista inicial (0 o doble clic)", texto: "Restablecer vista" });
    const nodo = el("div", { class: "grafica-herramientas" }, [
      el("div", { class: "grafica-zoom", role: "group", "aria-label": "Zoom" }, [mas, menos]),
      reset,
    ]);
    return { nodo, mas, menos, reset };
  }

  /* Leyenda de colores y avisos de una escena (debajo de la gráfica). */
  function crearPieEscena(escena) {
    const clase = (serie) => serie === "solucion" ? "e-sol" : "e-s" + ((serie % 6) + 1);
    const leyenda = el("div", { class: "grafica-leyenda" }, escena.leyenda.map((l) => el("span", {}, [
