<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Calculadora</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='2' width='22' height='28' rx='4' fill='%231abc9c'/><rect x='9' y='6' width='14' height='6' rx='1.5' fill='%23fff'/><g fill='%23fff'><circle cx='11' cy='17' r='1.8'/><circle cx='16' cy='17' r='1.8'/><circle cx='21' cy='17' r='1.8'/><circle cx='11' cy='22' r='1.8'/><circle cx='16' cy='22' r='1.8'/><circle cx='21' cy='22' r='1.8'/><circle cx='11' cy='26.2' r='1.8'/><circle cx='16' cy='26.2' r='1.8'/><circle cx='21' cy='26.2' r='1.8'/></g></svg>">
<script>
/* Aplica el tema antes de pintar (evita el parpadeo del tema claro). */
(function () {
  var tema = null;
  try { tema = localStorage.getItem("tema-calculadora"); } catch (e) {}
  if (tema !== "dark" && tema !== "light") {
    tema = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", tema);
})();
</script>
<style>
  :root {
    color-scheme: light;
    --color-fondo: #d5dadd;
    --color-sidebar: #1d2a37;
    --color-boton: #095a3e;      /* verde jade oscuro (botones de acción) */
    --color-boton-act: #0a6e4e;  /* jade: hover, activo y acentos */
    --color-nav: #2b3e51;        /* botones del sidebar: gris */
    --color-nav-hover: #374f66;
    --acento-texto: #085a49;   /* verde de acento usado como color de texto */
    --color-texto-sb: #ffffff;
    --color-exito: #1abc9c;
    --color-alerta: #f39c12;
    --color-error: #e74c3c;
    --color-neutro: #7f8c8d;
    --color-borde: #aab3b8;

    --texto: #1c1c1c;
    --texto-titulo: #2c3e50;
    --texto-acento: #34495e;
    --texto-suave-1: #3b4850;
    --texto-suave-2: #3c4951;
    --texto-suave-3: #3f4c54;
    --texto-tenue: #3f4c54;
    --texto-sb-suave: #cfd8dc;

    --superficie: #e2e7e9;
    --superficie-2: #dce1e4;
    --superficie-3: #dee3e6;
    --input-fondo: #e9edef;
    --borde-input: #8f989e;
    --borde-tab: #c9c9c9;
    --tab-fondo: #c8cfd3;
    --linea-tabla: #c9d0d4;
    --linea-fila: #ccd3d6;
    --chip-fondo: #cdd5d8;
    --desact-fondo: #b0b0b0;
    --desact-texto: #9e9e9e;
    --punto: #d3d9db;
    --punto-hover: #aab4b8;

    --pivote-fondo: rgba(26, 188, 156, 0.16);
    --pivote-fondo-fuerte: rgba(26, 188, 156, 0.22);
    --pivote-texto: #064a3c;
    --fila-resaltada: rgba(52, 73, 94, 0.05);
    --exito-texto: #084f40;
    --exito-fondo: rgba(26, 188, 156, 0.15);
    --exito-fondo-suave: rgba(26, 188, 156, 0.12);
    --alerta-fondo: rgba(243, 156, 18, 0.15);
    --alerta-texto: #6a4000;
    --error-fondo: rgba(231, 76, 60, 0.15);
    --error-fondo-suave: rgba(231, 76, 60, 0.06);
    --error-texto: #8a2216;

    --op-inter-fondo: #fdebd0;
    --op-inter-texto: #935116;
    --op-norm-fondo: #d6f3ec;
    --op-elim-fondo: #e3e9ea;

    --sidebar-separador: rgba(255, 255, 255, 0.18);
    --overlay: rgba(0, 0, 0, 0.35);
    --sombra: rgba(0, 0, 0, 0.3);

    /* Gráficas geométricas (spec 014): series y solución */
    --g-serie-1: #0e7c70;
    --g-serie-2: #c2410c;
    --g-serie-3: #1d4ed8;
    --g-serie-4: #a21caf;
    --g-serie-5: #a16207;
    --g-serie-6: #475569;
    --g-solucion: #c0392b;

    /* Fondo de partículas ASCII (decorativo): componentes RGB para el canvas. */
    --particula-rgb: 10, 120, 74;
    --particula-reposo: 0.55;
    --particula-onda: 0.9;
    --tarjeta-rgb: 14, 105, 160;    /* letras que salen de las tarjetas (azul, distinto del verde) */
    --tarjeta-opacidad: 0.4;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --color-fondo: #1a1f24;
    --color-sidebar: #11161a;
    --color-boton: #084c36;
    --color-boton-act: #0a6e4e;
    --color-nav: #2f3b46;
    --color-nav-hover: #3a4955;
    --acento-texto: #4fd8bd;
    --color-texto-sb: #ffffff;
    --color-exito: #1abc9c;
    --color-alerta: #f39c12;
    --color-error: #e74c3c;
    --color-neutro: #8c9aa4;
    --color-borde: #3a444d;

    --texto: #e6eaed;
    --texto-titulo: #d5dde3;
    --texto-acento: #b9c6d0;
    --texto-suave-1: #9fadb6;
    --texto-suave-2: #a3b1ba;
    --texto-suave-3: #a3b1ba;
    --texto-tenue: #a0adb7;
    --texto-sb-suave: #9fb0ba;

    --superficie: #242b31;
    --superficie-2: #2b343b;
    --superficie-3: #20272d;
    --input-fondo: #2b343b;
    --borde-input: #4a5660;
    --borde-tab: #3a444d;
    --tab-fondo: #1f262c;
    --linea-tabla: #313b43;
    --linea-fila: #2f3941;
    --chip-fondo: #33404a;
    --desact-fondo: #3a444d;
    --desact-texto: #8c969e;
    --punto: #45515b;
    --punto-hover: #62717d;

    --pivote-fondo: rgba(26, 188, 156, 0.26);
    --pivote-fondo-fuerte: rgba(26, 188, 156, 0.34);
    --pivote-texto: #7ee8d3;
    --fila-resaltada: rgba(255, 255, 255, 0.05);
    --exito-texto: #4fd8bd;
    --exito-fondo: rgba(26, 188, 156, 0.22);
    --exito-fondo-suave: rgba(26, 188, 156, 0.18);
    --alerta-fondo: rgba(243, 156, 18, 0.22);
    --alerta-texto: #f0b45a;
    --error-fondo: rgba(231, 76, 60, 0.24);
    --error-fondo-suave: rgba(231, 76, 60, 0.12);
    --error-texto: #f59a90;

    --op-inter-fondo: #4a3a20;
    --op-inter-texto: #f5b971;
    --op-norm-fondo: #1f4a43;
    --op-elim-fondo: #37424b;

    --sidebar-separador: rgba(255, 255, 255, 0.14);
    --overlay: rgba(0, 0, 0, 0.6);
    --sombra: rgba(0, 0, 0, 0.6);

    --g-serie-1: #4de0c8;
    --g-serie-2: #fb923c;
    --g-serie-3: #60a5fa;
    --g-serie-4: #e879f9;
    --g-serie-5: #facc15;
    --g-serie-6: #94a3b8;
    --g-solucion: #ff6b5e;

    --particula-rgb: 90, 230, 140;
    --particula-reposo: 0.13;
    --particula-onda: 0.7;
    --tarjeta-rgb: 110, 200, 245;
    --tarjeta-opacidad: 0.36;
  }

  * { box-sizing: border-box; }

  button, input, select, label, a, .inicio-tarjeta { touch-action: manipulation; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--color-fondo);
    font-family: Arial, Helvetica, sans-serif;
    color: var(--texto);
  }

  .app {
    position: relative;
    z-index: 1;   /* por encima del canvas de partículas */
    display: flex;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* Letras que salen de una tarjeta al pasar el ratón: encima de todo, recortadas a la tarjeta. */
  .efecto-tarjetas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  /* Fondo de partículas ASCII: detrás de todo, no intercepta clics. */
  .fondo-particulas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Barra superior y overlay del drawer: solo existen en vista móvil. */
  .topbar,
  .drawer-overlay,
  .btn-cerrar-drawer { display: none; }

  /* ---------- SIDEBAR ---------- */

  .sidebar {
    width: 210px;
    flex-shrink: 0;
    background: var(--color-sidebar);
    color: var(--color-texto-sb);
    display: flex;
    flex-direction: column;
    padding: 16px 10px;
    gap: 6px;
  }

  .sidebar-cabecera {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 14px 6px;
  }

  .sidebar h1 {
    font-size: 15px;
    font-weight: bold;
    margin: 0;
  }

  .btn-colapsar {
    background: transparent;
    color: var(--color-texto-sb);
    border: none;
    border-radius: 8px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }

  @media (hover: hover) { .btn-colapsar:hover { background: var(--color-nav); } }

  /* Sidebar replegado: solo queda visible el botón para desplegarlo. */
  .sidebar.colapsado { width: 56px; padding: 16px 0; align-items: center; }
  .sidebar.colapsado .sidebar-cabecera { margin: 0; justify-content: center; }
  .sidebar.colapsado h1,
  .sidebar.colapsado > :not(.sidebar-cabecera):not(.estado-servidor) { display: none; }
  /* Replegado solo se ve el punto de estado (verde/rojo), al pie. */
  .sidebar.colapsado .estado-servidor { margin-top: auto; padding: 8px 0 4px; }
  .sidebar.colapsado .estado-servidor span { display: none; }

  .nav-btn {
    background: var(--color-nav);
    color: var(--color-texto-sb);
    border: none;
    border-radius: 12px;
    padding: 11px 12px;
    text-align: left;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .nav-btn { display: flex; align-items: center; gap: 10px; }
  .sidebar-separador {
    height: 1px;
    background: var(--sidebar-separador);
    margin: 6px 6px;
    flex-shrink: 0;
  }

  .nav-icono { display: flex; flex-shrink: 0; }

  @media (hover: hover) { .nav-btn:hover { background: var(--color-nav-hover); } }
  .nav-btn.active { background: var(--color-boton-act); font-weight: bold; }

  .btn-tema {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .estado-servidor {
    margin-top: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--texto-sb-suave);
    padding: 8px 6px 2px;
  }

  .estado-punto {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--color-neutro);
    flex-shrink: 0;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }

  .estado-punto.conectado {
    background: var(--color-exito);
    box-shadow: 0 0 5px var(--color-exito);
  }

  .estado-punto.desconectado {
    background: var(--color-error);
    box-shadow: 0 0 5px var(--color-error);
  }

  /* ---------- PANEL PRINCIPAL ---------- */

  .panel {
    position: relative;
    flex: 1;
    min-width: 0;
    padding: 10px 24px 30px;
    overflow-y: auto;
  }

  /* ---------- INICIO ---------- */

  .inicio { max-width: 820px; margin: 0 auto; }

  .inicio-subtitulo {
    text-align: center;
    color: var(--texto-suave-1);
    margin: -6px 0 26px;
    font-size: 14px;
  }

  .inicio-cuadricula {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
    gap: 16px;
  }

  .inicio-separador {
    height: 1px;
    background: var(--color-borde);
    margin: 30px 0 20px;
  }

  .inicio-seccion {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--texto-suave-1);
    margin: 0 0 14px;
  }

  /* ---------- EJERCICIOS ---------- */

  .ejercicios-barra {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 4px;
  }

  .ejercicios-lista {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .ejercicio {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 14px;
    padding: 16px 18px;
    animation: apareceSuave 0.25s ease both;
  }

  .ejercicio-info { flex: 1 1 280px; min-width: 0; }

  .ejercicio-cabecera {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .ejercicio-titulo { font-size: 15px; font-weight: bold; color: var(--texto-titulo); }
  .ejercicio-descripcion { font-size: 13px; line-height: 1.45; color: var(--texto-suave-1); margin: 0 0 10px; }

  .ejercicio-datos {
    font-family: "Courier New", monospace;
    font-size: 13px;
    line-height: 1.5;
    background: var(--superficie-2);
    border: 1px solid var(--linea-tabla);
    border-radius: 8px;
    padding: 8px 12px;
    margin: 0;
    overflow-x: auto;
    color: var(--texto);
  }

  .dificultad {
    font-size: 11px;
    font-weight: bold;
    border-radius: 999px;
    padding: 2px 10px;
  }

  .dificultad-basico { background: var(--exito-fondo); color: var(--exito-texto); }
  .dificultad-intermedio { background: var(--alerta-fondo); color: var(--alerta-texto); }
  .dificultad-avanzado { background: var(--error-fondo); color: var(--error-texto); }

  .inicio-tarjeta {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    text-align: left;
    font: inherit;
    color: var(--texto);
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 14px;
    padding: 18px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }

  @media (hover: hover) {
    .inicio-tarjeta:hover {
      border-color: var(--color-exito);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px var(--sombra);
    }
  }

  .inicio-tarjeta:focus-visible {
    outline: 2px solid var(--color-exito);
    outline-offset: 2px;
  }

  .inicio-icono {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--exito-fondo);
    color: var(--exito-texto);
  }

  .inicio-nombre { font-size: 16px; font-weight: bold; color: var(--texto-titulo); }
  .inicio-descripcion { font-size: 13px; line-height: 1.45; color: var(--texto-suave-1); }

  .titulo {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    margin: 14px 0;
  }

  .controles {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 8px 0;
  }

  .controles label {
    font-size: 13px;
  }

  /* Etiqueta + control que viajan juntos al saltar de línea. */
  .controles .campo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  input[type="text"], input[type="number"], select {
    font-family: inherit;
    font-size: 13px;
    padding: 5px 7px;
    border: 1px solid var(--borde-input);
    border-radius: 4px;
    text-align: center;
    background: var(--input-fondo);
    color: var(--texto);
  }

  .btn {
    background: var(--color-boton);
    color: var(--color-texto-sb);
    border: none;
    border-radius: 12px;
    padding: 9px 18px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  @media (hover: hover) { .btn:hover:not(:disabled) { background: var(--color-boton-act); } }

  .btn:disabled {
    background: var(--desact-fondo);
    color: var(--desact-texto);
    cursor: default;
  }

  .btn-grande {
    font-size: 14px;
    font-weight: bold;
    padding: 10px 22px;
  }

  .botones {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 12px 0;
  }

  .formato {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin: 8px 0;
    font-size: 13px;
  }

  .formato label {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  /* ---------- MATRIZ (formularios de entrada) ---------- */

  /* Centrado seguro: los márgenes auto centran solo si el contenido cabe;
     si no cabe, el borde izquierdo sigue alcanzable con el scroll. */
  .marco-matriz {
    display: flex;
    margin: 16px 0;
    overflow-x: auto;
  }

  .marco-matriz > * { margin: 0 auto; }

  .grid-matriz {
    display: grid;
    gap: 6px;
    align-items: center;
    justify-items: center;
  }

  .grid-matriz .encabezado {
    font-size: 12px;
    font-weight: normal;
  }

  .grid-matriz .separador {
    font-size: 15px;
    font-weight: bold;
    padding: 0 4px;
  }

  .grid-matriz input {
    width: 62px;
  }

  .marco-tabla {
    display: flex;
    flex-direction: column;
    max-width: 100%;
    margin: 4px 12px;
    overflow-x: auto;
  }

  .marco-tabla .titulo-tabla {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
    text-align: center;
  }

  .tabla-genérica {
    display: grid;
    gap: 4px;
    width: max-content;
    margin: 0 auto;
  }

  /* Un campo suelto (escalar) se centra como antes. */
  .marco-tabla > input { align-self: center; }

  .tabla-genérica input { width: 56px; }

  .grupo-tablas {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 10px;
    margin: 10px 0;
  }

  .grupo-vectores {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 12px 0;
    flex-wrap: wrap;
  }

  .columna-vector {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .columna-vector .titulo-tabla {
    font-size: 13px;
    font-weight: bold;
  }

  .columna-vector input { width: 68px; }

  /* ---------- PESTAÑAS (Vectores y matrices) ---------- */

  /* Centradas si caben; si no, scroll horizontal propio con la primera
     pestaña alcanzable (márgenes auto en vez de justify-content: center). */
  .tabs {
    display: flex;
    gap: 4px;
    margin: 10px 0 0;
    overflow-x: auto;
    scrollbar-width: thin;
  }

  .tabs > :first-child { margin-left: auto; }
  .tabs > :last-child { margin-right: auto; }

  .tab-btn {
    flex-shrink: 0;
    white-space: nowrap;
    padding: 8px 20px;
    border: 1px solid var(--borde-tab);
    border-bottom: none;
    background: var(--tab-fondo);
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    font-size: 13px;
    color: var(--texto);
  }

  .tab-btn.active {
    background: var(--superficie);
    font-weight: bold;
  }

  .tab-panel {
    border: 1px solid var(--borde-tab);
    border-radius: 0 4px 4px 4px;
    background: var(--superficie);
    padding: 12px;
    max-width: 960px;
    margin: 0 auto;
  }

  .tab-contenido { display: none; }
  .tab-contenido.activa { display: block; }

  /* ---------- PANEL DE RESULTADOS (interactivo) ---------- */

  .resultado-panel {
    max-width: 960px;
    margin: 14px auto 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .bloque-titulo {
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--texto-suave-1);
    margin: 18px 2px 8px;
    padding-left: 8px;
    border-left: 3px solid var(--color-boton-act);
  }

  .planteamiento {
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    margin-bottom: 4px;
  }

  .nota-sin-pasos {
    background: var(--superficie);
    border: 1px dashed var(--color-borde);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--texto-suave-2);
    margin: 4px 0;
  }

  /* ---------- DETERMINANTE: recomendación y selector de método ---------- */

  .recomendacion {
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-left: 5px solid var(--color-exito);
    border-radius: 10px;
    padding: 12px 16px;
    margin: 10px 0;
    font-size: 13px;
  }

  .recomendacion-titulo { font-weight: bold; color: var(--texto-titulo); margin-bottom: 4px; }
  .recomendacion-motivo { color: var(--texto-suave-1); margin: 4px 0 10px; }

  .metodo-opciones {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .metodo-opcion {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-height: 44px;
    padding: 10px 12px;
    border: 2px solid var(--color-borde);
    border-radius: 8px;
    background: var(--superficie-2);
    cursor: pointer;
  }

  .metodo-opcion.elegido { border-color: var(--color-boton-act); background: var(--exito-fondo-suave); }
  .metodo-opcion.no-disponible { opacity: 0.6; cursor: not-allowed; }
  .metodo-opcion-nombre { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-weight: bold; color: var(--texto-titulo); }
  .metodo-opcion-costo { font-size: 12px; color: var(--texto-suave-1); }

  .etiqueta-recomendado {
    font-size: 11px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--exito-fondo);
    color: var(--exito-texto);
  }

  .termino-detalle { margin: 6px 0; padding-left: 12px; border-left: 2px solid var(--color-borde); font-size: 13px; }
  .termino-detalle .termino-detalle { margin-left: 4px; }
  .termino-linea { margin: 4px 0; color: var(--texto); }
  .termino-linea.omitido { color: var(--texto-suave-1); font-style: italic; }
  .multiplicadores { font-family: "Courier New", Courier, monospace; font-size: 13px; margin: 6px 0; overflow-wrap: anywhere; }

  @media (max-width: 480px) {
    .metodo-opciones { grid-template-columns: 1fr; }
  }

  /* ---------- BISECCIÓN: formulario de la función ---------- */

  /* Gráfica de la bisección (SVG propio; colores solo por variables) */
  .grafica-marco {
    background: var(--superficie);
    border: 1px solid var(--borde-input);
    border-radius: 10px;
    box-shadow: 0 4px 14px var(--sombra);
    padding: 14px;
    min-width: 0;
  }
  .grafica-lienzo {
    width: 100%; min-width: 0;
    touch-action: none;        /* el dedo mueve la gráfica, no la página */
    user-select: none; -webkit-user-select: none;
    cursor: grab;
  }
  .grafica-lienzo.arrastrando { cursor: grabbing; }
  .grafica-lienzo:focus-visible { outline: 2px solid var(--color-boton-act); outline-offset: 2px; border-radius: 6px; }
  .grafica-herramientas { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .grafica-zoom { display: inline-flex; }
  .grafica-boton {
    min-height: 40px;
    min-width: 44px;
    padding: 0 14px;
    border: 1px solid var(--color-borde);
    background: var(--chip-fondo);
    color: var(--texto-acento);
    font: inherit;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .grafica-zoom .grafica-boton { font-size: 20px; padding: 0; }
  .grafica-zoom .grafica-boton:first-child { border-radius: 8px 0 0 8px; }
  .grafica-zoom .grafica-boton:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
  .grafica-boton-texto { border-radius: 8px; }
  .grafica-boton:focus-visible { outline: 2px solid var(--color-boton-act); outline-offset: 2px; position: relative; z-index: 1; }
  @media (hover: hover) { .grafica-boton:hover { border-color: var(--color-boton-act); position: relative; z-index: 1; } }
  @media (max-width: 768px) { .grafica-boton { min-height: 44px; } }

  /* Sección que se despliega o se oculta: tarjeta-botón con acción e ícono. */
  .seccion-desplegable {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    min-height: 48px;
    margin: 18px 0 8px;
    padding: 8px 12px 8px 14px;
    background: var(--superficie);
    color: var(--texto-titulo);
    border: 1px solid var(--borde-input);
    border-left: 4px solid var(--color-boton-act);
    border-radius: 10px;
    box-shadow: 0 2px 8px var(--sombra);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .seccion-desplegable .sd-pictograma {
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
    color: var(--acento-texto);
  }
  .seccion-desplegable .sd-titulo {
    flex: 1 1 auto; min-width: 0;
    font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .seccion-desplegable .sd-icono {
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--chip-fondo);
    border: 1px solid var(--color-borde);
    color: var(--texto-acento);
    transition: transform 0.2s ease;
  }
  .seccion-desplegable[aria-expanded="true"] .sd-icono { transform: rotate(180deg); }
  .seccion-desplegable:focus-visible { outline: 2px solid var(--color-boton-act); outline-offset: 2px; }
  @media (hover: hover) { .seccion-desplegable:hover { border-color: var(--color-boton-act); background: var(--superficie-2); } }
  .seccion-desplegable + [hidden] { display: none !important; }
  @media (max-width: 768px) { .seccion-desplegable { min-height: 52px; } }
  .grafica-cursor { font-size: 12px; color: var(--texto-tenue); min-height: 16px; font-family: "Courier New", Courier, monospace; overflow-wrap: anywhere; }
  .grafica-lienzo svg { display: block; width: 100%; height: auto; }
  .g-fondo { fill: var(--input-fondo); }
  .g-rejilla { stroke: var(--linea-tabla); stroke-width: 1; }
  .g-marco { fill: none; stroke: var(--borde-input); stroke-width: 1; }
  .g-eje { stroke: var(--texto-tenue); stroke-width: 1.3; }
  .g-curva { fill: none; stroke: var(--acento-texto); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .g-secante { stroke: var(--color-alerta); stroke-width: 1.8; stroke-linecap: round; }
  .g-intervalo { fill: var(--pivote-fondo); }
  .g-intervalo-borde { stroke: var(--acento-texto); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .g-punto { fill: var(--texto-titulo); }
  .g-punto-actual { fill: var(--color-alerta); stroke: var(--texto-titulo); stroke-width: 1.5; }
  .g-raiz { fill: var(--color-error); stroke: var(--input-fondo); stroke-width: 2; }
  .g-disc { stroke: var(--color-alerta); stroke-width: 1.8; stroke-dasharray: 6 4; }
  .g-disc-banda { fill: var(--alerta-fondo); }
  .g-tick { fill: var(--texto-tenue); font-size: 11px; }
  .g-etiqueta { fill: var(--texto); font-size: 12px; font-weight: bold; paint-order: stroke; stroke: var(--input-fondo); stroke-width: 3px; }
  .grafica-control { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; margin-top: 6px; }
  .grafica-control label { font-size: 13px; font-weight: bold; color: var(--texto-titulo); }
  .grafica-control input[type="range"] { flex: 1 1 180px; min-width: 0; min-height: 44px; accent-color: var(--color-boton-act); touch-action: manipulation; }
  .grafica-estado { font-size: 13px; color: var(--texto-tenue); margin: 2px 0 6px; overflow-wrap: anywhere; }
  .grafica-leyenda { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--texto-tenue); }
  .grafica-leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .grafica-leyenda i { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--acento-texto); }
  .grafica-leyenda i.l-punto { width: 9px; height: 9px; border: 0; border-radius: 50%; background: var(--texto-titulo); }
  .grafica-leyenda i.l-intervalo { height: 10px; border: 1px dashed var(--acento-texto); background: var(--pivote-fondo); }
  .grafica-leyenda i.l-disc { border-top: 3px dashed var(--color-alerta); }
  /* Escenas geométricas (spec 014): cada elemento toma su color de la serie */
  .e-s1 { --c: var(--g-serie-1); } .e-s2 { --c: var(--g-serie-2); } .e-s3 { --c: var(--g-serie-3); }
  .e-s4 { --c: var(--g-serie-4); } .e-s5 { --c: var(--g-serie-5); } .e-s6 { --c: var(--g-serie-6); }
  .e-sol { --c: var(--g-solucion); }
  .e-trazo { fill: none; stroke: var(--c); stroke-width: 2.4; stroke-linecap: round; }
  .e-trazo.e-fuerte { stroke-width: 4.5; }
  .e-guion { stroke-dasharray: 7 5; }
  .e-relleno { fill: var(--c); fill-opacity: 0.2; stroke: var(--c); stroke-width: 1.6; stroke-linejoin: round; }
  .e-punta { fill: var(--c); }
  .e-punto { fill: var(--c); stroke: var(--input-fondo); stroke-width: 2; }
  .escena-avisos {
    margin-top: 8px; padding: 8px 12px;
    font-size: 13px; color: var(--texto);
    background: var(--alerta-fondo);
    border-left: 3px solid var(--color-alerta);
    border-radius: 6px;
    overflow-wrap: anywhere;
  }
  .g-caja { stroke: var(--linea-tabla); stroke-width: 1; }
  .g-eje3d { stroke: var(--texto-tenue); stroke-width: 1.4; }
  .g-marca3d { fill: var(--texto-tenue); }
  .g-tick-3d { fill: var(--texto-tenue); font-size: 10px; paint-order: stroke; stroke: var(--input-fondo); stroke-width: 3px; }
  .escena-selector { margin: 0 2px 10px; }
  /* Animación de la transformación (spec 015) */
  .anim-control { margin-top: 8px; }
  .anim-control .grafica-control { margin-top: 0; flex-wrap: nowrap; }
  .anim-control .grafica-control label { flex: none; }
  .anim-boton { flex: none; min-height: 44px; padding: 0 14px; }
  .anim-lectura { margin-top: 4px; font-size: 13px; color: var(--texto); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .anim-aviso[hidden] { display: none; }
  .anim-nota { margin-top: 4px; font-size: 12px; color: var(--texto-tenue); }
  @media (max-width: 480px) {
    .anim-control .grafica-control { flex-wrap: wrap; }
    .anim-control .grafica-control input[type="range"] { flex: 1 1 100%; order: 3; }
  }
  .escena-no-disponible { font-size: 14px; color: var(--texto-tenue); }
  .grafica-leyenda i.l-escena-linea { border-top: 3px solid var(--c); }
  .grafica-leyenda i.l-escena-punto { width: 10px; height: 10px; border: 0; border-radius: 50%; background: var(--c); }
  .grafica-leyenda i.l-escena-poligono { height: 10px; border: 1px solid var(--c); background: var(--c); background-clip: padding-box; opacity: 0.8; }
  .grafica-leyenda i.l-secante { width: 18px; height: 0; border: 0; border-top: 2px solid var(--color-alerta); border-radius: 0; background: none; }
  .grafica-leyenda i.l-raiz { width: 10px; height: 10px; border: 0; border-radius: 50%; background: var(--color-error); }

  .biseccion-formulario {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px 14px;
    max-width: 760px;
    margin: 8px auto;
  }

  .biseccion-formulario .campo-vertical {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    font-size: 13px;
  }

  .biseccion-formulario .campo-ancho { grid-column: 1 / -1; }
  .biseccion-formulario .campo-vertical > span:first-child { font-weight: bold; color: var(--texto-titulo); }
  .biseccion-formulario input { width: 100%; box-sizing: border-box; }
  .biseccion-formulario .btn { grid-column: 1 / -1; justify-self: center; }
  .campo-ayuda { font-size: 12px; color: var(--texto-suave-1); }

  /* Campo de la función: grande, monoespaciado y con "f(x) =" integrado. */
  .bloque-funcion { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .bloque-funcion-titulo { font-size: 13px; font-weight: bold; color: var(--texto-titulo); }

  .entrada-funcion {
    display: flex;
    align-items: stretch;
    border: 2px solid var(--borde-input);
    border-radius: 10px;
    background: var(--input-fondo);
    overflow: hidden;
  }

  .entrada-funcion:focus-within { border-color: var(--color-boton-act); }

  .entrada-funcion .prefijo {
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
    font-style: italic;
    font-size: 22px;
    color: var(--acento-texto);
    background: var(--superficie-2);
    border-right: 1px solid var(--color-borde);
    white-space: nowrap;
  }

  .biseccion-formulario .entrada-funcion input {
    flex: 1;
    width: auto;
    min-width: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    outline: none;
    font-family: "Courier New", Courier, monospace;
    font-size: 20px;
    padding: 12px 14px;
    text-align: left;
  }

  /* Cómo se lee la función escrita (potencias como exponentes, ·, −, π, √). */
  .vista-previa-funcion {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 8px 14px;
    border-left: 4px solid var(--color-exito);
    border-radius: 0 8px 8px 0;
    background: var(--superficie);
    font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
    font-size: 22px;
    color: var(--texto);
    overflow-x: auto;
    white-space: nowrap;
  }

  .vista-previa-funcion .vp-etiqueta {
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--texto-suave-1);
  }

  .vista-previa-funcion .vp-vacia { font-family: Arial, sans-serif; font-size: 14px; font-style: italic; color: var(--texto-suave-1); }
  .vista-previa-funcion sup { font-size: 0.65em; line-height: 0; }

  .vista-previa-funcion[hidden] { display: none; }

  /* Teclado en pantalla de la función (plegable, cerrado al inicio).
     Todas las teclas miden lo mismo; las de edición son más anchas. */
  .teclado-funcion {
    --tecla-ancho: 54px;
    --tecla-alto: 48px;
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 22px 36px;
    padding: 18px 20px 20px;
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 12px;
  }
  .teclado-columna { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .teclado-columna:last-child { flex: 1 1 100%; align-items: center; padding-top: 18px; border-top: 1px solid var(--linea-tabla); }
  .teclado-grupo { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .teclado-grupo-titulo {
    font-size: 11px; font-weight: bold; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--texto-suave-1);
  }
  .teclado-teclas {
    display: grid; gap: 8px;
    grid-template-columns: repeat(var(--columnas, 3), var(--tecla-ancho));
  }
  .teclado-teclas-anchas { grid-template-columns: repeat(var(--columnas, 2), calc(var(--tecla-ancho) * 1.6)); }
  .teclado-teclas .chip {
    min-width: 0; min-height: var(--tecla-alto);
    padding: 4px 6px; border-radius: 10px;
    font-size: 16px;
  }
  .teclado-teclas .chip:active { transform: translateY(1px); }
  .teclado-teclas .teclado-ancha { grid-column: span 2; }
  .teclado-teclas-anchas .chip { font-size: 14px; }
  .seccion-desplegable.sd-compacta { margin: 2px 0 10px; min-height: 42px; }
  @media (max-width: 480px) {
    .teclado-funcion { padding: 14px 12px 16px; gap: 18px; }
    .teclado-columna { flex: 1 1 100%; }
    .teclado-columna:last-child { padding-top: 16px; }
    .teclado-grupo { width: 100%; }
    .teclado-teclas,
    .teclado-funciones .teclado-teclas,
    .teclado-teclas-anchas { grid-template-columns: repeat(var(--columnas, 4), minmax(0, 1fr)); }
    .teclado-funciones .teclado-teclas { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }

  .chip {
    min-height: 36px;
    min-width: 40px;
    padding: 4px 10px;
    border: 1px solid var(--color-borde);
    border-radius: 8px;
    background: var(--chip-fondo);
    color: var(--texto-acento);
    font-family: "Courier New", Courier, monospace;
    font-size: 14px;
    cursor: pointer;
  }

  .chip:focus-visible { outline: 2px solid var(--color-boton-act); outline-offset: 2px; }
  @media (hover: hover) { .chip:hover { border-color: var(--color-boton-act); } }
  @media (max-width: 768px) { .chip { min-height: 44px; min-width: 44px; } }

  @media (max-width: 480px) {
    .biseccion-formulario { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .biseccion-formulario .btn { justify-self: stretch; }
  }

  /* ---------- TABLA DE MATRIZ (resultado) ---------- */

  .tabla-matriz-envoltorio {
    overflow-x: auto;
    margin: 4px 0 10px;
  }

  table.tabla-matriz {
    border-collapse: collapse;
    margin: 0 auto;
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 6px;
    overflow: hidden;
    animation: apareceSuave 0.25s ease;
  }

  table.tabla-matriz th, table.tabla-matriz td {
    padding: 7px 12px;
    text-align: center;
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    border-bottom: 1px solid var(--linea-tabla);
  }

  table.tabla-matriz th {
    font-family: Arial, sans-serif;
    font-size: 11px;
    color: var(--texto-suave-3);
    background: var(--superficie-2);
    font-weight: normal;
  }

  table.tabla-matriz tr:last-child td { border-bottom: none; }

  table.tabla-matriz .col-separador {
    border-left: 2px solid var(--color-boton-act);
  }

  table.tabla-matriz .celda-pivote {
    background: var(--pivote-fondo);
    font-weight: bold;
    color: var(--pivote-texto);
    position: relative;
  }

  table.tabla-matriz tr.fila-resaltada td {
    background: var(--fila-resaltada);
  }

  table.tabla-matriz tr.fila-resaltada td.celda-pivote {
    background: var(--pivote-fondo-fuerte);
  }

  /* ---------- STEPPER DE PASOS ---------- */

  .stepper {
    background: var(--superficie-3);
    border: 1px solid var(--color-borde);
    border-radius: 10px;
    padding: 14px;
    margin: 4px 0 12px;
  }

  .stepper-cabecera {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
    margin-bottom: 10px;
  }

  .stepper-punto {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: none;
    background: var(--punto);
    cursor: pointer;
    padding: 0;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  @media (hover: hover) { .stepper-punto:hover { background: var(--punto-hover); } }
  .stepper-punto.activo { background: var(--color-boton-act); transform: scale(1.3); }

  .stepper-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 10px;
  }

  .btn-paso {
    padding: 7px 16px;
  }

  .stepper-contador {
    font-size: 12px;
    color: var(--texto-suave-2);
    min-width: 48px;
    text-align: center;
  }

  /* ---------- TARJETA DE PASO (Gauss-Jordan / Pivoteo) ---------- */

  .paso-tarjeta {
    animation: apareceSuave 0.25s ease;
  }

  .paso-encabezado {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .paso-numero {
    font-size: 11px;
    color: var(--texto-tenue);
    font-weight: bold;
    text-transform: uppercase;
  }

  .paso-operacion {
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 6px;
    background: var(--chip-fondo);
    color: var(--texto-titulo);
  }

  .paso-operacion.tipo-intercambio { background: var(--op-inter-fondo); color: var(--op-inter-texto); }
  .paso-operacion.tipo-normalizar { background: var(--op-norm-fondo); color: var(--exito-texto); }
  .paso-operacion.tipo-eliminar { background: var(--op-elim-fondo); color: var(--texto-acento); }

  .paso-descripcion {
    font-size: 11px;
    color: var(--texto-tenue);
    margin-bottom: 8px;
  }

  /* ---------- LISTA COMPACTA DE PASOS (vectores/matrices) ---------- */

  .lista-pasos {
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 10px;
    overflow: hidden;
    margin: 4px 0 10px;
  }

  .fila-paso {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--linea-fila);
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    animation: aparecerDesdeIzquierda 0.3s ease both;
  }

  .fila-paso:last-child { border-bottom: none; }
  @media (hover: hover) { .fila-paso:hover { background: var(--superficie-2); } }

  .fila-paso .paso-etiqueta {
    color: var(--texto-tenue);
    font-family: Arial, sans-serif;
    font-size: 11px;
    white-space: nowrap;
  }

  .fila-paso .paso-expresion { font-weight: bold; color: var(--texto-titulo); }

  /* ---------- TARJETAS DE VEREDICTO/RESULTADO ---------- */

  .tarjeta {
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 10px;
    padding: 14px 18px;
    margin: 6px 0 14px;
    animation: apareceSuave 0.3s ease;
    border-left: 5px solid var(--color-neutro);
  }

  .tarjeta.tipo-unica { border-left-color: var(--color-exito); }
  .tarjeta.tipo-infinitas { border-left-color: var(--color-alerta); }
  .tarjeta.tipo-incompatible { border-left-color: var(--color-error); }
  .tarjeta.tipo-neutro { border-left-color: var(--color-neutro); }

  .tarjeta-encabezado {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }

  .tarjeta-icono {
    font-size: 20px;
    font-weight: bold;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--chip-fondo);
    color: var(--color-neutro);
    flex-shrink: 0;
  }

  .tipo-unica .tarjeta-icono { background: var(--exito-fondo); color: var(--exito-texto); }
  .tipo-infinitas .tarjeta-icono { background: var(--alerta-fondo); color: var(--alerta-texto); }
  .tipo-incompatible .tarjeta-icono { background: var(--error-fondo); color: var(--error-texto); }

  .tarjeta-titulo {
    font-size: 15px;
    font-weight: bold;
  }

  .tarjeta-detalle {
    font-size: 12px;
    color: var(--texto-suave-3);
  }

  .tarjeta-cuerpo-mono {
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin: 10px 0 0;
    line-height: 1.5;
  }

  .lista-escalares {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .chip-escalar {
    background: var(--exito-fondo-suave);
    color: var(--pivote-texto);
    border-radius: 999px;
    padding: 5px 14px;
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    font-weight: bold;
  }

  .resultado-vector {
    font-family: "Courier New", Courier, monospace;
    font-size: 15px;
    font-weight: bold;
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 8px;
    padding: 10px 16px;
    text-align: center;
    color: var(--exito-texto);
  }

  /* ---------- COMPROBACIÓN: ecuación A · X = B y verificación por fila ---------- */

  .ecuacion-comprobacion {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
    margin: 6px 0 14px;
  }

  .matriz-etiquetada {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    min-width: 0;
    max-width: 100%;
  }

  .matriz-etiquetada .tabla-matriz-envoltorio { margin: 0; }

  .matriz-etiqueta {
    font-size: 11px;
    font-weight: bold;
    font-style: italic;
    color: var(--texto-tenue);
  }

  .simbolo-ecuacion {
    font-size: 22px;
    font-weight: bold;
    color: var(--acento-texto);
  }

  .fila-comprobacion {
    justify-content: space-between;
    align-items: center;
  }

  .fila-comprobacion.fallo { background: var(--error-fondo-suave); }

  .badge-comprobacion {
    font-weight: bold;
    font-size: 14px;
    flex-shrink: 0;
  }

  .badge-comprobacion.ok { color: var(--exito-texto); }
  .badge-comprobacion.fallo { color: var(--error-texto); }

  /* ---------- CONVERSIÓN DE BASES: tarjetas de paso ---------- */

  .paso-conversion {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
  }

  .division-visual, .termino-visual {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "Courier New", Courier, monospace;
    font-size: 20px;
    font-weight: bold;
    color: var(--texto-titulo);
  }

  .division-operador, .division-igual, .termino-igual {
    color: var(--acento-texto);
  }

  .division-cociente, .termino-resultado {
    color: var(--exito-texto);
  }

  .division-residuo {
    font-size: 13px;
    color: var(--texto-suave-3);
  }

  .resultado-conversion-numero {
    font-family: "Courier New", Courier, monospace;
    font-size: 17px;
    font-weight: bold;
    text-align: center;
    margin-top: 10px;
    color: var(--exito-texto);
  }

  /* ---------- ACORDEÓN (ecuación matricial, columnas de B) ---------- */

  .accordion {
    border: 1px solid var(--color-borde);
    border-radius: 8px;
    margin: 6px 0;
    overflow: hidden;
  }

  .accordion-encabezado {
    width: 100%;
    text-align: left;
    background: var(--superficie-2);
    border: none;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    color: var(--texto-acento);
    position: relative;
  }

  .accordion-encabezado::after {
    content: "+";
    position: absolute;
    right: 14px;
    color: var(--acento-texto);
    font-weight: bold;
  }

  .accordion-encabezado.abierto::after { content: "−"; }

  .accordion-body {
    padding: 10px 14px 4px;
  }

  /* ---------- MODAL (equivalente a messagebox) ---------- */

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }

  .modal-box {
    background: var(--superficie);
    border-radius: 8px;
    padding: 20px 24px;
    min-width: min(280px, calc(100vw - 32px));
    max-width: min(440px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    max-height: calc(100dvh - 32px);
    overflow-y: auto;
    overflow-wrap: anywhere;
    box-shadow: 0 8px 24px var(--sombra);
    animation: apareceSuave 0.2s ease;
  }

  .modal-box h2 {
    margin: 0 0 10px;
    font-size: 16px;
  }

  .modal-box h2.error { color: var(--error-texto); }
  .modal-box h2.aviso { color: var(--alerta-texto); }

  .modal-box p {
    margin: 0 0 18px;
    font-size: 13px;
    white-space: pre-wrap;
    line-height: 1.4;
  }

  .modal-box .btn {
    display: block;
    margin-left: auto;
  }

  /* ---------- MENÚ DE FUNCIONALIDADES (exportar) ---------- */

  /* Contenedor pegajoso de alto cero: el botón queda arriba a la derecha
     del panel aunque se desplace el contenido. */
  .menu-funciones {
    position: sticky;
    top: 0;
    height: 0;
    z-index: 20;
  }

  .menu-funciones-caja {
    position: absolute;
    top: 6px;
    right: -8px;
  }

  .menu-funciones-boton {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    padding: 0;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 9px;
    color: var(--exito-texto);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .menu-funciones-boton[aria-expanded="true"] { background: var(--chip-fondo); }
  @media (hover: hover) { .menu-funciones-boton:hover { background: var(--chip-fondo); } }

  .menu-funciones-boton:focus-visible,
  .menu-funciones-lista button:focus-visible {
    outline: 2px solid var(--color-exito);
    outline-offset: 2px;
  }

  .menu-funciones-boton[aria-disabled="true"] {
    color: var(--desact-texto);
    cursor: default;
  }

  @media (hover: hover) { .menu-funciones-boton[aria-disabled="true"]:hover { background: transparent; } }

  .menu-funciones-lista {
    position: absolute;
    top: 40px;
    right: 0;
    min-width: 210px;
    max-width: calc(100vw - 24px);
    padding: 6px;
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 10px;
    box-shadow: 0 8px 24px var(--sombra);
    animation: apareceSuave 0.15s ease;
  }

  .menu-funciones-lista[hidden] { display: none; }

  .menu-funciones-lista button {
    display: block;
    width: 100%;
    padding: 9px 12px;
    background: transparent;
    border: none;
    border-radius: 7px;
    color: var(--texto);
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }

  @media (hover: hover) { .menu-funciones-lista button:hover { background: var(--chip-fondo); } }

  .menu-funciones-opcion {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    padding: 9px 12px 6px;
    border-top: 1px solid var(--color-borde);
    font-size: 13px;
    color: var(--texto-suave-1);
    cursor: pointer;
  }

  .toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 110;
    max-width: 320px;
    padding: 11px 16px;
    background: var(--superficie);
    border: 1px solid var(--color-exito);
    border-radius: 10px;
    box-shadow: 0 8px 24px var(--sombra);
    color: var(--exito-texto);
    font-size: 13px;
    animation: apareceSuave 0.2s ease;
  }

  .toast a { color: inherit; font-weight: bold; margin-left: 10px; white-space: nowrap; }

  /* ---------- ANIMACIONES ---------- */

  @keyframes apareceSuave {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes aparecerDesdeIzquierda {
    from { opacity: 0; transform: translateX(-6px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ---------- VISTA MÓVIL (≤ 768 px, spec 008) ----------
     El sidebar pasa a un drawer superpuesto y aparece una barra superior.
     Un único breakpoint: el JS usa la misma consulta (MQ_MOVIL). */

  @media (max-width: 768px) {
    .app { flex-direction: column; }

    .topbar {
      display: flex;
      position: sticky;
      top: 0;
      z-index: 40;
      align-items: center;
      gap: 10px;
      height: calc(56px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));
      background: var(--color-sidebar);
      color: var(--color-texto-sb);
    }

    .topbar-titulo {
      flex: 1;
      min-width: 0;
      margin: 0;
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar .estado-servidor { padding: 0 6px; font-size: 12px; flex-shrink: 0; }

    .btn-menu,
    .btn-cerrar-drawer {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--color-texto-sb);
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .btn-menu:active,
    .btn-cerrar-drawer:active { background: var(--color-nav); }

    .drawer-overlay {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--sombra);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .drawer-overlay.visible { opacity: 1; visibility: visible; }

    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 60;
      width: min(300px, 85vw);
      height: 100vh;
      height: 100dvh;
      padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
      overflow-y: auto;
      overscroll-behavior: contain;
      transform: translateX(-100%);
      visibility: hidden;
      transition: transform 0.2s ease, visibility 0.2s ease;
    }

    /* Al abrir, visibility cambia sin retraso para poder enfocar el primer botón. */
    .sidebar.abierto { transform: none; visibility: visible; transition: transform 0.2s ease; }

    /* El drawer ya tiene su propio botón de cierre y el estado va arriba. */
    .btn-colapsar,
    .sidebar > .estado-servidor { display: none; }
    .btn-cerrar-drawer { display: flex; }
    .sidebar-cabecera { margin: 0 0 8px 6px; }

    .nav-btn { min-height: 48px; font-size: 15px; }

    .panel {
      overflow-y: visible;
      padding: 12px calc(12px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    }

    html.drawer-abierto, html.drawer-abierto body { overflow: hidden; }

    /* Celdas de entrada con ancho fluido y un mínimo usable. Si la matriz no
       cabe, hace scroll su contenedor (.marco-matriz / .marco-tabla), no la página. */
    .grid-matriz input,
    .tabla-genérica input,
    .columna-vector input {
      width: clamp(52px, 15vw, 68px);
      padding-left: 3px;
      padding-right: 3px;
    }

    .grid-matriz { gap: 5px; }
    .grid-matriz .separador { padding: 0 2px; }
    .marco-tabla { margin: 4px 0; }

    /* Filas de controles: etiqueta + campo siguen juntos y los botones
       comparten la fila o pasan al ancho completo si no caben. */
    .controles { gap: 10px 14px; }
    .controles > .btn { flex: 1 1 130px; }
    .controles input[type="text"] { max-width: 100%; }
    .botones .btn { flex: 1 1 140px; }

    /* Rótulo ("Dirección:", "Mostrar resultados en:") en su propia línea. */
    .formato { flex-wrap: wrap; gap: 6px 18px; }
    .formato > span,
    .controles-radios > span { flex: 1 0 100%; text-align: center; }

    .tab-btn { padding: 8px 14px; }

    /* Táctil e iOS: campos a 16 px (evita el zoom automático al enfocar) y
       objetivos de al menos 44 px. No se limita el zoom del usuario. */
    input[type="text"], input[type="number"], select {
      font-size: 16px;
      min-height: 44px;
    }

    .grid-matriz input,
    .tabla-genérica input,
    .columna-vector input { width: clamp(56px, 15vw, 68px); }

    .btn { min-height: 44px; }
    .tab-btn { min-height: 44px; }
    .formato label,
    .controles-radios label,
    .menu-funciones-opcion { min-height: 44px; }
    input[type="radio"], input[type="checkbox"] { width: 20px; height: 20px; margin: 0 6px 0 0; }

    .titulo { font-size: 20px; padding: 0 38px; }

    /* Stepper: sin puntos; contador y botones grandes. */
    .stepper { padding: 12px; }
    .stepper-cabecera { display: none; }
    .stepper-nav { gap: 10px; }
    .btn-paso { flex: 1 1 0; min-height: 48px; padding: 8px 10px; }
    .stepper-contador { font-size: 14px; font-weight: bold; min-width: 56px; }

    /* Menú de exportar: botón de 44 px, siempre bajo la barra superior. */
    .menu-funciones { top: calc(56px + env(safe-area-inset-top)); }
    .menu-funciones-caja { top: 4px; right: -6px; }
    .menu-funciones-boton {
      width: 44px;
      height: 44px;
      background: var(--superficie);
      border-color: var(--color-borde);
    }
    .menu-funciones-lista { top: 48px; }
    .menu-funciones-lista button { min-height: 44px; font-size: 15px; }

    .toast {
      left: 16px;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      max-width: none;
    }
  }

  /* Tablas de resultado por paso: menos relleno y fuente en pantallas angostas. */
  @media (max-width: 480px) {
    table.tabla-matriz th, table.tabla-matriz td { padding: 6px 8px; font-size: 12px; }
    table.tabla-matriz th { font-size: 10px; }
  }

  /* Pantallas muy angostas: el estado del servidor queda solo como punto. */
  @media (max-width: 380px) {
    .topbar .estado-servidor span { display: none; }
  }
</style>

<body>

<canvas class="fondo-particulas" id="fondo-particulas" aria-hidden="true"></canvas>
<canvas class="efecto-tarjetas" id="efecto-tarjetas" aria-hidden="true"></canvas>

<div class="app">
  <!-- Barra superior: solo visible en vista móvil (≤ 768 px). -->
  <header class="topbar" id="topbar">
    <button type="button" class="btn-menu" id="btn-menu" aria-label="Abrir menú"
            aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 class="topbar-titulo">Calculadora</h1>
    <!-- Estado del servidor insertado por JS -->
  </header>
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <nav class="sidebar" id="sidebar" aria-label="Menú principal">
    <div class="sidebar-cabecera">
      <h1>Calculadora</h1>
      <!-- Botón de replegar/desplegar (escritorio) y de cerrar (móvil) insertados por JS -->
    </div>
    <!-- Botones de navegación insertados por JS -->
  </nav>

  <main class="panel" id="panel">
    <!-- Vista actual insertada por JS -->
  </main>
</div>

<div id="modal-root"></div>

<script>
(function () {
  "use strict";

  /* ==========================================================
     UTILIDADES GENERALES
     ========================================================== */

  function el(tag, atributos, hijos) {
    const nodo = document.createElement(tag);
    if (atributos) {
      for (const [clave, valor] of Object.entries(atributos)) {
        if (valor === null || valor === undefined || valor === false) continue;
        if (clave === "texto") nodo.textContent = valor;
        else if (clave === "html") nodo.innerHTML = valor;
        else if (clave.startsWith("on") && typeof valor === "function") {
          nodo.addEventListener(clave.slice(2), valor);
        } else {
          nodo.setAttribute(clave, valor);
        }
      }
    }
    if (hijos) {
      for (const hijo of hijos) {
        if (hijo) nodo.appendChild(hijo);
      }
    }
    return nodo;
  }

  /* Celdas de matrices y vectores: aceptan "1/2" y negativos, por eso NO llevan
     inputmode (los teclados numéricos de iOS no tienen "/" ni "-"). */
  const ATRIBUTOS_CELDA = {
    type: "text", autocomplete: "off", autocapitalize: "off",
    autocorrect: "off", spellcheck: "false", enterkeyhint: "next",
  };

  function crearCelda(extra) {
    return el("input", Object.assign({}, ATRIBUTOS_CELDA, extra));
  }

  /* Fila de controles (.controles): cada etiqueta de texto se agrupa con el
     campo que la sigue para que no se separen al saltar de línea. */
  function crearControles(hijos) {
    const grupos = [];
    for (let i = 0; i < hijos.length; i++) {
      const nodo = hijos[i], siguiente = hijos[i + 1];
      if (nodo.tagName === "LABEL" && siguiente && (siguiente.tagName === "INPUT" || siguiente.tagName === "SELECT")) {
        grupos.push(el("label", { class: "campo" }, [el("span", { texto: nodo.textContent }), siguiente]));
        i++;
      } else {
        grupos.push(nodo);
      }
    }
    return el("div", { class: "controles" }, grupos);
  }

  function mostrarModal(titulo, mensaje, claseTitulo) {
    const raiz = document.getElementById("modal-root");
    raiz.innerHTML = "";

    const cerrar = () => { raiz.innerHTML = ""; };

    const caja = el("div", { class: "modal-box" }, [
      el("h2", { texto: titulo, class: claseTitulo || "error" }),
      el("p", { texto: mensaje }),
      el("button", { class: "btn", texto: "Aceptar", onclick: cerrar }),
    ]);

    const overlay = el("div", { class: "modal-overlay", onclick: (e) => {
      if (e.target === overlay) cerrar();
    } }, [caja]);

    raiz.appendChild(overlay);
  }

  function mostrarError(mensaje) {
    mostrarModal("Error", mensaje, "error");
  }

  function mostrarAviso(mensaje) {
    mostrarModal("Aviso", mensaje, "aviso");
  }

  async function llamarApi(ruta, cuerpo) {
    let respuesta;
    try {
      respuesta = await fetch(ruta, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cuerpo),
      });
    } catch (error) {
      throw new Error(
        "No se pudo conectar con el servidor. ¿Está corriendo " +
        "'python server.py'?"
      );
    }

    let datos;
    try {
      datos = await respuesta.json();
    } catch (error) {
      throw new Error("El servidor devolvió una respuesta inválida.");
    }

    if (!respuesta.ok || datos.error) {
      throw new Error(datos.error || "Ocurrió un error en el servidor.");
    }

    // Recuerda el último cálculo correcto para poder exportarlo.
    if (MODULO_EXPORTAR[ruta]) {
      exportable = { modulo: MODULO_EXPORTAR[ruta], datos: cuerpo };
    }

    return datos;
  }

  function enteroPositivo(valorTexto, nombre) {
    const valor = parseInt(valorTexto, 10);
    if (Number.isNaN(valor) || valor < 1 || String(valor) !== String(valorTexto).trim()) {
      throw new Error(`${nombre} debe ser un entero mayor que cero.`);
    }
    return valor;
  }

  /* ==========================================================

     (tabla de matriz, stepper de pasos, tarjetas de veredicto)

  function crearTablaMatriz(filas, opciones) {
    const { encabezados, separadorAntesDe, pivote, pivotes, filasResaltadas } = opciones || {};
    const tabla = el("table", { class: "tabla-matriz" });

    if (encabezados) {
      const filaEnc = el("tr");
      encabezados.forEach((texto, j) => {
        filaEnc.appendChild(el("th", {
          texto,
          class: j === separadorAntesDe ? "col-separador" : "",
        }));
      });
      tabla.appendChild(el("thead", {}, [filaEnc]));
    }

    const tbody = el("tbody");
    filas.forEach((fila, i) => {
      const tr = el("tr", {
        class: filasResaltadas && filasResaltadas.has(i) ? "fila-resaltada" : "",
      });
      fila.forEach((celda, j) => {
        const esPivote = (pivote && pivote.fila === i && pivote.columna === j)
          || (pivotes && pivotes.some((p) => p.fila === i && p.columna === j));
        const clases = [];
        if (j === separadorAntesDe) clases.push("col-separador");
        if (esPivote) clases.push("celda-pivote");
        tr.appendChild(el("td", { texto: celda, class: clases.join(" ") }));
      });
      tbody.appendChild(tr);
    });
    tabla.appendChild(tbody);

    return el("div", { class: "tabla-matriz-envoltorio" }, [tabla]);
  }

  function crearStepperGenerico(pasos, renderizarPaso) {
    let indice = 0;
    const cabecera = el("div", { class: "stepper-cabecera" });
    const cuerpo = el("div", { class: "stepper-cuerpo" });
    const contador = el("span", { class: "stepper-contador", "aria-live": "polite" });
    const btnAnterior = el("button", { class: "btn btn-paso", texto: "‹ Anterior" });
    const btnSiguiente = el("button", { class: "btn btn-paso", texto: "Siguiente ›" });

    function render() {
      cuerpo.innerHTML = "";
      cuerpo.appendChild(renderizarPaso(pasos[indice], indice, pasos.length));

      contador.textContent = `${indice + 1} / ${pasos.length}`;
      btnAnterior.disabled = indice === 0;
      btnSiguiente.disabled = indice === pasos.length - 1;

      cabecera.innerHTML = "";
      pasos.forEach((_, i) => {
        cabecera.appendChild(el("button", {
          class: `stepper-punto${i === indice ? " activo" : ""}`,
          title: `Paso ${i + 1}`,
          onclick: () => { indice = i; render(); },
        }));
      });
    }

    btnAnterior.addEventListener("click", () => { if (indice > 0) { indice--; render(); } });
    btnSiguiente.addEventListener("click", () => { if (indice < pasos.length - 1) { indice++; render(); } });

    render();

    const nav = el("div", { class: "stepper-nav" }, [btnAnterior, contador, btnSiguiente]);
    return el("div", { class: "stepper" }, [cabecera, cuerpo, nav]);
  }

  function crearListaPasos(pasos, renderizarFila) {
    return el("div", { class: "lista-pasos" }, pasos.map(renderizarFila));
  }

  function crearAccordion(titulo, cuerpo, abierto) {
    const encabezado = el("button", {

    cuerpo.style.display = abierto ? "block" : "none";

      encabezado.classList.toggle("abierto", !visible);
    });
    return el("div", { class: "accordion" }, [encabezado, cuerpo]);
  }

  let sidebarColapsadoEscritorio = true;

    btnMenu.setAttribute("aria-expanded", "false");

    panel.inert = false;
    if (devolverFoco) btnMenu.focus();

  /* Escritorio: restaura el replegado guardado. Móvil: lo quita sin guardar. */
  function aplicarModoNavegacion() {
    if (MQ_MOVIL.matches) {

  function iniciarDrawer() {

    btnMenu.onclick = () => (drawerAbierto() ? cerrarDrawer(true) : abrirDrawer());
    overlayDrawer.onclick = () => cerrarDrawer(true);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && drawerAbierto()) cerrarDrawer(true);
    });
    MQ_MOVIL.addEventListener("change", aplicarModoNavegacion);

  function crearBotonColapsar() {

  async function verificarEstadoServidor(indicadores) {

      if (!respuesta.ok) throw new Error("estado no-ok");
    } catch (error) {
      conectado = false;

    const texto = conectado ? "Server connected" : "Server disconnected";
    for (const [puntoEstado, textoEstado] of indicadores) {
      puntoEstado.className = "estado-punto " + (conectado ? "conectado" : "desconectado");
      textoEstado.textContent = texto;
      textoEstado.parentNode.title = texto;
    }

  /* `ejercicio` es opcional: si se pasa (desde la sección de ejercicios),
     la vista del método abre con sus datos ya cargados, sin resolver. */
  function mostrarVista(metodo, ejercicio) {
    for (const boton of sidebar.querySelectorAll(".nav-btn")) {
      boton.classList.toggle("active", boton.dataset.nombre === metodo.nombre);

  /* ==========================================================
     FUNCIONALIDADES: EXPORTAR RESPUESTA (PNG / PDF)
     ========================================================== */

  /* Ruta de resolución -> clave de módulo que entiende /api/exportar. */
  const MODULO_EXPORTAR = {
    "/api/sistema": "sistema",
    "/api/conversion": "conversion",
    "/api/vectores": "vectores",
    "/api/matrices": "matrices",
    "/api/ecuacion-matricial": "ecuacion-matricial",
    "/api/inversa": "inversa",
    "/api/determinante": "determinante",
    "/api/biseccion": "biseccion",
    "/api/falsa-posicion": "falsa-posicion",
  };

  const TEXTO_SIN_RESULTADO = "Resuelve primero para exportar";

  let exportable = null;     // { modulo, datos } del último cálculo correcto
  let menuExportar = null;   // menú de la vista actual
  let incluirPasosExportar = true;

  /* `enlace` (opcional): { texto, href } agrega un enlace tocable y alarga el aviso. */
  function mostrarToast(mensaje, enlace) {
    const toast = el("div", { class: "toast", role: "status" }, [document.createTextNode(mensaje)]);
    if (enlace) {
      toast.appendChild(el("a", { href: enlace.href, target: "_blank", rel: "noopener", texto: enlace.texto }));
    }
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), enlace ? 9000 : 2600);
  }

  /* Hay algo que exportar si hubo un cálculo correcto y su resultado sigue
     a la vista (las vistas vacían el panel al limpiar o cambiar de pestaña). */
  function hayResultadoExportable() {
    const resultado = panel.querySelector(".resultado-panel");
    return !!exportable && !!resultado && resultado.childNodes.length > 0;
  }

  async function exportarRespuesta(formato) {
    if (!hayResultadoExportable()) {
      mostrarAviso(TEXTO_SIN_RESULTADO + ".");
      return;
    }

    let respuesta;
    try {
      respuesta = await fetch("/api/exportar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          modulo: exportable.modulo,
          datos: exportable.datos,
          formato,
          incluir_pasos: incluirPasosExportar,
        }),
      });
    } catch (error) {
      mostrarError(
        "No se pudo conectar con el servidor. ¿Está corriendo 'python server.py'?"
      );
      return;
    }

    if (!respuesta.ok) {
      let mensaje = "No se pudo exportar la respuesta.";
      try { mensaje = (await respuesta.json()).error || mensaje; } catch (e) {}
      mostrarError(mensaje);
      return;
    }

    const coincidencia = /filename="([^"]+)"/.exec(
      respuesta.headers.get("Content-Disposition") || ""
    );
    const nombre = coincidencia ? coincidencia[1] : "respuesta." + formato;
    const url = URL.createObjectURL(await respuesta.blob());
    const enlace = el("a", { href: url, download: nombre });
    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();
    // La URL vive un minuto: en móvil el archivo puede abrirse desde el aviso.
    setTimeout(() => URL.revokeObjectURL(url), 60000);

    // Alternativa si el navegador no admite `download` (o en móvil, donde
    // algunos navegadores lo ignoran): abrir el archivo en otra pestaña.
    const sinDescarga = !("download" in enlace);
    if (sinDescarga || MQ_MOVIL.matches) {
      mostrarToast(
        (sinDescarga ? "Archivo listo: " : "Archivo guardado: ") + nombre,
        { texto: "Abrir", href: url }
      );
    } else {
      mostrarToast("Archivo guardado: " + nombre);
    }
  }

  function crearMenuExportar() {
    const boton = el("button", {
      class: "menu-funciones-boton", type: "button",
      "aria-haspopup": "menu", "aria-expanded": "false",
      "aria-label": "Exportar respuesta",
      html: '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" ' +
            'aria-hidden="true">' +
            // Flecha de trazo grueso sobre una bandeja sólida con su "led".
            '<path d="M12 2.5v10M7.5 8.5L12 13l4.5-4.5" fill="none" ' +
            'stroke="currentColor" stroke-width="2.6" stroke-linecap="round" ' +
            'stroke-linejoin="round"/>' +
            '<path fill-rule="evenodd" d="M5 16h14a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2zM17.5 18a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>',
    });

    const itemPng = el("button", { type: "button", role: "menuitem", texto: "Exportar como PNG" });
    const itemPdf = el("button", { type: "button", role: "menuitem", texto: "Exportar como PDF" });
    const casilla = el("input", { type: "checkbox" });
    casilla.checked = incluirPasosExportar;
    casilla.addEventListener("change", () => { incluirPasosExportar = casilla.checked; });

    const lista = el("div", { class: "menu-funciones-lista", role: "menu", hidden: "hidden" }, [
      itemPng,
      itemPdf,
      el("label", { class: "menu-funciones-opcion" }, [casilla, document.createTextNode("Incluir pasos")]),
    ]);

    const nodo = el("div", { class: "menu-funciones" }, [
      el("div", { class: "menu-funciones-caja" }, [boton, lista]),
    ]);

    function abierto() { return !lista.hidden; }

    function cerrar(devolverFoco) {
      lista.hidden = true;
      boton.setAttribute("aria-expanded", "false");
      if (devolverFoco) boton.focus();
    }

    function abrir() {
      lista.hidden = false;
      boton.setAttribute("aria-expanded", "true");

    function actualizar() {
      const habilitado = hayResultadoExportable();
      boton.setAttribute("aria-disabled", habilitado ? "false" : "true");
      boton.title = habilitado ? "Exportar respuesta" : TEXTO_SIN_RESULTADO;
      if (!habilitado && abierto()) cerrar(false);
    }

    boton.addEventListener("click", () => {
      if (!hayResultadoExportable()) {
        mostrarAviso(TEXTO_SIN_RESULTADO + ".");
        return;
      }
      if (abierto()) cerrar(false); else abrir();
    });

    for (const [item, formato] of [[itemPng, "png"], [itemPdf, "pdf"]]) {
      item.addEventListener("click", () => {
        cerrar(true);
        exportarRespuesta(formato);
      });
    }

    nodo.addEventListener("keydown", (evento) => {
      if (!abierto()) return;
      if (evento.key === "Escape") {
        evento.preventDefault();
        cerrar(true);
      } else if (evento.key === "ArrowDown" || evento.key === "ArrowUp") {
        evento.preventDefault();
        const items = [itemPng, itemPdf, casilla];
        const i = items.indexOf(document.activeElement);
        const paso = evento.key === "ArrowDown" ? 1 : -1;
        items[(i + paso + items.length) % items.length].focus();
      }
    });

    function cerrarSiFuera(destino) {
      if (abierto() && !nodo.contains(destino)) cerrar(false);
    }

    return { nodo, actualizar, cerrarSiFuera };
  }

  // Un clic fuera del menú lo cierra (un solo listener para todas las vistas).
  document.addEventListener("click", (evento) => {
    if (menuExportar) menuExportar.cerrarSiFuera(evento.target);
  });

  // El estado del botón sigue al contenido del panel (resultado a la vista).
  new MutationObserver(() => { if (menuExportar) menuExportar.actualizar(); })
    .observe(panel, { childList: true, subtree: true });

  /* Rellena una cuadrícula de inputs (lista de listas) con valores de texto. */
  function llenarEntradas(entradas, valores) {
    valores.forEach((fila, i) => fila.forEach((valor, j) => {
      entradas[i][j].value = valor;
    }));
  }

  /* Rellena una lista de inputs (un vector) con valores de texto. */
  function llenarVector(entradas, valores) {
    valores.forEach((valor, i) => { entradas[i].value = valor; });
  }

  /* ==========================================================
     VISTA: SISTEMA LINEAL (Gauss-Jordan / Pivoteo)
     ========================================================== */

  const TIPO_INFO_SISTEMA = {
    unica: { titulo: "Sistema compatible determinado", detalle: "Tiene una única solución.", icono: "✓", clase: "tipo-unica" },
    infinitas: { titulo: "Sistema compatible indeterminado", detalle: "Tiene infinitas soluciones.", icono: "∞", clase: "tipo-infinitas" },
    incompatible: { titulo: "Sistema incompatible", detalle: "No tiene solución.", icono: "✕", clase: "tipo-incompatible" },
  };

  const NOMBRE_TIPO_PASO = {
    intercambio: "Intercambio de filas",
    normalizar: "Se normaliza el pivote a 1",
    eliminar: "Se elimina el coeficiente usando el pivote",
  };

  function tarjetaResultadoSistema(tipo, soluciones) {
    const info = TIPO_INFO_SISTEMA[tipo];
    return crearTarjetaVeredicto({
      tipoClase: info.clase, icono: info.icono, titulo: info.titulo,
      detalle: info.detalle, cuerpoTexto: soluciones,
    });
  }

  function tablaConEtiqueta(etiqueta, filas) {
    return el("div", { class: "matriz-etiquetada" }, [
      crearTablaMatriz(filas, {}),
      el("div", { class: "matriz-etiqueta", texto: etiqueta }),
    ]);
  }

  function renderEcuacionComprobacion(comprobacion) {
    const filasX = comprobacion.vector_x.map((v) => [v]);
    const filasB = comprobacion.vector_b.map((v) => [v]);
    return el("div", { class: "ecuacion-comprobacion" }, [
      tablaConEtiqueta("A original", comprobacion.matriz_a),
      el("span", { class: "simbolo-ecuacion", texto: "·" }),
      tablaConEtiqueta("X", filasX),
      el("span", { class: "simbolo-ecuacion", texto: "=" }),
      tablaConEtiqueta("B original", filasB),
    ]);
  }

  function renderFilasComprobacion(filas) {
    return el("div", { class: "lista-pasos" }, filas.map((f, i) => el("div", {
      class: `fila-paso fila-comprobacion${f.correcta ? "" : " fallo"}`,
      style: `animation-delay:${i * 35}ms`,
    }, [
      el("span", { class: "paso-etiqueta", texto: `Fila ${i + 1}` }),
      el("span", { class: "paso-expresion", texto: `A${i + 1}·X = ${f.ax}    B${i + 1} = ${f.b}` }),
      el("span", {
        class: `badge-comprobacion ${f.correcta ? "ok" : "fallo"}`,
        texto: f.correcta ? "✓" : "✕",
      }),
    ])));
  }

  function tarjetaComprobacion(comprobacion) {
    const correcto = comprobacion.correcto;
    const clase = correcto === null ? "tipo-neutro" : correcto ? "tipo-unica" : "tipo-incompatible";
    const icono = correcto === null ? "—" : correcto ? "✓" : "✕";
    const titulo = correcto === null
      ? "No es posible comprobar"
      : correcto ? "Comprobación correcta" : "Comprobación incorrecta";
    const detalle = correcto === null
      ? "El sistema no tiene solución."
      : "Se verifica que A original · X = B original";

    if (correcto === null) {
      return crearTarjetaVeredicto({ tipoClase: clase, icono, titulo, detalle });
    }

    const cuerpo = el("div", {}, [
      renderEcuacionComprobacion(comprobacion),
      comprobacion.tipo_sistema === "infinitas"
        ? el("p", {
            class: "nota-sin-pasos",
            texto: "Variables libres tomadas como 0 (solución particular).",
          })
        : null,
      renderFilasComprobacion(comprobacion.filas),
    ]);

    return crearTarjetaVeredicto({ tipoClase: clase, icono, titulo, detalle, cuerpoNodo: cuerpo });
  }

  function filasAfectadasDePaso(paso) {
    const filas = new Set();
    if (paso.fila_a != null) filas.add(paso.fila_a - 1);
    if (paso.fila_b != null) filas.add(paso.fila_b - 1);
    if (paso.fila != null) filas.add(paso.fila - 1);
    if (paso.fila_pivote != null) filas.add(paso.fila_pivote - 1);
    return filas;
  }

  function pivoteDePaso(paso) {
    if (paso.tipo === "normalizar") return { fila: paso.fila - 1, columna: paso.columna };
    if (paso.tipo === "eliminar") return { fila: paso.fila_pivote - 1, columna: paso.columna };
    return null;
  }

  function renderPasoSistema(paso, indice, total, encabezados, separador) {
    return el("div", { class: "paso-tarjeta" }, [
      el("div", { class: "paso-encabezado" }, [
        el("span", { class: "paso-numero", texto: `Paso ${indice + 1} de ${total}` }),
        el("span", { class: `paso-operacion tipo-${paso.tipo}`, texto: paso.operacion }),
      ]),
      el("div", { class: "paso-descripcion", texto: NOMBRE_TIPO_PASO[paso.tipo] || "" }),
      crearTablaMatriz(paso.matriz, {
        encabezados,
        separadorAntesDe: separador == null ? encabezados.length - 1 : separador,
        pivote: pivoteDePaso(paso),
        filasResaltadas: filasAfectadasDePaso(paso),
      }),
    ]);
  }

  function renderStepperYFinal(contenedor, bloqueSistema, encabezados, separador) {
    const sep = separador == null ? encabezados.length - 1 : separador;
    if (bloqueSistema.pasos.length === 0) {
      contenedor.appendChild(el("p", {
        class: "nota-sin-pasos",
        texto: "La matriz ya estaba en su forma escalonada reducida; no se requirieron operaciones.",
      }));
    } else {
      contenedor.appendChild(crearStepperGenerico(
        bloqueSistema.pasos,
        (paso, i, total) => renderPasoSistema(paso, i, total, encabezados, sep)
      ));
    }

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Matriz reducida" }));
    const pivotesFinal = bloqueSistema.pivotes.map((columna, fila) => ({ fila, columna }));
    contenedor.appendChild(crearTablaMatriz(bloqueSistema.matriz_final, {
      encabezados,
      separadorAntesDe: sep,
      pivotes: pivotesFinal,
    }));
  }

  function renderProcedimientoSistema(contenedor, resultado, encabezados, tituloProcedimiento) {
    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Matriz aumentada inicial" }));
    contenedor.appendChild(crearTablaMatriz(resultado.matriz_inicial, {
      encabezados,
      separadorAntesDe: encabezados.length - 1,
    }));

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: tituloProcedimiento || "Procedimiento" }));
    renderStepperYFinal(contenedor, resultado, encabezados);
  }

  function vistaSistemaLineal(metodo, titulo, ejercicio) {
    let entradasMatriz = [];
    let ultimoResultado = null;
    let modo = "fraccion";

    const marcoMatriz = el("div", { class: "marco-matriz" });
    const panelResultado = el("div", { class: "resultado-panel" });

    const entradaEcuaciones = el("input", { type: "number", min: "1", value: "3" });
    entradaEcuaciones.style.width = "60px";
    const entradaVariables = el("input", { type: "number", min: "1", value: "3" });
    entradaVariables.style.width = "60px";

    const botonComprobar = el("button", {
      class: "btn",
      texto: "Comprobar resultado",
      disabled: "disabled",
      onclick: comprobarResultado,
    });

    function crearMatriz() {
      let ecuaciones, variables;
      try {
        ecuaciones = enteroPositivo(entradaEcuaciones.value, "Ecuaciones");
        variables = enteroPositivo(entradaVariables.value, "Variables");
      } catch (error) {
        mostrarError("Ingrese números enteros mayores que cero.");
        return;
      }

      marcoMatriz.innerHTML = "";
      entradasMatriz = [];
      ultimoResultado = null;
      botonComprobar.disabled = true;
      panelResultado.innerHTML = "";

      const columnasTotales = variables + 2; // variables + separador + b
      const grid = el("div", {
        class: "grid-matriz",
        style: `grid-template-columns: repeat(${columnasTotales}, auto);`,
      });

      for (let j = 0; j < variables; j++) {
        grid.appendChild(el("div", { class: "encabezado", texto: `x${j + 1}` }));
      }
      grid.appendChild(el("div", { class: "separador", texto: "│" }));
      grid.appendChild(el("div", { class: "encabezado", texto: "b" }));

      for (let i = 0; i < ecuaciones; i++) {
        const filaEntradas = [];
        for (let j = 0; j < variables; j++) {
          const entrada = crearCelda();
          grid.appendChild(entrada);
          filaEntradas.push(entrada);
        }
        grid.appendChild(el("div", { class: "separador", texto: "│" }));
        const entradaB = crearCelda();
        grid.appendChild(entradaB);
        filaEntradas.push(entradaB);
        entradasMatriz.push(filaEntradas);
