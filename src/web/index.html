      el("i", { class: `l-escena-${l.tipo === "punto" ? "punto" : l.tipo === "poligono" ? "poligono" : "linea"} ${clase(l.serie)}` }),
      document.createTextNode(l.texto),
    ])));
    const avisos = escena.avisos.length
      ? el("div", { class: "escena-avisos", role: "note" }, escena.avisos.map((t) => el("div", { texto: t })))
      : null;
    return [leyenda, avisos];
  }

  /* Animación de la transformación (spec 015): deslizador t + Reproducir.
     Python manda los cuadros ya calculados (escena.animacion); aquí solo se
     elige cuál se ve. Devuelve { nodo, elementos() }: `elementos()` es lo que
     debe pintar la escena ahora (los fijos + los del cuadro elegido). Sin
     animación, nodo es null y elementos() es escena.elementos. */
  function crearControlAnimacion(escena, alCambiar) {
    const a = escena.animacion;
    if (!a || !a.pasos || !a.pasos.length) return { nodo: null, elementos: () => escena.elementos };
    const id = "anim-t-" + (++contadorEscenas);
    const fijos = escena.elementos.slice(0, a.reemplaza_desde);
    let k = a.paso_final;              // al abrir se ve el resultado (t = 1)
    let temporizador = 0;

    const deslizador = el("input", {
      type: "range", min: 0, max: a.paso_final, value: k, step: 1, id,
      "aria-label": "Valor de t: de la identidad (0) a la matriz (1)",
    });
    const boton = el("button", { type: "button", class: "grafica-boton grafica-boton-texto anim-boton", texto: "▶ Reproducir" });
    const lectura = el("div", { class: "anim-lectura" });
    const aviso = el("div", { class: "escena-avisos anim-aviso", role: "note" });
    const nota = el("div", { class: "anim-nota", texto:
      "Los pasos intermedios son una ayuda visual (mezcla de la identidad con la matriz): " +
      "solo el inicio y el final tienen significado algebraico." });

    function actualizar() {
      const paso = a.pasos[k];
      const tramo = a.tramos.length > 1 ? `${a.tramos[paso.tramo]} · ` : "";
      lectura.textContent = `${tramo}t = ${paso.t.toFixed(2)}   det M(t) = ${paso.det}`;
      aviso.textContent = paso.aplastado ? "En este t la figura está aplastada (det M(t) = 0 o pasa por 0)." : "";
      aviso.hidden = !paso.aplastado;
      deslizador.value = String(k);
      alCambiar();
    }
    function pausar() {
      if (temporizador) { clearInterval(temporizador); temporizador = 0; }
      boton.textContent = "▶ Reproducir";
    }
    function reproducir() {
      if (k >= a.paso_final) { k = 0; actualizar(); }
      boton.textContent = "⏸ Pausar";
      temporizador = setInterval(() => {
        if (!boton.isConnected) { pausar(); return; }      // la gráfica ya no está en pantalla
        if (k >= a.paso_final) { pausar(); return; }
        k += 1;
        actualizar();
        if (k >= a.paso_final) pausar();
      }, 60);
    }
    boton.addEventListener("click", () => (temporizador ? pausar() : reproducir()));
    deslizador.addEventListener("input", () => { pausar(); k = Number(deslizador.value); actualizar(); });

    const nodo = el("div", { class: "anim-control" }, [
      el("div", { class: "grafica-control" }, [
        el("label", { for: id, texto: "t" }), deslizador, boton,
      ]),
      lectura, aviso, nota,
    ]);
    aviso.hidden = true;
    lectura.textContent = `${a.tramos.length > 1 ? a.tramos[a.pasos[k].tramo] + " · " : ""}t = ${a.pasos[k].t.toFixed(2)}   det M(t) = ${a.pasos[k].det}`;
    if (a.pasos[k].aplastado) { aviso.hidden = false; aviso.textContent = "En este t la figura está aplastada (det M(t) = 0 o pasa por 0)."; }
    return { nodo, elementos: () => fijos.concat(a.pasos[k].elementos) };
  }

  /* Redibuja cuando el contenedor cambia de ancho (o aparece al desplegarlo). */
  function observarAnchoEscena(lienzo, dibujar) {
    let anchoPrevio = 0;
    if (typeof ResizeObserver === "function") {
      new ResizeObserver(() => {
        const w = Math.round(lienzo.clientWidth);
        if (w > 0 && w !== anchoPrevio) { anchoPrevio = w; dibujar(); }
      }).observe(lienzo);
    }
    requestAnimationFrame(dibujar);
  }

  /* Profundidad y sombreado de los polígonos 3D (presentación; la geometría
     viene de Python). Sin buffer de profundidad, el orden "de lejos a cerca"
     falla cuando dos polígonos se atraviesan (planos que se cortan, cubos
     dentro de cubos). Arreglo: antes de ordenar, cada polígono se parte por el
     plano de los demás; así ninguna pieza atraviesa a otra y ordenarlas por su
     distancia media es correcto. */
  function normalDePoligono(pts) {          // método de Newell
    let nx = 0, ny = 0, nz = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      nx += (a[1] - b[1]) * (a[2] + b[2]);
      ny += (a[2] - b[2]) * (a[0] + b[0]);
      nz += (a[0] - b[0]) * (a[1] + b[1]);
    }
    const largo = Math.hypot(nx, ny, nz);
    return largo > 1e-12 ? [nx / largo, ny / largo, nz / largo] : null;
  }

  /* Parte un polígono convexo por el plano n·x = d. Devuelve [delante, detrás]
     o null si el plano no lo atraviesa. */
  function partirPoligonoPorPlano(pts, n, d, eps) {
    const lado = pts.map((p) => n[0] * p[0] + n[1] * p[1] + n[2] * p[2] - d);
    if (!lado.some((v) => v > eps) || !lado.some((v) => v < -eps)) return null;
    const pos = [], neg = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length], sa = lado[i], sb = lado[(i + 1) % pts.length];
      if (sa >= -eps) pos.push(a);
      if (sa <= eps) neg.push(a);
      if ((sa > eps && sb < -eps) || (sa < -eps && sb > eps)) {
        const t = sa / (sa - sb);
        const q = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        pos.push(q); neg.push(q);
      }
    }
    return pos.length >= 3 && neg.length >= 3 ? [pos, neg] : null;
  }

  const MAX_PIEZAS_3D = 600;
  function partirPoligonos3D(elementos, escalaMundo) {
    const eps = 1e-7 * Math.max(1, escalaMundo);
    const base = elementos.map((e) => ({ e, pts: e.puntos, n: normalDePoligono(e.puntos) }));
    const planos = base.map((b) => b.n && { n: b.n, d: b.n[0] * b.pts[0][0] + b.n[1] * b.pts[0][1] + b.n[2] * b.pts[0][2] });
    let piezas = base.map((b, i) => ({ ...b, origen: i }));
    planos.forEach((plano, j) => {
      if (!plano || piezas.length > MAX_PIEZAS_3D) return;
      const siguiente = [];
      for (const pieza of piezas) {
        const partes = pieza.origen === j ? null : partirPoligonoPorPlano(pieza.pts, plano.n, plano.d, eps);
        if (partes) partes.forEach((pts) => siguiente.push({ ...pieza, pts }));
        else siguiente.push(pieza);
      }
      piezas = siguiente;
    });
    return piezas;
  }

  /* Sombreado: luz fija respecto a la cámara (arriba a la izquierda y de
     frente); cuanto más de frente a la luz está una cara, más intenso su
     relleno. `normalCam` = [derecha, arriba, hacia el observador]. */
  const LUZ_CAMARA = (() => { const v = [-0.35, 0.45, 0.82]; const l = Math.hypot(...v); return v.map((c) => c / l); })();
  function opacidadSombreada(normalCam) {
    if (!normalCam) return 0.2;
    const luz = Math.abs(normalCam[0] * LUZ_CAMARA[0] + normalCam[1] * LUZ_CAMARA[1] + normalCam[2] * LUZ_CAMARA[2]);
    return 0.1 + 0.32 * luz;
  }

  /* Escena 3D: proyección ortogonal con cámara orbital (azimut y elevación
     en grados; z hacia arriba). Arrastrar rota, la rueda o el pellizco hacen
     zoom. Los elementos se pintan por capas (polígonos, trazos, puntos) y,
     dentro de cada capa, de lejos a cerca. La misma proyección la usa
     features/escena_exportar.py para el PNG y el PDF. */
  function crearEscena3D(escena) {
    const idRecorte = "e-recorte-" + (++contadorEscenas);
    const ejes = escena.ejes, caja3 = escena.caja;
    const rangos = [caja3.x, caja3.y, caja3.z];
    const centro = rangos.map((r) => (r[0] + r[1]) / 2);
    const radio = (rangos[0][1] - rangos[0][0]) / 2 * Math.sqrt(3);
    const inicial = { az: escena.camara.azimut, el: escena.camara.elevacion, zoom: 1 };
    const cam = { ...inicial };
    const caja = { izq: 12, der: 12, arr: 10, aba: 10, ancho: 0, alto: 0 };

    const { nodo: herramientas, mas: botonMas, menos: botonMenos, reset: botonReset } = crearHerramientasEscena();
    const anim = crearControlAnimacion(escena, () => redibujar());
    const lienzo = el("div", {
      class: "grafica-lienzo", tabindex: "0", role: "group",
      title: "Arrastra para rotar · rueda o pellizco para zoom",
      "aria-label": "Gráfica 3D interactiva. Flechas para rotar, más y menos para el zoom, cero para restablecer.",
    });

    const rad = (g) => g * Math.PI / 180;
    function dibujar() {
      caja.ancho = Math.max(240, Math.round(lienzo.clientWidth || 600));
      caja.alto = Math.round(Math.max(280, Math.min(460, caja.ancho * 0.8)));
      const anchoUtil = caja.ancho - caja.izq - caja.der, altoUtil = caja.alto - caja.arr - caja.aba;
      const medioX = caja.izq + anchoUtil / 2, medioY = caja.arr + altoUtil / 2;
      const escala = Math.min(anchoUtil, altoUtil) / (2 * radio) * 0.95 * cam.zoom;
      const ca = Math.cos(rad(cam.az)), sa = Math.sin(rad(cam.az));
      const ce = Math.cos(rad(cam.el)), se = Math.sin(rad(cam.el));
      // D mayor = más lejos de la cámara.
      const proy = (p) => {
        const x = p[0] - centro[0], y = p[1] - centro[1], z = p[2] - centro[2];
        const a = x * ca - y * sa, b = x * sa + y * ca;
        return [medioX + a * escala, medioY - (z * ce + b * se) * escala, b * ce - z * se];
      };
      const acotar = (v) => Math.max(-1e6, Math.min(1e6, v));
      const pts = (lista) => lista.map((p) => proy(p).map(acotar));

      const svg = svgEl("svg", { viewBox: `0 0 ${caja.ancho} ${caja.alto}`, role: "img", "aria-label": escena.resumen });
      const defs = svgEl("defs");
      const recorte = svgEl("clipPath", { id: idRecorte });
      recorte.appendChild(svgEl("rect", { x: caja.izq, y: caja.arr, width: anchoUtil, height: altoUtil }));
      defs.appendChild(recorte);
      svg.appendChild(defs);
      svg.appendChild(svgEl("rect", { class: "g-fondo", x: caja.izq, y: caja.arr, width: anchoUtil, height: altoUtil }));
      const area = svgEl("g", { "clip-path": `url(#${idRecorte})` });
      svg.appendChild(area);

      const linea = (cls, a, b, extra) => svgEl("line", Object.assign({ class: cls, x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, extra || {}));
      const [rx, ry, rz] = rangos;

      // Suelo (z mínimo) con rejilla y aristas de la caja.
      for (const [v] of marcasEje(rx[0], rx[1], 5)) {
        area.appendChild(linea("g-rejilla", proy([v, ry[0], rz[0]]), proy([v, ry[1], rz[0]])));
      }
      for (const [v] of marcasEje(ry[0], ry[1], 5)) {
        area.appendChild(linea("g-rejilla", proy([rx[0], v, rz[0]]), proy([rx[1], v, rz[0]])));
      }
      for (const i of [0, 1]) for (const j of [0, 1]) {
        area.appendChild(linea("g-caja", proy([rx[i], ry[j], rz[0]]), proy([rx[i], ry[j], rz[1]])));
        area.appendChild(linea("g-caja", proy([rx[0], ry[i], rz[j]]), proy([rx[1], ry[i], rz[j]])));
        area.appendChild(linea("g-caja", proy([rx[i], ry[0], rz[j]]), proy([rx[i], ry[1], rz[j]])));
      }

      // Ejes por el origen, con su nombre y marcas.
      const rotulos = [];
      const origen = [0, 0, 0];
      rangos.forEach((r, k) => {
        const fin = origen.slice(), ini = origen.slice();
        ini[k] = r[0]; fin[k] = r[1];
        area.appendChild(linea("g-eje3d", proy(ini), proy(fin)));
        const punta = proy(fin);
        rotulos.push([punta[0] + 6, punta[1] - 6, ejes[k], "g-etiqueta"]);
        for (const [v, texto] of marcasEje(r[0], r[1], 4)) {
          if (v === 0) continue;
          const q = origen.slice(); q[k] = v;
          const s = proy(q);
          area.appendChild(svgEl("circle", { class: "g-marca3d", cx: s[0], cy: s[1], r: 2 }));
          rotulos.push([s[0] + 4, s[1] + 12, texto, "g-tick-3d"]);
        }
      });

      const clase = (serie) => serie === "solucion" ? "e-sol" : "e-s" + ((serie % 6) + 1);
      const claseTrazo = (e) => `e-trazo ${clase(e.serie)}${e.guion ? " e-guion" : ""}${e.grosor === "fuerte" ? " e-fuerte" : ""}`;
      const lejania = (lista) => lista.reduce((s, p) => s + p[2], 0) / lista.length;
      const porLejania = (a, b) => b.d - a.d;

      const poligonos = partirPoligonos3D(anim.elementos().filter((e) => e.tipo === "poligono"), radio).map((pieza) => {
        const p = pts(pieza.pts);
        const n = pieza.n;
        const normalCam = n && (() => {
          const a = n[0] * ca - n[1] * sa, b = n[0] * sa + n[1] * ca;
          return [a, n[2] * ce + b * se, -(b * ce - n[2] * se)];
        })();
        return { e: pieza.e, p, d: lejania(p), opacidad: opacidadSombreada(normalCam) };
      }).sort(porLejania);
      for (const { e, p, opacidad } of poligonos) {
        area.appendChild(svgEl("path", {
          class: `e-relleno ${clase(e.serie)}${e.guion ? " e-guion" : ""}`,
          style: `fill-opacity:${opacidad.toFixed(3)}`,
          d: p.map((q, k) => `${k ? "L" : "M"}${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join("") + "Z",
        }));
      }

      const trazos = anim.elementos().filter((e) => e.tipo === "segmento" || e.tipo === "flecha").map((e) => {
        const p = pts([e.a, e.b]);
        return { e, p, d: lejania(p) };
      }).sort(porLejania);
      for (const { e, p } of trazos) {
        area.appendChild(linea(claseTrazo(e), p[0], p[1]));
        if (e.tipo === "flecha") {
          const largo = Math.hypot(p[1][0] - p[0][0], p[1][1] - p[0][1]);
          if (largo > 1) {
            const ux = (p[1][0] - p[0][0]) / largo, uy = (p[1][1] - p[0][1]) / largo, h = Math.min(11, largo * 0.6);
            area.appendChild(svgEl("path", {
              class: `e-punta ${clase(e.serie)}`,
              d: `M${p[1][0]} ${p[1][1]}L${p[1][0] - ux * h - uy * h * 0.45} ${p[1][1] - uy * h + ux * h * 0.45}` +
                 `L${p[1][0] - ux * h + uy * h * 0.45} ${p[1][1] - uy * h - ux * h * 0.45}Z`,
            }));
          }
          if (e.etiqueta) rotulos.push([p[1][0] + 8, p[1][1] - 8, e.etiqueta, "g-etiqueta"]);
        }
      }

      for (const e of anim.elementos().filter((x) => x.tipo === "punto").map((x) => ({ e: x, p: proy(x.p) })).sort((a, b) => b.p[2] - a.p[2])) {
        area.appendChild(svgEl("circle", {
          class: `e-punto ${clase(e.e.serie)}`, cx: acotar(e.p[0]), cy: acotar(e.p[1]), r: e.e.grosor === "fuerte" ? 6.5 : 4.5,
        }));
        if (e.e.etiqueta) rotulos.push([e.p[0] + 10, e.p[1] - 10, e.e.etiqueta, "g-etiqueta"]);
      }
      for (const [x, y, texto, cls] of rotulos) {
        area.appendChild(svgEl("text", { class: cls, x: acotar(x), y: acotar(y), "text-anchor": "start" }, texto));
      }

      svg.appendChild(svgEl("rect", { class: "g-marco", x: caja.izq, y: caja.arr, width: anchoUtil, height: altoUtil }));
      lienzo.replaceChildren(svg);
    }

    let cuadro = 0;
    function redibujar() {
      if (cuadro) return;
      cuadro = requestAnimationFrame(() => { cuadro = 0; dibujar(); });
    }
    const girar = (daz, del) => { cam.az += daz; cam.el = Math.max(-89, Math.min(89, cam.el + del)); redibujar(); };
    const zoom = (factor) => { cam.zoom = Math.max(0.25, Math.min(20, cam.zoom / factor)); redibujar(); };
    const restablecer = () => { Object.assign(cam, inicial); redibujar(); };

    instalarGestosEscena(lienzo, {
      inercia: true,
      arrastrar: (dx, dy) => girar(dx * 0.5, dy * 0.5),
      zoom: (factor) => zoom(factor),
      pellizco: (factor) => zoom(factor),
      restablecer,
      tecla(ev) {
        const acciones = {
          ArrowLeft: () => girar(-5, 0), ArrowRight: () => girar(5, 0),
          ArrowUp: () => girar(0, -5), ArrowDown: () => girar(0, 5),
          "+": () => zoom(1 / 1.25), "=": () => zoom(1 / 1.25),
          "-": () => zoom(1.25), "_": () => zoom(1.25), "0": restablecer,
        };
        if (!acciones[ev.key]) return false;
        acciones[ev.key]();
        return true;
      },
      cursor() {},
    });
    botonMas.addEventListener("click", () => zoom(1 / 1.4));
    botonMenos.addEventListener("click", () => zoom(1.4));
    botonReset.addEventListener("click", restablecer);

    const marco = el("div", { class: "grafica-marco" }, [herramientas, lienzo, anim.nodo, ...crearPieEscena(escena)]);
    observarAnchoEscena(lienzo, dibujar);
    return marco;
  }

  /* Marco con la gráfica de una escena (2D o 3D). Devuelve el elemento. */
  function crearEscenaGeometrica(escena) {
    if (!escena || !escena.disponible) {
      return crearAvisoEscena(escena && escena.motivo ? escena.motivo
        : "No hay gráfica para este caso.");
    }
    if (escena.dim === 3) return crearEscena3D(escena);
    const idRecorte = "e-recorte-" + (++contadorEscenas);
    const ejes = escena.ejes;
    const caja = { izq: 50, der: 12, arr: 10, aba: 28, ancho: 0, alto: 0, anchoUtil: 1, altoUtil: 1 };
    const vista = { cx: 0, cy: 0, esc: 1 };
    let tocada = false;        // si el usuario movió la vista, ya no se reajusta sola

    const lienzo = el("div", {
      class: "grafica-lienzo", tabindex: "0", role: "group",
      title: "Arrastra para mover · rueda o pellizco para zoom",
      "aria-label": "Gráfica interactiva. Flechas para mover, más y menos para el zoom, cero para restablecer.",
    });
    const cursor = el("div", { class: "grafica-cursor", "aria-hidden": "true" });

    const { nodo: herramientas, mas: botonMas, menos: botonMenos, reset: botonReset } = crearHerramientasEscena();
    const anim = crearControlAnimacion(escena, () => redibujar());

    function ajustarVista() {
      const v = escena.ventana;
      vista.cx = (v.x[0] + v.x[1]) / 2;
      vista.cy = (v.y[0] + v.y[1]) / 2;
      vista.esc = Math.min(caja.anchoUtil / (v.x[1] - v.x[0]), caja.altoUtil / (v.y[1] - v.y[0]));
    }

    const clase = (serie) => serie === "solucion" ? "e-sol" : "e-s" + ((serie % 6) + 1);
    const acotar = (v) => Math.max(-1e6, Math.min(1e6, v));

    function dibujar() {
      caja.ancho = Math.max(240, Math.round(lienzo.clientWidth || 600));
      caja.alto = Math.round(Math.max(240, Math.min(420, caja.ancho * 0.7)));
      caja.anchoUtil = caja.ancho - caja.izq - caja.der;
      caja.altoUtil = caja.alto - caja.arr - caja.aba;
      if (!tocada) ajustarVista();

      const { izq, arr, anchoUtil, altoUtil } = caja;
      const medioX = izq + anchoUtil / 2, medioY = arr + altoUtil / 2;
      const sx = (x) => acotar(medioX + (x - vista.cx) * vista.esc);
      const sy = (y) => acotar(medioY - (y - vista.cy) * vista.esc);
      const xMin = vista.cx - anchoUtil / 2 / vista.esc, xMax = vista.cx + anchoUtil / 2 / vista.esc;
      const yMin = vista.cy - altoUtil / 2 / vista.esc, yMax = vista.cy + altoUtil / 2 / vista.esc;

      const svg = svgEl("svg", { viewBox: `0 0 ${caja.ancho} ${caja.alto}`, role: "img", "aria-label": escena.resumen });
      const defs = svgEl("defs");
      const recorte = svgEl("clipPath", { id: idRecorte });
      recorte.appendChild(svgEl("rect", { x: izq, y: arr, width: anchoUtil, height: altoUtil }));
      defs.appendChild(recorte);
      svg.appendChild(defs);
      svg.appendChild(svgEl("rect", { class: "g-fondo", x: izq, y: arr, width: anchoUtil, height: altoUtil }));

      for (const [v, texto] of marcasEje(xMin, xMax, Math.max(4, Math.round(anchoUtil / 70)))) {
        const x = sx(v);
        svg.appendChild(svgEl("line", { class: "g-rejilla", x1: x, x2: x, y1: arr, y2: arr + altoUtil }));
        svg.appendChild(svgEl("text", { class: "g-tick", x, y: caja.alto - 9, "text-anchor": "middle" }, texto));
      }
      for (const [v, texto] of marcasEje(yMin, yMax, Math.max(4, Math.round(altoUtil / 45)))) {
        const y = sy(v);
        svg.appendChild(svgEl("line", { class: "g-rejilla", x1: izq, x2: izq + anchoUtil, y1: y, y2: y }));
        svg.appendChild(svgEl("text", { class: "g-tick", x: izq - 6, y: y + 4, "text-anchor": "end" }, texto));
      }

      const area = svgEl("g", { "clip-path": `url(#${idRecorte})` });
      svg.appendChild(area);
      if (yMin < 0 && yMax > 0) area.appendChild(svgEl("line", { class: "g-eje", x1: izq, x2: izq + anchoUtil, y1: sy(0), y2: sy(0) }));
      if (xMin < 0 && xMax > 0) area.appendChild(svgEl("line", { class: "g-eje", x1: sx(0), x2: sx(0), y1: arr, y2: arr + altoUtil }));

      const trazo = (cls, el1, el2, extra) => svgEl("line", Object.assign({
        class: cls, x1: sx(el1[0]), y1: sy(el1[1]), x2: sx(el2[0]), y2: sy(el2[1]),
      }, extra || {}));
      const claseTrazo = (e) => `e-trazo ${clase(e.serie)}${e.guion ? " e-guion" : ""}${e.grosor === "fuerte" ? " e-fuerte" : ""}`;
      const rotulos = [];

      const orden = { poligono: 0, recta: 1, segmento: 1, flecha: 2, punto: 3 };
      const elementos = anim.elementos().slice().sort((a, b) => orden[a.tipo] - orden[b.tipo]);
      for (const e of elementos) {
        if (e.tipo === "poligono") {
          area.appendChild(svgEl("path", {
            class: `e-relleno ${clase(e.serie)}${e.guion ? " e-guion" : ""}`,
            d: e.puntos.map((p, k) => `${k ? "L" : "M"}${sx(p[0]).toFixed(1)} ${sy(p[1]).toFixed(1)}`).join("") + "Z",
          }));
        } else if (e.tipo === "recta") {
          const L = (caja.ancho + caja.alto) / vista.esc * 2 + Math.hypot(e.p[0] - vista.cx, e.p[1] - vista.cy);
          area.appendChild(trazo(claseTrazo(e),
            [e.p[0] - e.d[0] * L, e.p[1] - e.d[1] * L], [e.p[0] + e.d[0] * L, e.p[1] + e.d[1] * L]));
        } else if (e.tipo === "segmento") {
          area.appendChild(trazo(claseTrazo(e), e.a, e.b));
        } else if (e.tipo === "flecha") {
          area.appendChild(trazo(claseTrazo(e), e.a, e.b));
          const ax = sx(e.a[0]), ay = sy(e.a[1]), bx = sx(e.b[0]), by = sy(e.b[1]);
          const largo = Math.hypot(bx - ax, by - ay);
          if (largo > 1) {
            const ux = (bx - ax) / largo, uy = (by - ay) / largo, h = Math.min(11, largo * 0.6);
            area.appendChild(svgEl("path", {
              class: `e-punta ${clase(e.serie)}`,
              d: `M${bx} ${by}L${bx - ux * h - uy * h * 0.45} ${by - uy * h + ux * h * 0.45}` +
                 `L${bx - ux * h + uy * h * 0.45} ${by - uy * h - ux * h * 0.45}Z`,
            }));
          }
          if (e.etiqueta) rotulos.push([bx + 8, by - 8, e.etiqueta, "start"]);
        } else if (e.tipo === "punto") {
          area.appendChild(svgEl("circle", {
            class: `e-punto ${clase(e.serie)}`, cx: sx(e.p[0]), cy: sy(e.p[1]), r: e.grosor === "fuerte" ? 6.5 : 4.5,
          }));
          if (e.etiqueta) rotulos.push([sx(e.p[0]) + 10, sy(e.p[1]) - 10, e.etiqueta, "start"]);
        }
      }
      for (const [x, y, texto, ancla] of rotulos) {
        area.appendChild(svgEl("text", { class: "g-etiqueta", x, y, "text-anchor": ancla }, texto));
      }

      svg.appendChild(svgEl("rect", { class: "g-marco", x: izq, y: arr, width: anchoUtil, height: altoUtil }));
      lienzo.replaceChildren(svg);
    }

    let cuadro = 0;
    function redibujar() {
      if (cuadro) return;
      cuadro = requestAnimationFrame(() => { cuadro = 0; dibujar(); });
    }
    const fijar = () => { tocada = true; };

    function zoom(factor, px, py) {
      fijar();
      const medioX = caja.izq + caja.anchoUtil / 2, medioY = caja.arr + caja.altoUtil / 2;
      const px0 = px === undefined ? medioX : px, py0 = py === undefined ? medioY : py;
      const wx = vista.cx + (px0 - medioX) / vista.esc, wy = vista.cy - (py0 - medioY) / vista.esc;
      const nueva = Math.max(1e-6, Math.min(1e9, vista.esc / factor));
      vista.esc = nueva;
      vista.cx = wx - (px0 - medioX) / nueva;
      vista.cy = wy + (py0 - medioY) / nueva;
      redibujar();
    }
    function mover(fx, fy) {          // fracción del tamaño visible
      fijar();
      vista.cx += fx * caja.anchoUtil / vista.esc;
      vista.cy += fy * caja.altoUtil / vista.esc;
      redibujar();
    }
    function restablecer() { tocada = false; redibujar(); }

    instalarGestosEscena(lienzo, {
      arrastrar(dx, dy) { fijar(); vista.cx -= dx / vista.esc; vista.cy += dy / vista.esc; redibujar(); },
      zoom: (factor, px, py) => zoom(factor, px, py),
      pellizco: (factor, px, py) => zoom(factor, px, py),
      restablecer,
      tecla(ev) {
        const acciones = {
          ArrowLeft: () => mover(-0.1, 0), ArrowRight: () => mover(0.1, 0),
          ArrowUp: () => mover(0, 0.1), ArrowDown: () => mover(0, -0.1),
          "+": () => zoom(1 / 1.25), "=": () => zoom(1 / 1.25),
          "-": () => zoom(1.25), "_": () => zoom(1.25), "0": restablecer,
        };
        if (!acciones[ev.key]) return false;
        acciones[ev.key]();
        return true;
      },
      cursor(px, py) {
        if (px === null || px < caja.izq || px > caja.izq + caja.anchoUtil || py < caja.arr || py > caja.arr + caja.altoUtil) {
          cursor.textContent = "";
          return;
        }
        const x = vista.cx + (px - caja.izq - caja.anchoUtil / 2) / vista.esc;
        const y = vista.cy - (py - caja.arr - caja.altoUtil / 2) / vista.esc;
        cursor.textContent = `${ejes[0]} = ${x.toPrecision(5)}   ${ejes[1]} = ${y.toPrecision(5)}`;
      },
    });
    botonMas.addEventListener("click", () => zoom(1 / 1.4));
    botonMenos.addEventListener("click", () => zoom(1.4));
    botonReset.addEventListener("click", restablecer);

    const marco = el("div", { class: "grafica-marco" }, [herramientas, lienzo, cursor, anim.nodo, ...crearPieEscena(escena)]);
    observarAnchoEscena(lienzo, dibujar);
    return marco;
  }

  /* Varias escenas (p. ej. una por columna de B): un selector elige cuál se ve. */
  let contadorSelectoresEscena = 0;
  function agregarGraficasEscenas(contenedor, escenas, titulo) {
    if (escenas.length === 1) {
      agregarGraficaEscena(contenedor, escenas[0], titulo);
      return;
    }
    const id = "escena-columna-" + (++contadorSelectoresEscena);
    const selector = el("select", { id }, escenas.map((_, k) => el("option", { value: String(k), texto: `Columna ${k + 1} de B` })));
    const zona = el("div");
    const mostrar = () => zona.replaceChildren(crearEscenaGeometrica(escenas[Number(selector.value)]));
    selector.addEventListener("change", mostrar);
    mostrar();
    const cuerpo = el("div", {}, [
      el("div", { class: "grafica-control escena-selector" }, [el("label", { for: id, texto: "Gráfica de:" }), selector]),
      zona,
    ]);
    contenedor.appendChild(crearSeccionDesplegable(titulo || "Gráfica", cuerpo, true));
    contenedor.appendChild(cuerpo);
  }

  /* Sección desplegable (oculta al inicio) con la gráfica de una escena. */
  function agregarGraficaEscena(contenedor, escena, titulo) {
    const marco = crearEscenaGeometrica(escena);
    contenedor.appendChild(crearSeccionDesplegable(titulo || "Gráfica", marco, true));
    contenedor.appendChild(marco);
  }

  function renderBiseccion(contenedor, bloque) {
    contenedor.innerHTML = "";
    const e = bloque.entradas, r = bloque.resultado, c = bloque.comprobacion;
    const ultima = (bloque.pasos || []).length - 1;   // bloqueada: no hay pasos
    const marca = (bien) => (bien ? "✓" : "✕");

    const bloqueada = bloque.bloqueada;
    const cfg = METODOS_RAICES[bloque.tipo];
    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: cfg.titulo }));
    contenedor.appendChild(el("div", { class: "planteamiento", texto:
      `f(x) = ${e.funcion}\n[a, b] = [${e.a}, ${e.b}]   E = ${e.tolerancia} (${e.tolerancia_porcentaje} %)` +
      (bloqueada ? "" : `\nf(a) = ${bloque.inicial.fa}   f(b) = ${bloque.inicial.fb}   →   f(a)·f(b) < 0 ✓`) }));
    contenedor.lastChild.style.whiteSpace = "pre-wrap";

    // Paso 1: la gráfica de f(x) en [a, b], antes de iterar.
    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Paso 1 · Gráfica de f(x)" }));
    const graficaMarco = crearGraficaBiseccion(bloque);
    contenedor.appendChild(crearSeccionDesplegable("Gráfica de f(x)", graficaMarco, false));
    contenedor.appendChild(graficaMarco);

    // Paso 2: con la gráfica y el muestreo se decide si f es continua.
    const cont = bloque.continuidad;
    const resto = cont.total - cont.sospechas.length;
    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Paso 2 · Continuidad" }));
    contenedor.appendChild(crearTarjetaVeredicto({
      tipoClase: cont.sin_senales ? "tipo-unica" : "tipo-incompatible",
      icono: cont.sin_senales ? "✓" : "✕",
      titulo: cont.sin_senales ? "f es continua en [a, b] (sin señales de discontinuidad)" : "f NO es continua en [a, b]",
      detalle: `Se evaluó f en ${cont.muestras} puntos de [${e.a}, ${e.b}]. ` +
        "Es una revisión numérica, no una demostración: un salto más angosto que el paso de muestreo podría pasar inadvertido.",
      cuerpoNodo: cont.sin_senales ? null : el("div", {}, [
        ...cont.sospechas.map((q) => el("div", { class: "termino-linea", texto: `⚠ ${q.mensaje}` })),
        ...(resto > 0 ? [el("div", { class: "termino-linea", texto: `… y ${resto} más.` })] : []),
      ]),
    }));

    if (bloqueada) {
      contenedor.appendChild(crearTarjetaVeredicto({
        tipoClase: "tipo-incompatible",
        icono: "✕",
        titulo: "Método no aplicado",
        detalle: bloque.motivo_bloqueo,
      }));
      return;
    }

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Paso 3 · Iteraciones" }));
    const tablaIteraciones = crearTablaMatriz(
      bloque.pasos.map((p) => [String(p.i), p.a, p.b, p.c, p.fc, p.error]),
      { encabezados: ["i", "a", "b", "c", "f(c)", "εa (%)"], filasResaltadas: new Set([ultima]) });
    tablaIteraciones.querySelector("table").classList.add("tabla-iteraciones");
    contenedor.appendChild(crearSeccionDesplegable("Tabla de iteraciones", tablaIteraciones, false));
    contenedor.appendChild(tablaIteraciones);

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Procedimiento" }));
    if (cfg.ayudaC) contenedor.appendChild(el("p", { class: "campo-ayuda", texto: cfg.ayudaC }));
    contenedor.appendChild(crearStepperGenerico(bloque.pasos, (p, i, t) => renderPasoRaices(bloque.tipo, p, i, t)));

    const aviso = bloque.advertencias.length > 0;
    contenedor.appendChild(crearTarjetaVeredicto({
      tipoClase: r.convergio && !aviso ? "tipo-unica" : "tipo-infinitas",
      icono: r.convergio && !aviso ? "✓" : "!",
      titulo: `x ≈ ${r.raiz}`,
      detalle: MOTIVO_BISECCION[r.motivo],
      cuerpoTexto:
        `Iteraciones: ${r.iteraciones}` +
        (bloque.cota_iteraciones !== undefined ? ` (cota teórica: n ≥ ${bloque.cota_iteraciones})` : "") + "\n" +
        `f(raíz) = ${r.fraiz}\nεa final = ${r.error} %`,
      cuerpoNodo: aviso ? el("div", {}, bloque.advertencias.map((t) =>
        el("div", { class: "termino-linea", texto: `⚠ ${t}` }))) : null,
    }));

    contenedor.appendChild(crearTarjetaVeredicto({
      tipoClase: c.correcto ? "tipo-unica" : (c.cambio_signo ? "tipo-infinitas" : "tipo-incompatible"),
      icono: c.correcto ? "✓" : (c.cambio_signo ? "!" : "✕"),
      titulo: c.correcto ? "Comprobación correcta" : "Revisa la comprobación",
      detalle: "Se vuelve a evaluar f en la raíz y en los extremos del intervalo final.",
      cuerpoNodo: el("div", {}, [
        el("div", { class: "termino-linea", texto: `f(${c.raiz}) = ${c.fraiz}` }),
        el("div", { class: "termino-linea", texto: `Intervalo final [${c.intervalo[0]}, ${c.intervalo[1]}]: f(a) = ${c.fa}, f(b) = ${c.fb}` }),
        el("div", { class: "termino-linea", texto: `${marca(c.cambio_signo)} Sigue habiendo cambio de signo en el intervalo final` }),
        el("div", { class: "termino-linea", texto: `${marca(c.tolerancia_alcanzada)} Se alcanzó la tolerancia E` }),
        el("div", { class: "termino-linea", texto: `${marca(c.cerca_de_cero)} f(raíz) es cercano a 0` }),
        el("div", { class: "termino-linea", texto: `${marca(cont.sin_senales)} Sin señales de discontinuidad en [a, b]` }),
      ]),
    }));
  }

  /* Presentación de la función escrita: potencias como exponente, · − π √.
     Solo cambia cómo se ve; el texto que se envía al servidor no se toca. */
  function formatearFuncion(texto) {
    const adornar = (t) => t.replace(/\*/g, "·").replace(/-/g, "−")
      .replace(/\bpi\b/gi, "π").replace(/\bsqrt\b/gi, "√");
    const base = texto.replace(/\*\*/g, "^");
    const patron = /\^\s*(\([^()]*\)|[+-]?[0-9]+(?:[.,][0-9]+)?|[A-Za-z]+)/g;
    const fragmento = document.createDocumentFragment();
    let ultimo = 0, m;
    while ((m = patron.exec(base)) !== null) {
      fragmento.appendChild(document.createTextNode(adornar(base.slice(ultimo, m.index))));
      const exponente = m[1][0] === "(" ? m[1].slice(1, -1) : m[1];
      fragmento.appendChild(el("sup", { texto: adornar(exponente) }));
      ultimo = patron.lastIndex;
    }
    fragmento.appendChild(document.createTextNode(adornar(base.slice(ultimo))));
    return fragmento;
  }

  /* Teclado en pantalla para escribir f(x) sin depender del teclado del equipo.
     Cada tecla: [etiqueta, texto que se inserta, caracteres a retroceder el
     cursor, nombre accesible, ancho en columnas]. Se inserta texto ASCII
     (+ - * / ^) aunque la etiqueta use × o ÷. */
  const TECLADO_FUNCION = [
    [{ titulo: "Números", columnas: 3, teclas: [
      ["7", "7"], ["8", "8"], ["9", "9"],
      ["4", "4"], ["5", "5"], ["6", "6"],
      ["1", "1"], ["2", "2"], ["3", "3"],
      ["0", "0", 0, "cero", 2], [".", ".", 0, "punto decimal"],
    ] }],
    [{ titulo: "Operaciones", columnas: 4, teclas: [
      ["+", "+", 0, "más"], ["−", "-", 0, "menos"], ["×", "*", 0, "por"], ["÷", "/", 0, "entre"],
      ["^", "^", 0, "potencia"], ["x²", "^2", 0, "al cuadrado"], ["(", "(", 0, "abrir paréntesis"], [")", ")", 0, "cerrar paréntesis"],
    ] }],
    [
      { titulo: "Variable y constantes", columnas: 3, teclas: [
        ["x", "x", 0, "equis"], ["π", "pi", 0, "pi"], ["e", "e", 0, "número e"],
      ] },
      { titulo: "Editar", columnas: 2, ancha: true, teclas: [
        ["←", "izquierda", 0, "mover el cursor a la izquierda"], ["→", "derecha", 0, "mover el cursor a la derecha"],
        ["Borrar", "borrar", 0, "borrar un carácter"], ["Limpiar", "limpiar", 0, "borrar toda la función"],
      ] },
    ],
    [{ titulo: "Funciones", columnas: 8, clase: "teclado-funciones", teclas: [
      ["√", "sqrt()", 1, "raíz cuadrada"], ["sin", "sin()", 1, "seno"], ["cos", "cos()", 1, "coseno"],
      ["tan", "tan()", 1, "tangente"], ["eˣ", "exp()", 1, "exponencial"], ["ln", "ln()", 1, "logaritmo natural"],
      ["log", "log()", 1, "logaritmo base 10"], ["|x|", "abs()", 1, "valor absoluto"],
    ] }],
  ];

  function vistaBiseccion(ejercicio) { return vistaRaices(ejercicio, "biseccion"); }
  function vistaFalsaPosicion(ejercicio) { return vistaRaices(ejercicio, "falsa_posicion"); }

  /* Formulario y resultado compartidos por los métodos de raíces (`tipo`: clave de METODOS_RAICES). */
  function vistaRaices(ejercicio, tipo) {
    const cfg = METODOS_RAICES[tipo];
    const panelResultado = el("div", { class: "resultado-panel" });
    const atributos = { type: "text", autocomplete: "off", autocapitalize: "off", autocorrect: "off", spellcheck: "false" };
    const entradaFuncion = el("input", { ...atributos, placeholder: "x^2 - 2", enterkeyhint: "go" });
    const entradaA = el("input", { ...atributos, placeholder: "1", enterkeyhint: "next" });
    const entradaB = el("input", { ...atributos, placeholder: "2", enterkeyhint: "next" });
    const entradaE = el("input", { ...atributos, value: "0.0001", enterkeyhint: "next" });
    const entradaIter = el("input", { ...atributos, value: "50", enterkeyhint: "go" });

    async function calcular() {
      const cuerpo = {
        funcion: entradaFuncion.value.trim(),
        a: entradaA.value.trim(),
        b: entradaB.value.trim(),
        tolerancia: entradaE.value.trim(),
        max_iter: entradaIter.value.trim(),
      };
      try {
        const resultado = await llamarApi(cfg.ruta, cuerpo);
        renderBiseccion(panelResultado, resultado);
      } catch (error) {
        mostrarError(error.message);
      }
    }

    const campo = (etiqueta, entrada, ayuda, ancho) => el("label", {
      class: "campo-vertical" + (ancho ? " campo-ancho" : ""),
    }, [
      el("span", { texto: etiqueta }), entrada,
      ayuda ? el("span", { class: "campo-ayuda", texto: ayuda }) : null,
    ]);

    for (const entrada of [entradaFuncion, entradaA, entradaB, entradaE, entradaIter]) {
      entrada.addEventListener("keydown", (ev) => { if (ev.key === "Enter") calcular(); });
    }

    const vistaPrevia = el("div", { class: "vista-previa-funcion", "aria-live": "polite" });

    function actualizarVistaPrevia() {
      vistaPrevia.innerHTML = "";
      const texto = entradaFuncion.value.trim();
      vistaPrevia.hidden = !texto;      // sin texto no hay nada que mostrar
      if (!texto) return;
      vistaPrevia.appendChild(el("span", { class: "vp-etiqueta", texto: "Se lee" }));
      vistaPrevia.appendChild(el("span", {}, [document.createTextNode("f(x) = "), formatearFuncion(texto)]));
    }

    function insertarSimbolo(texto, retroceso) {
      const valor = entradaFuncion.value;
      const inicio = entradaFuncion.selectionStart === null ? valor.length : entradaFuncion.selectionStart;
      const fin = entradaFuncion.selectionEnd === null ? valor.length : entradaFuncion.selectionEnd;
      entradaFuncion.value = valor.slice(0, inicio) + texto + valor.slice(fin);
      const posicion = inicio + texto.length - (retroceso || 0);
      entradaFuncion.focus();
      entradaFuncion.setSelectionRange(posicion, posicion);
      actualizarVistaPrevia();
    }

    entradaFuncion.addEventListener("input", actualizarVistaPrevia);

    /* Edición con los botones: mover el cursor, borrar un carácter o todo. */
    function editarFuncion(accion) {
      const valor = entradaFuncion.value;
      const inicio = entradaFuncion.selectionStart === null ? valor.length : entradaFuncion.selectionStart;
      const fin = entradaFuncion.selectionEnd === null ? valor.length : entradaFuncion.selectionEnd;
      let posicion = inicio;
      if (accion === "izquierda") posicion = inicio !== fin ? inicio : Math.max(0, inicio - 1);
      else if (accion === "derecha") posicion = inicio !== fin ? fin : Math.min(valor.length, fin + 1);
      else if (accion === "limpiar") { entradaFuncion.value = ""; posicion = 0; }
      else if (accion === "borrar") {
        if (inicio !== fin) {
          entradaFuncion.value = valor.slice(0, inicio) + valor.slice(fin);
        } else if (inicio > 0) {
          entradaFuncion.value = valor.slice(0, inicio - 1) + valor.slice(fin);
          posicion = inicio - 1;
        }
      }
      entradaFuncion.focus();
      entradaFuncion.setSelectionRange(posicion, posicion);
      actualizarVistaPrevia();
    }

    const ACCIONES_EDICION = new Set(["izquierda", "derecha", "borrar", "limpiar"]);
    const cuerpoTeclado = el("div", { class: "teclado-funcion", role: "group", "aria-label": "Teclado para escribir la función" },
      TECLADO_FUNCION.map((columna) => el("div", { class: "teclado-columna" }, columna.map((grupo) => el("div", {
        class: "teclado-grupo" + (grupo.clase ? " " + grupo.clase : ""),
      }, [
        el("div", { class: "teclado-grupo-titulo", texto: grupo.titulo }),
        el("div", {
          class: "teclado-teclas" + (grupo.ancha ? " teclado-teclas-anchas" : ""),
          style: `--columnas: ${grupo.columnas}`,
        }, grupo.teclas.map(([etiqueta, texto, retroceso, nombre, ancho]) => el("button", {
          type: "button",
          class: "chip" + (ancho === 2 ? " teclado-ancha" : ""),
          texto: etiqueta,
          "aria-label": ACCIONES_EDICION.has(texto) ? nombre : `Insertar ${nombre}`,
          onclick: () => (ACCIONES_EDICION.has(texto) ? editarFuncion(texto) : insertarSimbolo(texto, retroceso)),
        }))),
      ])))));
    const ICONO_CONSTRUCTOR =
      '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2.5"/>' +
      '<line x1="8" y1="6.5" x2="16" y2="6.5"/>' +
      '<line x1="8" y1="11" x2="8.01" y2="11"/><line x1="12" y1="11" x2="12.01" y2="11"/><line x1="16" y1="11" x2="16.01" y2="11"/>' +
      '<line x1="8" y1="15" x2="8.01" y2="15"/><line x1="12" y1="15" x2="12.01" y2="15"/><line x1="16" y1="15" x2="16.01" y2="15"/>' +
      '<line x1="8" y1="19" x2="8.01" y2="19"/><line x1="12" y1="19" x2="16" y2="19"/></svg>';
    const botonTeclado = crearSeccionDesplegable("Constructor de funciones", cuerpoTeclado, true, ICONO_CONSTRUCTOR);
    botonTeclado.classList.add("sd-compacta");

    const bloqueFuncion = el("div", { class: "bloque-funcion" }, [
      el("label", { class: "bloque-funcion-titulo", texto: "Función a resolver: f(x) = 0" }),
      el("div", { class: "entrada-funcion" }, [
        el("span", { class: "prefijo", texto: "f(x) =", "aria-hidden": "true" }),
        entradaFuncion,
      ]),
      vistaPrevia,
      botonTeclado,
      cuerpoTeclado,
    ]);
    entradaFuncion.setAttribute("aria-label", "Función f(x)");

    const formulario = el("div", { class: "biseccion-formulario" }, [
      bloqueFuncion,
      campo("Extremo a", entradaA),
      campo("Extremo b", entradaB),
      campo("Tolerancia E", entradaE, "Error relativo en fracción: 0.0001 = 0.01 %"),
      campo("Máx. iteraciones", entradaIter, "De 1 a 200"),
      el("button", { class: "btn", texto: cfg.boton, onclick: calcular }),
    ]);

    actualizarVistaPrevia();

    /* Ejercicio de práctica: carga los datos sin calcular. */
    if (ejercicio && ejercicio.datos) {
      const d = ejercicio.datos;
      entradaFuncion.value = d.funcion;
      entradaA.value = d.a;
      entradaB.value = d.b;
      entradaE.value = d.tolerancia;
      entradaIter.value = d.max_iter;
      actualizarVistaPrevia();
    }

    return el("div", {}, [
      el("div", { class: "titulo", texto: cfg.titulo }),
      formulario,
      panelResultado,
    ]);
  }

  /* ==========================================================
     VISTA: EJERCICIOS PARA PRÁCTICA
     ========================================================== */

  let catalogoEjercicios = null;

  async function obtenerCatalogoEjercicios() {
    if (catalogoEjercicios) return catalogoEjercicios;

    let respuesta;
    try {
      respuesta = await fetch("/api/ejercicios", { cache: "no-store" });
    } catch (error) {
      throw new Error(
        "No se pudo conectar con el servidor. ¿Está corriendo " +
        "'python server.py'?"
      );
    }

    let datos;
    try {
      datos = await respuesta.json();
    } catch (error) {
      throw new Error("El servidor devolvió una respuesta inválida.");
    }

    if (!respuesta.ok || datos.error) {
      throw new Error(datos.error || "No se pudieron cargar los ejercicios.");
    }

    catalogoEjercicios = datos;
    return datos;
  }

  function vistaEjercicios() {
    const contenido = el("div", {});
    const contenedor = el("div", { class: "inicio" }, [contenido]);

    /* Paso 1: pregunta y métodos como opciones. */
    async function mostrarEleccion() {
      contenido.innerHTML = "";
      contenido.appendChild(el("div", { class: "ejercicios-barra" }, [
        el("button", { class: "btn", texto: "← Inicio", onclick: () => mostrarVista(INICIO) }),
      ]));
      contenido.appendChild(el("div", { class: "titulo", texto: "Ejercicios para práctica" }));
      contenido.appendChild(el("p", {
        class: "inicio-subtitulo",
        texto: "¿Para qué método te gustaría tener ejercicios de ejemplo y práctica?",
      }));

      const cuadricula = el("div", { class: "inicio-cuadricula" });
      const estado = el("p", { class: "inicio-subtitulo", texto: "Cargando ejercicios..." });
      contenido.appendChild(estado);
      contenido.appendChild(cuadricula);

      let catalogo;
      try {
        catalogo = await obtenerCatalogoEjercicios();
      } catch (error) {
        estado.textContent = "No se pudieron cargar los ejercicios.";
        mostrarError(error.message);
        return;
      }

      estado.remove();
      for (const { clave, nombre } of catalogo.metodos) {
        const metodo = METODOS.find((m) => m.clave === clave);
        const cantidad = catalogo.ejercicios[clave].length;
        cuadricula.appendChild(el("button", {
          class: "inicio-tarjeta",
          type: "button",
          onclick: () => mostrarLista(clave, nombre),
        }, [
          el("span", { class: "inicio-icono", html: icono(metodo ? metodo.icono : "ejercicios", 22) }),
          el("span", { class: "inicio-nombre", texto: nombre }),
          el("span", { class: "inicio-descripcion", texto: `${cantidad} ejercicios` }),
        ]));
      }
    }

    /* Paso 2: lista de ejercicios del método elegido. */
    function mostrarLista(clave, nombre) {
      const metodo = METODOS.find((m) => m.clave === clave);
      const ejercicios = catalogoEjercicios.ejercicios[clave];

      contenido.innerHTML = "";
      contenido.appendChild(el("div", { class: "ejercicios-barra" }, [
        el("button", { class: "btn", texto: "← Elegir otro método", onclick: mostrarEleccion }),
      ]));
      contenido.appendChild(el("div", { class: "titulo", texto: `Ejercicios de ${nombre}` }));
      contenido.appendChild(el("p", {
        class: "inicio-subtitulo",
        texto: "Pulsa \"Probar ejercicio\" para cargar los datos en la calculadora.",
      }));

      const lista = el("div", { class: "ejercicios-lista" });
      for (const ejercicio of ejercicios) {
        const nivel = ejercicio.dificultad
          .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        lista.appendChild(el("div", { class: "ejercicio" }, [
          el("div", { class: "ejercicio-info" }, [
            el("div", { class: "ejercicio-cabecera" }, [
              el("span", { class: "ejercicio-titulo", texto: ejercicio.titulo }),
              el("span", { class: `dificultad dificultad-${nivel}`, texto: ejercicio.dificultad }),
            ]),
            el("p", { class: "ejercicio-descripcion", texto: ejercicio.descripcion }),
            el("pre", { class: "ejercicio-datos", texto: ejercicio.vista_previa }),
          ]),
          el("button", {
            class: "btn btn-grande",
            texto: "Probar ejercicio",
            onclick: () => mostrarVista(metodo, ejercicio),
          }),
        ]));
      }
      contenido.appendChild(lista);
    }

    mostrarEleccion();
    return contenedor;
  }

  /* ==========================================================
     VISTA: INICIO
     ========================================================== */

  function vistaInicio() {
    const crearTarjeta = (modulo) => el("button", {
      class: "inicio-tarjeta",
      type: "button",
      onclick: () => mostrarVista(modulo),
    }, [
      el("span", { class: "inicio-icono", html: icono(modulo.icono, 22) }),
      el("span", { class: "inicio-nombre", texto: modulo.tarjeta || modulo.nombre }),
      el("span", { class: "inicio-descripcion", texto: modulo.descripcion }),
    ]);

    return el("div", { class: "inicio" }, [
      el("div", { class: "titulo", texto: "Calculadora de Álgebra Lineal" }),
      el("p", {
        class: "inicio-subtitulo",
        texto: "Elige un método u operación para empezar.",
      }),
      el("div", { class: "inicio-cuadricula" }, METODOS.map(crearTarjeta)),
      el("div", { class: "inicio-separador" }),
      el("h2", { class: "inicio-seccion", texto: "Práctica" }),
      el("div", { class: "inicio-cuadricula" }, SECCIONES_EXTRA.map(crearTarjeta)),
    ]);
  }

  construirSidebar();
  mostrarVista(INICIO);
})();
</script>

<script>
/* ==========================================================
   FONDO DE PARTÍCULAS ASCII
   Los caracteres flotan en una ola lenta y constante. Cada clic (o toque)
   lanza un frente verde de forma irregular (distinto cada vez). Varios clics seguidos acumulan intensidad: el
   frente llega más lejos, más rápido y la ola se acelera un momento.
   Es solo decoración: no calcula nada. Los colores salen de --particula-*.
   ========================================================== */
(function () {
  "use strict";

  const canvas = document.getElementById("fondo-particulas");
  if (!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext("2d");

  const CARACTERES = "01abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ23456789+-=<>/\\|*#%&";
  const JUEGOS = [
    CARACTERES,
    "01",
    "0123456789",
    "0123456789ABCDEF",
    "+-=<>/\\|*#%&",
    "αβγδλμπσφψω∑∫√∞≈±"
  ];
  const TAM_CELDA_X = 9;       // ancho de celda (px CSS)
  const TAM_CELDA_Y = 15;      // alto de celda (px CSS)
  const NIVELES = 20;          // niveles de opacidad (se dibuja por lotes)
  const MAX_ONDAS = 8;
  const MAX_IMPULSO = 2.4;     // tope de intensidad acumulada
  const SUMA_IMPULSO = 0.55;   // lo que aporta cada clic
  const CAIDA_IMPULSO = 1.6;   // segundos que tarda en enfriarse la intensidad
  const VEL_NUBES = 26;        // px por segundo que avanzan las nubes (izquierda → derecha)
  const MS_CUADRO_REPOSO = 33; // ~30 fps en reposo, 60 fps con actividad

  const reducirMovimiento = window.matchMedia
    && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let ancho = 0, alto = 0, cols = 0, filas = 0;
  let letras = [];            // carácter actual de cada celda
  let semilla = null;         // valor fijo 0..1 por celda (quién aparece primero)
  let energia = null;         // brillo del frente verde por celda (0..1)
  let posX = null, posY = null; // posición con vaivén de cada celda visible
  let ondas = [];             // frentes activos
  let rgb = "90, 230, 140", opReposo = 0.13, opOnda = 0.7;
  let rafId = 0, ultimoCuadro = 0, ultimoDibujo = 0;

  // Estado de la ola ambiente.
  let desp = 0;                                 // desplazamiento horizontal acumulado (px, sin saltos)
  let impulso = 0;                              // intensidad por clics seguidos
  const faseA = Math.random() * 10, faseB = Math.random() * 10,
        faseC = Math.random() * 10, faseD = Math.random() * 10;

  function leerColores() {
    const css = getComputedStyle(document.documentElement);
    rgb = css.getPropertyValue("--particula-rgb").trim() || rgb;
    opReposo = parseFloat(css.getPropertyValue("--particula-reposo")) || opReposo;
    opOnda = parseFloat(css.getPropertyValue("--particula-onda")) || opOnda;
  }

  function letraAlAzar(juego) {
    const j = juego || CARACTERES;
    return j[Math.floor(Math.random() * j.length)];
  }

  function entre(a, b) { return a + Math.random() * (b - a); }

  function ajustarTamano() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ancho = window.innerWidth;
    alto = window.innerHeight;
    canvas.width = Math.round(ancho * dpr);
    canvas.height = Math.round(alto * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(ancho / TAM_CELDA_X);
    filas = Math.ceil(alto / TAM_CELDA_Y);
    const total = cols * filas;
    letras = new Array(total);
    semilla = new Float32Array(total);
    energia = new Float32Array(total);
    posX = new Float32Array(total);
    posY = new Float32Array(total);
    for (let i = 0; i < total; i++) { letras[i] = letraAlAzar(); semilla[i] = Math.random(); }
    dibujar();
  }

  /* Frente irregular: el radio depende del ángulo con armónicos propios de cada clic. */
  function deformacion(o, ang) {
    let m = 1 + 0.28 * o.sesgo * Math.cos(ang - o.dirSesgo);
    for (const h of o.armonicos) m += h.a * Math.sin(h.n * ang + h.f);
    return Math.max(0.3, m);
  }

  /* Cada clic sortea su propia forma, tamaño, ritmo, textura y juego de caracteres. */
  function sortearFrente(x, y, fuerza) {
    const armonicos = [];
    const cuantos = 2 + Math.floor(Math.random() * 3);          // 2 a 4
    let suma = 0;
    for (let k = 0; k < cuantos; k++) {
      const a = entre(0.05, 0.3);
      suma += a;
      armonicos.push({ n: 2 + Math.floor(Math.random() * 7), a: a, f: entre(0, 6.28) });
    }
    const sesgo = entre(-0.5, 1);
    const alcance = (240 + 560 * fuerza) * entre(0.7, 1.35);
    const velocidad = (200 + 140 * fuerza) * entre(0.75, 1.3);
    const grosor = (70 + 55 * fuerza) * entre(1.1, 2.4);
    const ruidoAmp = entre(0.3, 0.95);
    return {
      x: x, y: y, t0: performance.now(),
      alcance: alcance,
      grosor: grosor,
      dur: alcance / velocidad * 1.5 + 0.8,
      armonicos: armonicos,
      sesgo: sesgo,
      dirSesgo: Math.random() < 0.5 ? 0 : entre(0, 6.28),       // a favor de la ola o hacia cualquier lado
      mMax: 1 + suma + 0.28 * Math.abs(sesgo),
      ruidoAmp: ruidoAmp,
      kx: entre(0.008, 0.04), ky: entre(0.008, 0.04),
      sx: entre(1.3, 2.6),                                       // estirado a lo ancho, no una pelota
      f3: entre(0, 6.28), f4: entre(0, 6.28),
      perfil: entre(0.6, 1.6),                                   // borde suave o seco
      dens: entre(0.5, 1),                                      // frente denso o salpicado
      cambio: entre(0.25, 0.9),                                 // cuántos caracteres se revuelven
      juego: JUEGOS[Math.floor(Math.random() * JUEGOS.length)]
    };
  }

  function dibujar() {
    ctx.clearRect(0, 0, ancho, alto);
    ctx.font = "12px 'Courier New', monospace";
    ctx.textBaseline = "top";

    // Las cuatro ondas se desplazan solo en horizontal (cada una a un ritmo parecido,
    // para que las nubes se transformen un poco al pasar), nunca hacia arriba ni abajo.
    const d1 = desp, d2 = desp * 0.85, d3 = desp * 1.2, d4 = desp * 1.4;

    const lotes = [];
    for (let n = 0; n <= NIVELES; n++) lotes.push([]);

    for (let f = 0; f < filas; f++) {
      const y0 = f * TAM_CELDA_Y;
      for (let c = 0; c < cols; c++) {
        const i = f * cols + c;
        const x0 = c * TAM_CELDA_X;
        // Ondas largas en u y más cortas en v: manchas alargadas que se fusionan, como nubes.
        const w1 = Math.sin((x0 - d1) * 0.0045 + y0 * 0.004 + faseA);
        const w2 = Math.sin((x0 - d2) * 0.008 - y0 * 0.011 + faseB);
        const w3 = Math.sin((x0 - d3) * 0.003 + y0 * 0.016 + faseC);
        const w4 = Math.sin((x0 - d4) * 0.015 + y0 * 0.006 + faseD);
        const campo = (w1 + 0.8 * w2 + 0.7 * w3 + 0.3 * w4) / 2.8;
        const t = Math.min(1, Math.max(0, (campo + 0.05) / 0.55));
        const nube = t * t * (3 - 2 * t);                      // 0 fuera, 1 en el centro
        let a = nube > 0 && semilla[i] < 0.3 + 0.7 * nube
          ? (0.4 + 0.6 * nube) * (0.75 + 0.25 * w4) * opReposo : 0;
        const e = energia[i];
        if (e > 0) a = Math.max(a, e * opOnda);
        if (a < 0.015) continue;
        const nivel = Math.min(NIVELES, Math.round((a / opOnda) * NIVELES));
        if (nivel < 1) continue;
        lotes[nivel].push(i);
        // Vaivén suave: los caracteres "flotan" con la ola.
        posX[i] = x0 + 3.5 * w2 * (1 + impulso);
        posY[i] = y0 + 0.6 * w1 * (1 + impulso);
      }
    }

    for (let n = 1; n <= NIVELES; n++) {
      const lote = lotes[n];
      if (!lote.length) continue;
      ctx.fillStyle = "rgba(" + rgb + "," + ((n / NIVELES) * opOnda).toFixed(3) + ")";
      for (const i of lote) ctx.fillText(letras[i], posX[i], posY[i]);
    }
  }

  function actualizarFrentes(ahora, dt) {
    const caida = Math.pow(0.05, dt);
    for (let i = 0; i < energia.length; i++) {
      if (energia[i] > 0) {
        energia[i] *= caida;
        if (energia[i] < 0.01) energia[i] = 0;
      }
    }
    ondas = ondas.filter(o => (ahora - o.t0) / 1000 < o.dur);
    for (const o of ondas) {
      const tn = (ahora - o.t0) / 1000 / o.dur;            // 0..1
      const avance = 1 - Math.pow(1 - tn, 2);              // frena al final
      const radio = o.alcance * avance;
      const vida = Math.pow(1 - tn, 1.3);
      const grosor = o.grosor * (0.7 + 0.6 * avance);
      const rMax = (radio + 14) * o.mMax + grosor + 30;
      const rMaxX = rMax * o.sx;
      const c0 = Math.max(0, Math.floor((o.x - rMaxX) / TAM_CELDA_X));
      const c1 = Math.min(cols - 1, Math.ceil((o.x + rMaxX) / TAM_CELDA_X));
      const f0 = Math.max(0, Math.floor((o.y - rMax) / TAM_CELDA_Y));
      const f1 = Math.min(filas - 1, Math.ceil((o.y + rMax) / TAM_CELDA_Y));
      for (let f = f0; f <= f1; f++) {
        for (let c = c0; c <= c1; c++) {
          const x = (c + 0.5) * TAM_CELDA_X, y = (f + 0.5) * TAM_CELDA_Y;
          const dx = (x - o.x) / o.sx, dy = y - o.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          const m = deformacion(o, Math.atan2(dy, dx));
          // Ruido local: el borde se vuelve "rasgado", no un anillo perfecto.
          const ruido = o.ruidoAmp * grosor * Math.sin(x * o.kx + o.f3) * Math.sin(y * o.ky + o.f4);
          const dEf = d / m + ruido;
          if (dEf < radio - grosor || dEf > radio + 10) continue;
          const i = f * cols + c;
          if (semilla[i] > o.dens) continue;                // frente salpicado: celdas fijas se saltan
          const e = Math.pow(Math.min(1, (dEf - (radio - grosor)) / grosor * 1.15), o.perfil) * vida;
          if (e > energia[i]) {
            energia[i] = e;
            if (Math.random() < o.cambio) letras[i] = letraAlAzar(o.juego);
          }
        }
      }
    }
  }

  function actualizar(ahora, dt) {
    impulso *= Math.exp(-dt / CAIDA_IMPULSO);
    if (impulso < 0.01) impulso = 0;

    desp += dt * VEL_NUBES * (1 + impulso * 1.6);          // las nubes avanzan; más rápido con impulso

    // Algunos caracteres cambian solos, más con impulso.
    const cambios = Math.floor(letras.length * 0.0015 * (1 + impulso * 3)) + 1;
    for (let k = 0; k < cambios; k++) letras[Math.floor(Math.random() * letras.length)] = letraAlAzar();

    actualizarFrentes(ahora, dt);
  }

  function cuadro(ahora) {
    rafId = requestAnimationFrame(cuadro);
    const activo = ondas.length > 0 || impulso > 0;
    if (!activo && ahora - ultimoDibujo < MS_CUADRO_REPOSO) return;
    const dt = Math.min(0.05, (ahora - ultimoCuadro) / 1000 || 0.016);
    ultimoCuadro = ahora;
    ultimoDibujo = ahora;
    actualizar(ahora, dt);
    dibujar();
  }

  function iniciar() {
    if (rafId || reducirMovimiento || document.hidden) return;
    ultimoCuadro = performance.now();
    rafId = requestAnimationFrame(cuadro);
  }

  function detener() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  function lanzarOnda(x, y) {
    if (reducirMovimiento) return;
    leerColores();
    impulso = Math.min(MAX_IMPULSO, impulso + SUMA_IMPULSO);
    const fuerza = impulso;                                  // 0.55 un clic ... 2.4 muchos

    ondas.push(sortearFrente(x, y, fuerza));
    if (ondas.length > MAX_ONDAS) ondas.shift();
    iniciar();
  }

  /* Solo cuenta como "espacio vacío" el fondo: nada interactivo, ni texto, ni
     ningún elemento con fondo propio (tarjetas, tablas, sidebar, modales...). */
  const INTERACTIVOS = "button, a, input, select, textarea, label, summary, [role='button'], "
    + ".sidebar, .topbar, .drawer-overlay, .modal-overlay, .toast";

  function esEspacioVacio(el) {
    if (!el || el === document.documentElement || el === document.body || el === canvas) return true;
    if (el.closest(INTERACTIVOS)) return false;
    for (const nodo of el.childNodes) {
      if (nodo.nodeType === 3 && nodo.textContent.trim()) return false;   // texto
    }
    for (let n = el; n && n !== document.body; n = n.parentElement) {
      if (n.classList.contains("panel") || n.classList.contains("app")) break;
      const fondo = getComputedStyle(n).backgroundColor;
      if (fondo !== "transparent" && fondo !== "rgba(0, 0, 0, 0)") return false;
    }
    return true;
  }

  window.addEventListener("pointerdown", (ev) => {
    if (ev.button !== undefined && ev.button > 0) return;   // solo clic principal / toque
    if (!esEspacioVacio(ev.target)) return;
    lanzarOnda(ev.clientX, ev.clientY);
  }, { passive: true });

  let esperaRedimension = 0;
  window.addEventListener("resize", () => {
    clearTimeout(esperaRedimension);
    esperaRedimension = setTimeout(ajustarTamano, 150);
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) detener(); else iniciar();
  });

  // Cambio de tema: se vuelven a leer los colores y se redibuja.
  new MutationObserver(() => { leerColores(); dibujar(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  leerColores();
  ajustarTamano();
  iniciar();
})();
</script>
<script>
/* ==========================================================
   LETRAS QUE SALEN DE LAS TARJETAS
   Al pasar el ratón por una tarjeta del Inicio, unas letras ASCII (de otro
   color que el fondo) salen desde el punto por donde entró el cursor y se
   esparcen por el resto de la tarjeta: entrando por el centro se abren en
   todas direcciones; entrando por una esquina o un borde se reparten hacia
   el interior. Solo con ratón (el celular no tiene hover). Es decoración.
   Colores: --tarjeta-rgb y --tarjeta-opacidad.
   ========================================================== */
(function () {
  "use strict";

  const canvas = document.getElementById("efecto-tarjetas");
  if (!canvas || !canvas.getContext) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = canvas.getContext("2d");

  const SELECTOR = ".inicio-tarjeta";
  const CARACTERES = "01abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ23456789+-=<>/\\|*#%&";
  const RADIO_TARJETA = 14;     // igual que border-radius de .inicio-tarjeta
  const FRICCION = 2.2;         // 1/s: las letras frenan suavemente
  const MAX_PARTICULAS = 400;

  let rgb = "110, 200, 245", opacidad = 0.85;
  let particulas = [];          // {tarjeta, ox, oy, vx, vy, t, vida, car, tam, cambio}
  let rafId = 0, ultimo = 0;
  let dpr = 1;

  function entre(a, b) { return a + Math.random() * (b - a); }
  function letra() { return CARACTERES[Math.floor(Math.random() * CARACTERES.length)]; }

  function leerColores() {
    const css = getComputedStyle(document.documentElement);
    rgb = css.getPropertyValue("--tarjeta-rgb").trim() || rgb;
    opacidad = parseFloat(css.getPropertyValue("--tarjeta-opacidad")) || opacidad;
  }

  function ajustarTamano() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /* Reparte las letras desde (px, py) (relativo a la tarjeta) hacia el resto de la tarjeta. */
  function lanzar(tarjeta, px, py) {
    const r = tarjeta.getBoundingClientRect();
    const w = r.width, h = r.height;
    const cx = w / 2, cy = h / 2;
    const mediaDiag = Math.sqrt(cx * cx + cy * cy);
    const alCentro = Math.sqrt((cx - px) * (cx - px) + (cy - py) * (cy - py));
    // Esquina más lejana: hasta ahí deben poder llegar las letras.
    const lejos = Math.max(
      Math.hypot(px, py), Math.hypot(w - px, py), Math.hypot(px, h - py), Math.hypot(w - px, h - py));
    // Cerca del centro se abren en todas direcciones; en bordes y esquinas, hacia adentro.
    const apertura = Math.PI - (Math.PI - 1.15) * Math.min(1, alCentro / (0.6 * mediaDiag));
    const haciaCentro = Math.atan2(cy - py, cx - px);
    const cantidad = Math.min(36, Math.max(16, Math.round(w * h / 7500)));

    for (let k = 0; k < cantidad; k++) {
      const ang = alCentro < 4 ? entre(0, Math.PI * 2) : haciaCentro + entre(-apertura, apertura);
      const vida = entre(0.8, 1.4);
      const recorrido = lejos * entre(0.25, 1.0);                       // cuánto se aleja
      const v0 = recorrido * FRICCION / (1 - Math.exp(-FRICCION * vida));
      particulas.push({
        tarjeta: tarjeta,
        ox: px + entre(-6, 6), oy: py + entre(-6, 6),
        vx: Math.cos(ang) * v0, vy: Math.sin(ang) * v0,
        t: 0, vida: vida, car: letra(),
        tam: Math.random() < 0.15 ? 14 : 12,
        cambio: entre(0.06, 0.16)
      });
    }
    if (particulas.length > MAX_PARTICULAS) particulas.splice(0, particulas.length - MAX_PARTICULAS);
    if (!rafId) { ultimo = performance.now(); rafId = requestAnimationFrame(cuadro); }
  }

  /* Zonas donde las letras no deben pasar: el ícono y cada línea de texto de la tarjeta. */
  function zonasProtegidas(tarjeta) {
    const zonas = [];
    const margen = 3;
    for (const el of tarjeta.querySelectorAll(".inicio-icono, .inicio-nombre, .inicio-descripcion")) {
      let rects;
      if (el.classList.contains("inicio-icono")) {
        rects = [el.getBoundingClientRect()];
      } else {
        const rango = document.createRange();
        rango.selectNodeContents(el);
        rects = rango.getClientRects();                       // una por línea de texto
      }
      for (const z of rects) {
        if (z.width < 1 || z.height < 1) continue;
        zonas.push([z.left - margen, z.top - margen, z.width + 2 * margen, z.height + 2 * margen]);
      }
    }
    return zonas;
  }

  /* Recorta a la tarjeta, dejando huecos en el ícono y el texto (regla par-impar). */
  function recortar(r, zonas) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(r.left, r.top, r.width, r.height, RADIO_TARJETA);
    else ctx.rect(r.left, r.top, r.width, r.height);
    for (const z of zonas) ctx.rect(z[0], z[1], z[2], z[3]);
    ctx.clip("evenodd");
  }

  function cuadro(ahora) {
    rafId = 0;
    const dt = Math.min(0.05, (ahora - ultimo) / 1000 || 0.016);
    ultimo = ahora;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    // Se agrupan por tarjeta: cada una se dibuja recortada a su propio rectángulo.
    const porTarjeta = new Map();
    for (const p of particulas) {
      p.t += dt;
      p.ox += p.vx * dt;
      p.oy += p.vy * dt;
      const f = Math.exp(-FRICCION * dt);
      p.vx *= f; p.vy *= f;
      p.cambio -= dt;
      if (p.cambio <= 0) { p.car = letra(); p.cambio = entre(0.08, 0.2); }
      if (p.t < p.vida) {
        if (!porTarjeta.has(p.tarjeta)) porTarjeta.set(p.tarjeta, []);
        porTarjeta.get(p.tarjeta).push(p);
      }
    }
    particulas = particulas.filter(p => p.t < p.vida);

    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    for (const [tarjeta, lista] of porTarjeta) {
      const r = tarjeta.getBoundingClientRect();
      ctx.save();
      recortar(r, zonasProtegidas(tarjeta));
      for (const p of lista) {
        const vida = p.t / p.vida;
        const alfa = opacidad * Math.min(1, p.t / 0.08) * Math.pow(1 - vida, 1.4);
        ctx.font = p.tam + "px 'Courier New', monospace";
        ctx.fillStyle = "rgba(" + rgb + "," + alfa.toFixed(3) + ")";
        ctx.fillText(p.car, r.left + p.ox, r.top + p.oy);
      }
      ctx.restore();
    }
    if (particulas.length) rafId = requestAnimationFrame(cuadro);
  }

  // pointerover burbujea; solo cuenta cuando el cursor entra desde fuera de la tarjeta.
  document.addEventListener("pointerover", (ev) => {
    if (ev.pointerType === "touch") return;
    const tarjeta = ev.target.closest && ev.target.closest(SELECTOR);
    if (!tarjeta || tarjeta.contains(ev.relatedTarget)) return;
    const r = tarjeta.getBoundingClientRect();
    lanzar(tarjeta, ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: true });

  let esperaRedimension = 0;
  window.addEventListener("resize", () => {
    clearTimeout(esperaRedimension);
    esperaRedimension = setTimeout(ajustarTamano, 150);
  });

  new MutationObserver(leerColores)
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  leerColores();
  ajustarTamano();
})();
</script>
</body>
