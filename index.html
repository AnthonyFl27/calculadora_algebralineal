<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='2' width='22' height='28' rx='4' fill='%231abc9c'/><rect x='9' y='6' width='14' height='6' rx='1.5' fill='%23fff'/><g fill='%23fff'><circle cx='11' cy='17' r='1.8'/><circle cx='16' cy='17' r='1.8'/><circle cx='21' cy='17' r='1.8'/><circle cx='11' cy='22' r='1.8'/><circle cx='16' cy='22' r='1.8'/><circle cx='21' cy='22' r='1.8'/><circle cx='11' cy='26.2' r='1.8'/><circle cx='16' cy='26.2' r='1.8'/><circle cx='21' cy='26.2' r='1.8'/></g></svg>">
<script>
/* Aplica el tema antes de pintar (evita el parpadeo del tema claro). */
(function () {
  var tema = null;
  try { tema = localStorage.getItem("tema-calculadora"); } catch (e) {}
  if (tema !== "dark" && tema !== "light") {
    tema = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", tema);
})();
</script>
<style>
  :root {
    color-scheme: light;
    --color-fondo: #f5f5f5;
    --color-sidebar: #2c3e50;
    --color-boton: #34495e;
    --color-boton-act: #1abc9c;
    --color-texto-sb: #ffffff;
    --color-exito: #1abc9c;
    --color-alerta: #f39c12;
    --color-error: #e74c3c;
    --color-neutro: #7f8c8d;
    --color-borde: #d8dde0;

    --texto: #1c1c1c;
    --texto-titulo: #2c3e50;
    --texto-acento: #34495e;
    --texto-suave-1: #55636b;
    --texto-suave-2: #5b6b73;
    --texto-suave-3: #6b7a82;
    --texto-tenue: #8a979d;
    --texto-sb-suave: #cfd8dc;

    --superficie: #ffffff;
    --superficie-2: #fafbfb;
    --superficie-3: #fbfcfc;
    --input-fondo: #ffffff;
    --borde-input: #b7b7b7;
    --borde-tab: #c9c9c9;
    --tab-fondo: #e6e6e6;
    --linea-tabla: #eef0f1;
    --linea-fila: #f0f2f3;
    --chip-fondo: #eef2f3;
    --desact-fondo: #b0b0b0;
    --desact-texto: #9e9e9e;
    --punto: #d3d9db;
    --punto-hover: #aab4b8;

    --pivote-fondo: rgba(26, 188, 156, 0.16);
    --pivote-fondo-fuerte: rgba(26, 188, 156, 0.22);
    --pivote-texto: #0e8c73;
    --fila-resaltada: rgba(52, 73, 94, 0.05);
    --exito-texto: #117a65;
    --exito-fondo: rgba(26, 188, 156, 0.15);
    --exito-fondo-suave: rgba(26, 188, 156, 0.12);
    --alerta-fondo: rgba(243, 156, 18, 0.15);
    --alerta-texto: #b9770e;
    --error-fondo: rgba(231, 76, 60, 0.15);
    --error-fondo-suave: rgba(231, 76, 60, 0.06);
    --error-texto: #c0392b;

    --op-inter-fondo: #fdebd0;
    --op-inter-texto: #935116;
    --op-norm-fondo: #d6f3ec;
    --op-elim-fondo: #e3e9ea;

    --sidebar-separador: rgba(255, 255, 255, 0.18);
    --overlay: rgba(0, 0, 0, 0.35);
    --sombra: rgba(0, 0, 0, 0.3);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --color-fondo: #1a1f24;
    --color-sidebar: #11161a;
    --color-boton: #2f3b46;
    --color-boton-act: #0f7f6b;
    --color-texto-sb: #ffffff;
    --color-exito: #1abc9c;
    --color-alerta: #f39c12;
    --color-error: #e74c3c;
    --color-neutro: #8c9aa4;
    --color-borde: #3a444d;

    --texto: #e6eaed;
    --texto-titulo: #d5dde3;
    --texto-acento: #b9c6d0;
    --texto-suave-1: #9fadb6;
    --texto-suave-2: #a3b1ba;
    --texto-suave-3: #9aa8b1;
    --texto-tenue: #a0adb7;
    --texto-sb-suave: #9fb0ba;

    --superficie: #242b31;
    --superficie-2: #2b343b;
    --superficie-3: #20272d;
    --input-fondo: #2b343b;
    --borde-input: #4a5660;
    --borde-tab: #3a444d;
    --tab-fondo: #1f262c;
    --linea-tabla: #313b43;
    --linea-fila: #2f3941;
    --chip-fondo: #33404a;
    --desact-fondo: #3a444d;
    --desact-texto: #8c969e;
    --punto: #45515b;
    --punto-hover: #62717d;

    --pivote-fondo: rgba(26, 188, 156, 0.26);
    --pivote-fondo-fuerte: rgba(26, 188, 156, 0.34);
    --pivote-texto: #7ee8d3;
    --fila-resaltada: rgba(255, 255, 255, 0.05);
    --exito-texto: #4fd8bd;
    --exito-fondo: rgba(26, 188, 156, 0.22);
    --exito-fondo-suave: rgba(26, 188, 156, 0.18);
    --alerta-fondo: rgba(243, 156, 18, 0.22);
    --alerta-texto: #f0b45a;
    --error-fondo: rgba(231, 76, 60, 0.24);
    --error-fondo-suave: rgba(231, 76, 60, 0.12);
    --error-texto: #f1867a;

    --op-inter-fondo: #4a3a20;
    --op-inter-texto: #f5b971;
    --op-norm-fondo: #1f4a43;
    --op-elim-fondo: #37424b;

    --sidebar-separador: rgba(255, 255, 255, 0.14);
    --overlay: rgba(0, 0, 0, 0.6);
    --sombra: rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--color-fondo);
    font-family: Arial, Helvetica, sans-serif;
    color: var(--texto);
  }

  .app {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- SIDEBAR ---------- */

  .sidebar {
    width: 210px;
    flex-shrink: 0;
    background: var(--color-sidebar);
    color: var(--color-texto-sb);
    display: flex;
    flex-direction: column;
    padding: 16px 10px;
    gap: 6px;
  }

  .sidebar-cabecera {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 14px 6px;
  }

  .sidebar h1 {
    font-size: 15px;
    font-weight: bold;
    margin: 0;
  }

  .btn-colapsar {
    background: transparent;
    color: var(--color-texto-sb);
    border: none;
    border-radius: 8px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }

  .btn-colapsar:hover { background: var(--color-boton); }

  /* Sidebar replegado: solo queda visible el botón para desplegarlo. */
  .sidebar.colapsado { width: 56px; padding: 16px 0; align-items: center; }
  .sidebar.colapsado .sidebar-cabecera { margin: 0; justify-content: center; }
  .sidebar.colapsado h1,
  .sidebar.colapsado > :not(.sidebar-cabecera):not(.estado-servidor) { display: none; }
  /* Replegado solo se ve el punto de estado (verde/rojo), al pie. */
  .sidebar.colapsado .estado-servidor { margin-top: auto; padding: 8px 0 4px; }
  .sidebar.colapsado .estado-servidor span { display: none; }

  .nav-btn {
    background: var(--color-boton);
    color: var(--color-texto-sb);
    border: none;
    border-radius: 12px;
    padding: 11px 12px;
    text-align: left;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .nav-btn { display: flex; align-items: center; gap: 10px; }
  .sidebar-separador {
    height: 1px;
    background: var(--sidebar-separador);
    margin: 6px 6px;
    flex-shrink: 0;
  }

  .nav-icono { display: flex; flex-shrink: 0; }

  .nav-btn:hover { background: var(--color-boton-act); }
  .nav-btn.active { background: var(--color-boton-act); font-weight: bold; }

  .btn-tema {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .estado-servidor {
    margin-top: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--texto-sb-suave);
    padding: 8px 6px 2px;
  }

  .estado-punto {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--color-neutro);
    flex-shrink: 0;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }

  .estado-punto.conectado {
    background: var(--color-exito);
    box-shadow: 0 0 5px var(--color-exito);
  }

  .estado-punto.desconectado {
    background: var(--color-error);
    box-shadow: 0 0 5px var(--color-error);
  }

  /* ---------- PANEL PRINCIPAL ---------- */

  .panel {
    flex: 1;
    padding: 10px 24px 30px;
    overflow-y: auto;
  }

  /* ---------- INICIO ---------- */

  .inicio { max-width: 820px; margin: 0 auto; }

  .inicio-subtitulo {
    text-align: center;
    color: var(--texto-suave-1);
    margin: -6px 0 26px;
    font-size: 14px;
  }

  .inicio-cuadricula {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }

  .inicio-tarjeta {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    text-align: left;
    font: inherit;
    color: var(--texto);
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 14px;
    padding: 18px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }

  .inicio-tarjeta:hover {
    border-color: var(--color-exito);
    transform: translateY(-2px);
    box-shadow: 0 4px 14px var(--sombra);
  }

  .inicio-tarjeta:focus-visible {
    outline: 2px solid var(--color-exito);
    outline-offset: 2px;
  }

  .inicio-icono {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--exito-fondo);
    color: var(--exito-texto);
  }

  .inicio-nombre { font-size: 16px; font-weight: bold; color: var(--texto-titulo); }
  .inicio-descripcion { font-size: 13px; line-height: 1.45; color: var(--texto-suave-1); }

  .titulo {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    margin: 14px 0;
  }

  .controles {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 8px 0;
  }

  .controles label {
    font-size: 13px;
  }

  input[type="text"], input[type="number"], select {
    font-family: inherit;
    font-size: 13px;
    padding: 5px 7px;
    border: 1px solid var(--borde-input);
    border-radius: 4px;
    text-align: center;
    background: var(--input-fondo);
    color: var(--texto);
  }

  .btn {
    background: var(--color-boton);
    color: var(--color-texto-sb);
    border: none;
    border-radius: 12px;
    padding: 9px 18px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn:hover:not(:disabled) { background: var(--color-boton-act); }

  .btn:disabled {
    background: var(--desact-fondo);
    color: var(--desact-texto);
    cursor: default;
  }

  .btn-grande {
    font-size: 14px;
    font-weight: bold;
    padding: 10px 22px;
  }

  .botones {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 12px 0;
  }

  .formato {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin: 8px 0;
    font-size: 13px;
  }

  .formato label {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  /* ---------- MATRIZ (formularios de entrada) ---------- */

  .marco-matriz {
    display: flex;
    justify-content: center;
    margin: 16px 0;
    overflow-x: auto;
  }

  .grid-matriz {
    display: grid;
    gap: 6px;
    align-items: center;
    justify-items: center;
  }

  .grid-matriz .encabezado {
    font-size: 12px;
    font-weight: normal;
  }

  .grid-matriz .separador {
    font-size: 15px;
    font-weight: bold;
    padding: 0 4px;
  }

  .grid-matriz input {
    width: 62px;
  }

  .marco-tabla {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 4px 12px;
  }

  .marco-tabla .titulo-tabla {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
  }

  .tabla-genérica {
    display: grid;
    gap: 4px;
  }

  .tabla-genérica input { width: 56px; }

  .grupo-tablas {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 10px;
    margin: 10px 0;
  }

  .grupo-vectores {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 12px 0;
    flex-wrap: wrap;
  }

  .columna-vector {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .columna-vector .titulo-tabla {
    font-size: 13px;
    font-weight: bold;
  }

  .columna-vector input { width: 68px; }

  /* ---------- PESTAÑAS (Vectores y matrices) ---------- */

  .tabs {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin: 10px 0 0;
  }

  .tab-btn {
    padding: 8px 20px;
    border: 1px solid var(--borde-tab);
    border-bottom: none;
    background: var(--tab-fondo);
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    font-size: 13px;
    color: var(--texto);
  }

  .tab-btn.active {
    background: var(--superficie);
    font-weight: bold;
  }

  .tab-panel {
    border: 1px solid var(--borde-tab);
    border-radius: 0 4px 4px 4px;
    background: var(--superficie);
    padding: 12px;
    max-width: 960px;
    margin: 0 auto;
  }

  .tab-contenido { display: none; }
  .tab-contenido.activa { display: block; }

  /* ---------- PANEL DE RESULTADOS (interactivo) ---------- */

  .resultado-panel {
    max-width: 960px;
    margin: 14px auto 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .bloque-titulo {
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--texto-suave-1);
    margin: 18px 2px 8px;
    padding-left: 8px;
    border-left: 3px solid var(--color-boton-act);
  }

  .planteamiento {
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    margin-bottom: 4px;
  }

  .nota-sin-pasos {
    background: var(--superficie);
    border: 1px dashed var(--color-borde);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--texto-suave-2);
    margin: 4px 0;
  }

  /* ---------- TABLA DE MATRIZ (resultado) ---------- */

  .tabla-matriz-envoltorio {
    overflow-x: auto;
    margin: 4px 0 10px;
  }

  table.tabla-matriz {
    border-collapse: collapse;
    margin: 0 auto;
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 6px;
    overflow: hidden;
    animation: apareceSuave 0.25s ease;
  }

  table.tabla-matriz th, table.tabla-matriz td {
    padding: 7px 12px;
    text-align: center;
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    border-bottom: 1px solid var(--linea-tabla);
  }

  table.tabla-matriz th {
    font-family: Arial, sans-serif;
    font-size: 11px;
    color: var(--texto-suave-3);
    background: var(--superficie-2);
    font-weight: normal;
  }

  table.tabla-matriz tr:last-child td { border-bottom: none; }

  table.tabla-matriz .col-separador {
    border-left: 2px solid var(--color-boton-act);
  }

  table.tabla-matriz .celda-pivote {
    background: var(--pivote-fondo);
    font-weight: bold;
    color: var(--pivote-texto);
    position: relative;
  }

  table.tabla-matriz tr.fila-resaltada td {
    background: var(--fila-resaltada);
  }

  table.tabla-matriz tr.fila-resaltada td.celda-pivote {
    background: var(--pivote-fondo-fuerte);
  }

  /* ---------- STEPPER DE PASOS ---------- */

  .stepper {
    background: var(--superficie-3);
    border: 1px solid var(--color-borde);
    border-radius: 10px;
    padding: 14px;
    margin: 4px 0 12px;
  }

  .stepper-cabecera {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
    margin-bottom: 10px;
  }

  .stepper-punto {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: none;
    background: var(--punto);
    cursor: pointer;
    padding: 0;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .stepper-punto:hover { background: var(--punto-hover); }
  .stepper-punto.activo { background: var(--color-boton-act); transform: scale(1.3); }

  .stepper-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 10px;
  }

  .btn-paso {
    padding: 7px 16px;
  }

  .stepper-contador {
    font-size: 12px;
    color: var(--texto-suave-2);
    min-width: 48px;
    text-align: center;
  }

  /* ---------- TARJETA DE PASO (Gauss-Jordan / Pivoteo) ---------- */

  .paso-tarjeta {
    animation: apareceSuave 0.25s ease;
  }

  .paso-encabezado {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .paso-numero {
    font-size: 11px;
    color: var(--texto-tenue);
    font-weight: bold;
    text-transform: uppercase;
  }

  .paso-operacion {
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 6px;
    background: var(--chip-fondo);
    color: var(--texto-titulo);
  }

  .paso-operacion.tipo-intercambio { background: var(--op-inter-fondo); color: var(--op-inter-texto); }
  .paso-operacion.tipo-normalizar { background: var(--op-norm-fondo); color: var(--exito-texto); }
  .paso-operacion.tipo-eliminar { background: var(--op-elim-fondo); color: var(--texto-acento); }

  .paso-descripcion {
    font-size: 11px;
    color: var(--texto-tenue);
    margin-bottom: 8px;
  }

  /* ---------- LISTA COMPACTA DE PASOS (vectores/matrices) ---------- */

  .lista-pasos {
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 10px;
    overflow: hidden;
    margin: 4px 0 10px;
  }

  .fila-paso {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--linea-fila);
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    animation: aparecerDesdeIzquierda 0.3s ease both;
  }

  .fila-paso:last-child { border-bottom: none; }
  .fila-paso:hover { background: var(--superficie-2); }

  .fila-paso .paso-etiqueta {
    color: var(--texto-tenue);
    font-family: Arial, sans-serif;
    font-size: 11px;
    white-space: nowrap;
  }

  .fila-paso .paso-expresion { font-weight: bold; color: var(--texto-titulo); }

  /* ---------- TARJETAS DE VEREDICTO/RESULTADO ---------- */

  .tarjeta {
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 10px;
    padding: 14px 18px;
    margin: 6px 0 14px;
    animation: apareceSuave 0.3s ease;
    border-left: 5px solid var(--color-neutro);
  }

  .tarjeta.tipo-unica { border-left-color: var(--color-exito); }
  .tarjeta.tipo-infinitas { border-left-color: var(--color-alerta); }
  .tarjeta.tipo-incompatible { border-left-color: var(--color-error); }
  .tarjeta.tipo-neutro { border-left-color: var(--color-neutro); }

  .tarjeta-encabezado {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }

  .tarjeta-icono {
    font-size: 20px;
    font-weight: bold;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--chip-fondo);
    color: var(--color-neutro);
    flex-shrink: 0;
  }

  .tipo-unica .tarjeta-icono { background: var(--exito-fondo); color: var(--color-exito); }
  .tipo-infinitas .tarjeta-icono { background: var(--alerta-fondo); color: var(--color-alerta); }
  .tipo-incompatible .tarjeta-icono { background: var(--error-fondo); color: var(--color-error); }

  .tarjeta-titulo {
    font-size: 15px;
    font-weight: bold;
  }

  .tarjeta-detalle {
    font-size: 12px;
    color: var(--texto-suave-3);
  }

  .tarjeta-cuerpo-mono {
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    margin: 10px 0 0;
    line-height: 1.5;
  }

  .lista-escalares {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .chip-escalar {
    background: var(--exito-fondo-suave);
    color: var(--pivote-texto);
    border-radius: 999px;
    padding: 5px 14px;
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    font-weight: bold;
  }

  .resultado-vector {
    font-family: "Courier New", Courier, monospace;
    font-size: 15px;
    font-weight: bold;
    background: var(--superficie);
    border: 1px solid var(--color-borde);
    border-radius: 8px;
    padding: 10px 16px;
    text-align: center;
    color: var(--exito-texto);
  }

  /* ---------- COMPROBACIÓN: ecuación A · X = B y verificación por fila ---------- */

  .ecuacion-comprobacion {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
    margin: 6px 0 14px;
  }

  .matriz-etiquetada {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .matriz-etiquetada .tabla-matriz-envoltorio { margin: 0; }

  .matriz-etiqueta {
    font-size: 11px;
    font-weight: bold;
    font-style: italic;
    color: var(--texto-tenue);
  }

  .simbolo-ecuacion {
    font-size: 22px;
    font-weight: bold;
    color: var(--color-boton-act);
  }

  .fila-comprobacion {
    justify-content: space-between;
    align-items: center;
  }

  .fila-comprobacion.fallo { background: var(--error-fondo-suave); }

  .badge-comprobacion {
    font-weight: bold;
    font-size: 14px;
    flex-shrink: 0;
  }

  .badge-comprobacion.ok { color: var(--color-exito); }
  .badge-comprobacion.fallo { color: var(--color-error); }

  /* ---------- CONVERSIÓN DE BASES: tarjetas de paso ---------- */

  .paso-conversion {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
  }

  .division-visual, .termino-visual {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "Courier New", Courier, monospace;
    font-size: 20px;
    font-weight: bold;
    color: var(--texto-titulo);
  }

  .division-operador, .division-igual, .termino-igual {
    color: var(--color-boton-act);
  }

  .division-cociente, .termino-resultado {
    color: var(--exito-texto);
  }

  .division-residuo {
    font-size: 13px;
    color: var(--texto-suave-3);
  }

  .resultado-conversion-numero {
    font-family: "Courier New", Courier, monospace;
    font-size: 17px;
    font-weight: bold;
    text-align: center;
    margin-top: 10px;
    color: var(--exito-texto);
  }

  /* ---------- ACORDEÓN (ecuación matricial, columnas de B) ---------- */

  .accordion {
    border: 1px solid var(--color-borde);
    border-radius: 8px;
    margin: 6px 0;
    overflow: hidden;
  }

  .accordion-encabezado {
    width: 100%;
    text-align: left;
    background: var(--superficie-2);
    border: none;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    color: var(--texto-acento);
    position: relative;
  }

  .accordion-encabezado::after {
    content: "+";
    position: absolute;
    right: 14px;
    color: var(--color-boton-act);
    font-weight: bold;
  }

  .accordion-encabezado.abierto::after { content: "−"; }

  .accordion-body {
    padding: 10px 14px 4px;
  }

  /* ---------- MODAL (equivalente a messagebox) ---------- */

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .modal-box {
    background: var(--superficie);
    border-radius: 8px;
    padding: 20px 24px;
    min-width: 280px;
    max-width: 440px;
    box-shadow: 0 8px 24px var(--sombra);
    animation: apareceSuave 0.2s ease;
  }

  .modal-box h2 {
    margin: 0 0 10px;
    font-size: 16px;
  }

  .modal-box h2.error { color: var(--error-texto); }
  .modal-box h2.aviso { color: var(--alerta-texto); }

  .modal-box p {
    margin: 0 0 18px;
    font-size: 13px;
    white-space: pre-wrap;
    line-height: 1.4;
  }

  .modal-box .btn {
    display: block;
    margin-left: auto;
  }

  /* ---------- ANIMACIONES ---------- */

  @keyframes apareceSuave {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes aparecerDesdeIzquierda {
    from { opacity: 0; transform: translateX(-6px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @media (max-width: 720px) {
    .sidebar { width: 150px; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-cabecera">
      <h1>Calculadora</h1>
      <!-- Botón de replegar/desplegar insertado por JS -->
    </div>
    <!-- Botones de navegación insertados por JS -->
  </nav>

  <main class="panel" id="panel">
    <!-- Vista actual insertada por JS -->
  </main>
</div>

<div id="modal-root"></div>

<script>
(function () {
  "use strict";

  /* ==========================================================
     UTILIDADES GENERALES
     ========================================================== */

  function el(tag, atributos, hijos) {
    const nodo = document.createElement(tag);
    if (atributos) {
      for (const [clave, valor] of Object.entries(atributos)) {
        if (valor === null || valor === undefined || valor === false) continue;
        if (clave === "texto") nodo.textContent = valor;
        else if (clave === "html") nodo.innerHTML = valor;
        else if (clave.startsWith("on") && typeof valor === "function") {
          nodo.addEventListener(clave.slice(2), valor);
        } else {
          nodo.setAttribute(clave, valor);
        }
      }
    }
    if (hijos) {
      for (const hijo of hijos) {
        if (hijo) nodo.appendChild(hijo);
      }
    }
    return nodo;
  }

  function mostrarModal(titulo, mensaje, claseTitulo) {
    const raiz = document.getElementById("modal-root");
    raiz.innerHTML = "";

    const cerrar = () => { raiz.innerHTML = ""; };

    const caja = el("div", { class: "modal-box" }, [
      el("h2", { texto: titulo, class: claseTitulo || "error" }),
      el("p", { texto: mensaje }),
      el("button", { class: "btn", texto: "Aceptar", onclick: cerrar }),
    ]);

    const overlay = el("div", { class: "modal-overlay", onclick: (e) => {
      if (e.target === overlay) cerrar();
    } }, [caja]);

    raiz.appendChild(overlay);
  }

  function mostrarError(mensaje) {
    mostrarModal("Error", mensaje, "error");
  }

  function mostrarAviso(mensaje) {
    mostrarModal("Aviso", mensaje, "aviso");
  }

  async function llamarApi(ruta, cuerpo) {
    let respuesta;
    try {
      respuesta = await fetch(ruta, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cuerpo),
      });
    } catch (error) {
      throw new Error(
        "No se pudo conectar con el servidor. ¿Está corriendo " +
        "'python server.py'?"
      );
    }

    let datos;
    try {
      datos = await respuesta.json();
    } catch (error) {
      throw new Error("El servidor devolvió una respuesta inválida.");
    }

    if (!respuesta.ok || datos.error) {
      throw new Error(datos.error || "Ocurrió un error en el servidor.");
    }

    return datos;
  }

  function enteroPositivo(valorTexto, nombre) {
    const valor = parseInt(valorTexto, 10);
    if (Number.isNaN(valor) || valor < 1 || String(valor) !== String(valorTexto).trim()) {
      throw new Error(`${nombre} debe ser un entero mayor que cero.`);
    }
    return valor;
  }

  /* ==========================================================
     COMPONENTES DE PRESENTACIÓN COMPARTIDOS
     (tabla de matriz, stepper de pasos, tarjetas de veredicto)
     ========================================================== */

  function crearTablaMatriz(filas, opciones) {
    const { encabezados, separadorAntesDe, pivote, pivotes, filasResaltadas } = opciones || {};
    const tabla = el("table", { class: "tabla-matriz" });

    if (encabezados) {
      const filaEnc = el("tr");
      encabezados.forEach((texto, j) => {
        filaEnc.appendChild(el("th", {
          texto,
          class: j === separadorAntesDe ? "col-separador" : "",
        }));
      });
      tabla.appendChild(el("thead", {}, [filaEnc]));
    }

    const tbody = el("tbody");
    filas.forEach((fila, i) => {
      const tr = el("tr", {
        class: filasResaltadas && filasResaltadas.has(i) ? "fila-resaltada" : "",
      });
      fila.forEach((celda, j) => {
        const esPivote = (pivote && pivote.fila === i && pivote.columna === j)
          || (pivotes && pivotes.some((p) => p.fila === i && p.columna === j));
        const clases = [];
        if (j === separadorAntesDe) clases.push("col-separador");
        if (esPivote) clases.push("celda-pivote");
        tr.appendChild(el("td", { texto: celda, class: clases.join(" ") }));
      });
      tbody.appendChild(tr);
    });
    tabla.appendChild(tbody);

    return el("div", { class: "tabla-matriz-envoltorio" }, [tabla]);
  }

  function crearStepperGenerico(pasos, renderizarPaso) {
    let indice = 0;
    const cabecera = el("div", { class: "stepper-cabecera" });
    const cuerpo = el("div", { class: "stepper-cuerpo" });
    const contador = el("span", { class: "stepper-contador" });
    const btnAnterior = el("button", { class: "btn btn-paso", texto: "‹ Anterior" });
    const btnSiguiente = el("button", { class: "btn btn-paso", texto: "Siguiente ›" });

    function render() {
      cuerpo.innerHTML = "";
      cuerpo.appendChild(renderizarPaso(pasos[indice], indice, pasos.length));

      contador.textContent = `${indice + 1} / ${pasos.length}`;
      btnAnterior.disabled = indice === 0;
      btnSiguiente.disabled = indice === pasos.length - 1;

      cabecera.innerHTML = "";
      pasos.forEach((_, i) => {
        cabecera.appendChild(el("button", {
          class: `stepper-punto${i === indice ? " activo" : ""}`,
          title: `Paso ${i + 1}`,
          onclick: () => { indice = i; render(); },
        }));
      });
    }

    btnAnterior.addEventListener("click", () => { if (indice > 0) { indice--; render(); } });
    btnSiguiente.addEventListener("click", () => { if (indice < pasos.length - 1) { indice++; render(); } });

    render();

    const nav = el("div", { class: "stepper-nav" }, [btnAnterior, contador, btnSiguiente]);
    return el("div", { class: "stepper" }, [cabecera, cuerpo, nav]);
  }

  function crearListaPasos(pasos, renderizarFila) {
    return el("div", { class: "lista-pasos" }, pasos.map(renderizarFila));
  }

  function crearAccordion(titulo, cuerpo, abierto) {
    const encabezado = el("button", {
      class: `accordion-encabezado${abierto ? " abierto" : ""}`,
      texto: titulo,
    });
    cuerpo.style.display = abierto ? "block" : "none";
    encabezado.addEventListener("click", () => {
      const visible = cuerpo.style.display !== "none";
      cuerpo.style.display = visible ? "none" : "block";
      encabezado.classList.toggle("abierto", !visible);
    });
    return el("div", { class: "accordion" }, [encabezado, cuerpo]);
  }

  function crearTarjetaVeredicto({ tipoClase, icono, titulo, detalle, cuerpoTexto, cuerpoNodo }) {
    const hijos = [
      el("div", { class: "tarjeta-encabezado" }, [
        el("span", { class: "tarjeta-icono", texto: icono }),
        el("div", {}, [
          el("div", { class: "tarjeta-titulo", texto: titulo }),
          el("div", { class: "tarjeta-detalle", texto: detalle }),
        ]),
      ]),
    ];
    if (cuerpoTexto) hijos.push(el("pre", { class: "tarjeta-cuerpo-mono", texto: cuerpoTexto }));
    if (cuerpoNodo) hijos.push(cuerpoNodo);
    return el("div", { class: `tarjeta ${tipoClase}` }, hijos);
  }

  /* ==========================================================
     REGISTRO DE MÉTODOS (equivalente a METODOS en gui.py)
     ========================================================== */

  const ICONOS = {
    inicio: '<path d="M3 11l9-8 9 8M5 9.5V20h5v-6h4v6h5V9.5"/>',
    sistema: '<path d="M8 4H5v16h3M16 4h3v16h-3M9.5 9h5M9.5 15h5"/>',
    pivoteo: '<path d="M7 4v16M7 4L4 7M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"/>',
    conversion: '<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
    vectores: '<path d="M5 19L19 5M19 5h-7M19 5v7"/>',
  };

  function icono(nombre, tam) {
    return '<svg viewBox="0 0 24 24" width="' + tam + '" height="' + tam + '" fill="none" ' +
      'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true">' + ICONOS[nombre] + '</svg>';
  }

  const INICIO = { nombre: "Inicio", icono: "inicio", vista: vistaInicio };

  const METODOS = [
    {
      nombre: "Gauss-Jordan", icono: "sistema",
      descripcion: "Resuelve sistemas de ecuaciones lineales reduciendo la matriz aumentada, paso a paso.",
      vista: () => vistaSistemaLineal("gauss-jordan", "Gauss-Jordan"),
    },
    {
      nombre: "Pivoteo", icono: "pivoteo",
      descripcion: "Gauss-Jordan con pivoteo parcial: elige el mejor pivote de cada columna.",
      vista: () => vistaSistemaLineal("pivoteo", "Pivoteo"),
    },
    {
      nombre: "Conversión de bases", icono: "conversion",
      descripcion: "Convierte números entre decimal, binario, octal y hexadecimal con su procedimiento.",
      vista: vistaConversion,
    },
    {
      nombre: "Vectores y matrices", icono: "vectores",
      descripcion: "Suma, resta, escalares, combinación lineal, multiplicación, ecuación matricial e inversa.",
      vista: vistaVectoresMatrices,
    },
  ];

  const panel = document.getElementById("panel");
  const sidebar = document.getElementById("sidebar");

  function leerSidebarColapsado() {
    try { return localStorage.getItem("sidebar-colapsado") === "1"; } catch (e) { return false; }
  }

  function aplicarSidebarColapsado(colapsado, guardar) {
    sidebar.classList.toggle("colapsado", colapsado);
    const boton = sidebar.querySelector(".btn-colapsar");
    if (boton) {
      const accion = colapsado ? "Mostrar menú" : "Ocultar menú";
      boton.title = accion;
      boton.setAttribute("aria-label", accion);
      boton.setAttribute("aria-expanded", String(!colapsado));
    }
    if (guardar) {
      try { localStorage.setItem("sidebar-colapsado", colapsado ? "1" : "0"); } catch (e) {}
    }
  }

  const ICONO_SIDEBAR =
    '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 4v16M6.5 9h.01M6.5 12h.01"/></svg>';

  function crearBotonColapsar() {
    const boton = el("button", { class: "btn-colapsar", html: ICONO_SIDEBAR });
    boton.type = "button";
    boton.onclick = () => aplicarSidebarColapsado(!sidebar.classList.contains("colapsado"), true);
    sidebar.querySelector(".sidebar-cabecera").appendChild(boton);
  }

  function construirSidebar() {
    crearBotonColapsar();
    aplicarSidebarColapsado(leerSidebarColapsado(), false);

    for (const metodo of [INICIO, ...METODOS]) {
      if (metodo === METODOS[0]) sidebar.appendChild(el("div", { class: "sidebar-separador" }));
      const boton = el("button", {
        class: "nav-btn",
        onclick: () => mostrarVista(metodo),
      }, [
        el("span", { class: "nav-icono", html: icono(metodo.icono, 16) }),
        el("span", { texto: metodo.nombre }),
      ]);
      boton.dataset.nombre = metodo.nombre;
      sidebar.appendChild(boton);
    }

    sidebar.appendChild(crearBotonTema());

    const puntoEstado = el("div", { class: "estado-punto" });
    const textoEstado = el("span", { texto: "Verificando servidor..." });

    sidebar.appendChild(el("div", { class: "estado-servidor" }, [
      puntoEstado,
      textoEstado,
    ]));

    iniciarMonitorEstado(puntoEstado, textoEstado);
  }

  function temaActual() {
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }

  function crearBotonTema() {
    const icono = el("span", { "aria-hidden": "true" });
    const etiqueta = el("span");
    const boton = el("button", { class: "nav-btn btn-tema" }, [icono, etiqueta]);

    function actualizar() {
      const oscuro = temaActual() === "dark";
      icono.textContent = oscuro ? "☀" : "☾";
      etiqueta.textContent = oscuro ? "Modo claro" : "Modo oscuro";
      boton.title = oscuro ? "Cambiar al modo claro" : "Cambiar al modo oscuro";
    }

    boton.addEventListener("click", () => {
      const nuevo = temaActual() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", nuevo);
      try { localStorage.setItem("tema-calculadora", nuevo); } catch (e) {}
      actualizar();
    });

    actualizar();
    return boton;
  }

  async function verificarEstadoServidor(puntoEstado, textoEstado) {
    try {
      const respuesta = await fetch("/api/estado", { cache: "no-store" });
      if (!respuesta.ok) throw new Error("estado no-ok");
      puntoEstado.className = "estado-punto conectado";
      textoEstado.textContent = "Server connected";
      textoEstado.parentNode.title = "Server connected";
    } catch (error) {
      puntoEstado.className = "estado-punto desconectado";
      textoEstado.textContent = "Server disconnected";
      textoEstado.parentNode.title = "Server disconnected";
    }
  }

  function iniciarMonitorEstado(puntoEstado, textoEstado) {
    verificarEstadoServidor(puntoEstado, textoEstado);
    setInterval(() => verificarEstadoServidor(puntoEstado, textoEstado), 5000);
  }

  function mostrarVista(metodo) {
    for (const boton of sidebar.querySelectorAll(".nav-btn")) {
      boton.classList.toggle("active", boton.dataset.nombre === metodo.nombre);
    }
    panel.innerHTML = "";
    panel.appendChild(metodo.vista());
  }

  /* ==========================================================
     VISTA: SISTEMA LINEAL (Gauss-Jordan / Pivoteo)
     ========================================================== */

  const TIPO_INFO_SISTEMA = {
    unica: { titulo: "Sistema compatible determinado", detalle: "Tiene una única solución.", icono: "✓", clase: "tipo-unica" },
    infinitas: { titulo: "Sistema compatible indeterminado", detalle: "Tiene infinitas soluciones.", icono: "∞", clase: "tipo-infinitas" },
    incompatible: { titulo: "Sistema incompatible", detalle: "No tiene solución.", icono: "✕", clase: "tipo-incompatible" },
  };

  const NOMBRE_TIPO_PASO = {
    intercambio: "Intercambio de filas",
    normalizar: "Se normaliza el pivote a 1",
    eliminar: "Se elimina el coeficiente usando el pivote",
  };

  function tarjetaResultadoSistema(tipo, soluciones) {
    const info = TIPO_INFO_SISTEMA[tipo];
    return crearTarjetaVeredicto({
      tipoClase: info.clase, icono: info.icono, titulo: info.titulo,
      detalle: info.detalle, cuerpoTexto: soluciones,
    });
  }

  function tablaConEtiqueta(etiqueta, filas) {
    return el("div", { class: "matriz-etiquetada" }, [
      crearTablaMatriz(filas, {}),
      el("div", { class: "matriz-etiqueta", texto: etiqueta }),
    ]);
  }

  function renderEcuacionComprobacion(comprobacion) {
    const filasX = comprobacion.vector_x.map((v) => [v]);
    const filasB = comprobacion.vector_b.map((v) => [v]);
    return el("div", { class: "ecuacion-comprobacion" }, [
      tablaConEtiqueta("A original", comprobacion.matriz_a),
      el("span", { class: "simbolo-ecuacion", texto: "·" }),
      tablaConEtiqueta("X", filasX),
      el("span", { class: "simbolo-ecuacion", texto: "=" }),
      tablaConEtiqueta("B original", filasB),
    ]);
  }

  function renderFilasComprobacion(filas) {
    return el("div", { class: "lista-pasos" }, filas.map((f, i) => el("div", {
      class: `fila-paso fila-comprobacion${f.correcta ? "" : " fallo"}`,
      style: `animation-delay:${i * 35}ms`,
    }, [
      el("span", { class: "paso-etiqueta", texto: `Fila ${i + 1}` }),
      el("span", { class: "paso-expresion", texto: `A${i + 1}·X = ${f.ax}    B${i + 1} = ${f.b}` }),
      el("span", {
        class: `badge-comprobacion ${f.correcta ? "ok" : "fallo"}`,
        texto: f.correcta ? "✓" : "✕",
      }),
    ])));
  }

  function tarjetaComprobacion(comprobacion) {
    const correcto = comprobacion.correcto;
    const clase = correcto === null ? "tipo-neutro" : correcto ? "tipo-unica" : "tipo-incompatible";
    const icono = correcto === null ? "—" : correcto ? "✓" : "✕";
    const titulo = correcto === null
      ? "No es posible comprobar"
      : correcto ? "Comprobación correcta" : "Comprobación incorrecta";
    const detalle = correcto === null
      ? "El sistema no tiene solución."
      : "Se verifica que A original · X = B original";

    if (correcto === null) {
      return crearTarjetaVeredicto({ tipoClase: clase, icono, titulo, detalle });
    }

    const cuerpo = el("div", {}, [
      renderEcuacionComprobacion(comprobacion),
      comprobacion.tipo_sistema === "infinitas"
        ? el("p", {
            class: "nota-sin-pasos",
            texto: "Variables libres tomadas como 0 (solución particular).",
          })
        : null,
      renderFilasComprobacion(comprobacion.filas),
    ]);

    return crearTarjetaVeredicto({ tipoClase: clase, icono, titulo, detalle, cuerpoNodo: cuerpo });
  }

  function filasAfectadasDePaso(paso) {
    const filas = new Set();
    if (paso.fila_a != null) filas.add(paso.fila_a - 1);
    if (paso.fila_b != null) filas.add(paso.fila_b - 1);
    if (paso.fila != null) filas.add(paso.fila - 1);
    if (paso.fila_pivote != null) filas.add(paso.fila_pivote - 1);
    return filas;
  }

  function pivoteDePaso(paso) {
    if (paso.tipo === "normalizar") return { fila: paso.fila - 1, columna: paso.columna };
    if (paso.tipo === "eliminar") return { fila: paso.fila_pivote - 1, columna: paso.columna };
    return null;
  }

  function renderPasoSistema(paso, indice, total, encabezados, separador) {
    return el("div", { class: "paso-tarjeta" }, [
      el("div", { class: "paso-encabezado" }, [
        el("span", { class: "paso-numero", texto: `Paso ${indice + 1} de ${total}` }),
        el("span", { class: `paso-operacion tipo-${paso.tipo}`, texto: paso.operacion }),
      ]),
      el("div", { class: "paso-descripcion", texto: NOMBRE_TIPO_PASO[paso.tipo] || "" }),
      crearTablaMatriz(paso.matriz, {
        encabezados,
        separadorAntesDe: separador == null ? encabezados.length - 1 : separador,
        pivote: pivoteDePaso(paso),
        filasResaltadas: filasAfectadasDePaso(paso),
      }),
    ]);
  }

  function renderStepperYFinal(contenedor, bloqueSistema, encabezados, separador) {
    const sep = separador == null ? encabezados.length - 1 : separador;
    if (bloqueSistema.pasos.length === 0) {
      contenedor.appendChild(el("p", {
        class: "nota-sin-pasos",
        texto: "La matriz ya estaba en su forma escalonada reducida; no se requirieron operaciones.",
      }));
    } else {
      contenedor.appendChild(crearStepperGenerico(
        bloqueSistema.pasos,
        (paso, i, total) => renderPasoSistema(paso, i, total, encabezados, sep)
      ));
    }

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Matriz reducida" }));
    const pivotesFinal = bloqueSistema.pivotes.map((columna, fila) => ({ fila, columna }));
    contenedor.appendChild(crearTablaMatriz(bloqueSistema.matriz_final, {
      encabezados,
      separadorAntesDe: sep,
      pivotes: pivotesFinal,
    }));
  }

  function renderProcedimientoSistema(contenedor, resultado, encabezados, tituloProcedimiento) {
    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Matriz aumentada inicial" }));
    contenedor.appendChild(crearTablaMatriz(resultado.matriz_inicial, {
      encabezados,
      separadorAntesDe: encabezados.length - 1,
    }));

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: tituloProcedimiento || "Procedimiento" }));
    renderStepperYFinal(contenedor, resultado, encabezados);
  }

  function vistaSistemaLineal(metodo, titulo) {
    let entradasMatriz = [];
    let ultimoResultado = null;
    let modo = "fraccion";

    const marcoMatriz = el("div", { class: "marco-matriz" });
    const panelResultado = el("div", { class: "resultado-panel" });

    const entradaEcuaciones = el("input", { type: "number", min: "1", value: "3" });
    entradaEcuaciones.style.width = "60px";
    const entradaVariables = el("input", { type: "number", min: "1", value: "3" });
    entradaVariables.style.width = "60px";

    const botonComprobar = el("button", {
      class: "btn",
      texto: "Comprobar resultado",
      disabled: "disabled",
      onclick: comprobarResultado,
    });

    function crearMatriz() {
      let ecuaciones, variables;
      try {
        ecuaciones = enteroPositivo(entradaEcuaciones.value, "Ecuaciones");
        variables = enteroPositivo(entradaVariables.value, "Variables");
      } catch (error) {
        mostrarError("Ingrese números enteros mayores que cero.");
        return;
      }

      marcoMatriz.innerHTML = "";
      entradasMatriz = [];
      ultimoResultado = null;
      botonComprobar.disabled = true;
      panelResultado.innerHTML = "";

      const columnasTotales = variables + 2; // variables + separador + b
      const grid = el("div", {
        class: "grid-matriz",
        style: `grid-template-columns: repeat(${columnasTotales}, auto);`,
      });

      for (let j = 0; j < variables; j++) {
        grid.appendChild(el("div", { class: "encabezado", texto: `x${j + 1}` }));
      }
      grid.appendChild(el("div", { class: "separador", texto: "│" }));
      grid.appendChild(el("div", { class: "encabezado", texto: "b" }));

      for (let i = 0; i < ecuaciones; i++) {
        const filaEntradas = [];
        for (let j = 0; j < variables; j++) {
          const entrada = el("input", { type: "text" });
          grid.appendChild(entrada);
          filaEntradas.push(entrada);
        }
        grid.appendChild(el("div", { class: "separador", texto: "│" }));
        const entradaB = el("input", { type: "text" });
        grid.appendChild(entradaB);
        filaEntradas.push(entradaB);
        entradasMatriz.push(filaEntradas);
      }

      marcoMatriz.appendChild(grid);
    }

    function limpiarMatriz() {
      for (const fila of entradasMatriz) {
        for (const entrada of fila) entrada.value = "";
      }
      ultimoResultado = null;
      botonComprobar.disabled = true;
      panelResultado.innerHTML = "";
    }

    function obtenerMatriz() {
      const matriz = [];
      for (const filaEntradas of entradasMatriz) {
        const fila = [];
        for (const entrada of filaEntradas) {
          const texto = entrada.value.trim();
          if (texto === "") throw new Error("vacio");
          fila.push(texto);
        }
        matriz.push(fila);
      }
      return matriz;
    }

    async function resolverInterno() {
      let matriz;
      try {
        matriz = obtenerMatriz();
      } catch (error) {
        mostrarError("Complete todos los campos de la matriz con números.");
        return null;
      }

      try {
        const resultado = await llamarApi("/api/sistema", { metodo, matriz, modo });
        ultimoResultado = resultado;
        botonComprobar.disabled = false;
        return resultado;
      } catch (error) {
        mostrarError(error.message);
        return null;
      }
    }

    function encabezadosDe(resultado) {
      const variables = resultado.matriz_inicial[0].length - 1;
      return Array.from({ length: variables }, (_, j) => `x${j + 1}`).concat(["b"]);
    }

    async function resolverSistema() {
      const resultado = await resolverInterno();
      if (!resultado) return;

      panelResultado.innerHTML = "";
      panelResultado.appendChild(tarjetaResultadoSistema(resultado.tipo, resultado.soluciones));
    }

    async function mostrarPasos() {
      let resultado = ultimoResultado;
      if (!resultado) {
        resultado = await resolverInterno();
        if (!resultado) return;
      }

      panelResultado.innerHTML = "";
      renderProcedimientoSistema(panelResultado, resultado, encabezadosDe(resultado), `Procedimiento (${titulo})`);
      panelResultado.appendChild(tarjetaResultadoSistema(resultado.tipo, resultado.soluciones));
    }

    function comprobarResultado() {
      if (!ultimoResultado) {
        mostrarAviso("Primero resuelva el sistema para poder comprobarlo.");
        return;
      }
      panelResultado.innerHTML = "";
      panelResultado.appendChild(tarjetaComprobacion(ultimoResultado.comprobacion));
    }

    const controles = el("div", { class: "controles" }, [
      el("label", { texto: "Ecuaciones:" }),
      entradaEcuaciones,
      el("label", { texto: "Variables:" }),
      entradaVariables,
      el("button", { class: "btn", texto: "Crear matriz", onclick: crearMatriz }),
      el("button", { class: "btn", texto: "Limpiar", onclick: limpiarMatriz }),
    ]);

    const radioFraccion = el("input", { type: "radio", name: `modo-${metodo}`, value: "fraccion", checked: "checked" });
    const radioDecimal = el("input", { type: "radio", name: `modo-${metodo}`, value: "decimal" });
    radioFraccion.addEventListener("change", () => { modo = "fraccion"; });
    radioDecimal.addEventListener("change", () => { modo = "decimal"; });

    const formato = el("div", { class: "formato" }, [
      el("span", { texto: "Mostrar resultados en:" }),
      el("label", {}, [radioFraccion, document.createTextNode(" Fracciones")]),
      el("label", {}, [radioDecimal, document.createTextNode(" Decimales")]),
    ]);

    const botones = el("div", { class: "botones" }, [
      el("button", { class: "btn btn-grande", texto: "Resolver", onclick: resolverSistema }),
      el("button", { class: "btn btn-grande", texto: "Mostrar pasos", onclick: mostrarPasos }),
      botonComprobar,
    ]);

    const contenedor = el("div", {}, [
      el("div", { class: "titulo", texto: titulo }),
      controles,
      marcoMatriz,
      formato,
      botones,
      panelResultado,
    ]);

    crearMatriz();
    return contenedor;
  }

  /* ==========================================================
     VISTA: CONVERSIÓN DE BASES
     ========================================================== */

  const DIGITOS = "0123456789ABCDEF";

  function renderPasoDivision(paso, indice, total) {
    const digito = DIGITOS[paso.residuo];
    return el("div", { class: "paso-conversion" }, [
      el("span", { class: "paso-numero", texto: `Paso ${indice + 1} de ${total}` }),
      el("div", { class: "division-visual" }, [
        el("span", { texto: String(paso.dividendo) }),
        el("span", { class: "division-operador", texto: `÷ ${paso.base}` }),
        el("span", { class: "division-igual", texto: "=" }),
        el("span", { class: "division-cociente", texto: String(paso.cociente) }),
      ]),
      el("div", {
        class: "division-residuo",
        texto: paso.base > 10
          ? `Residuo = ${paso.residuo} (${digito})`
          : `Residuo = ${paso.residuo}`,
      }),
    ]);
  }

  function renderPasoTermino(paso, indice, total) {
    return el("div", { class: "paso-conversion" }, [
      el("span", { class: "paso-numero", texto: `Paso ${indice + 1} de ${total}` }),
      el("div", { class: "termino-visual" }, [
        el("span", { texto: paso.digito }),
        el("span", { texto: `× ${paso.base}^${paso.exponente}` }),
        el("span", { class: "termino-igual", texto: "=" }),
        el("span", { class: "termino-resultado", texto: String(paso.contribucion) }),
      ]),
    ]);
  }

  function crearTarjetaResultadoConversion(resultado) {
    const detalle = resultado.pasos.length === 0
      ? "El número ya estaba en la base solicitada."
      : resultado.tipo === "a_otra_base"
        ? "Los residuos, leídos de abajo hacia arriba, forman el resultado."
        : "La suma de cada término (dígito × base elevado a su posición) da el resultado.";

    return crearTarjetaVeredicto({
      tipoClase: "tipo-unica",
      icono: "✓",
      titulo: "Resultado de la conversión",
      detalle,
      cuerpoNodo: el("div", {
        class: "resultado-conversion-numero",
        texto: `${resultado.numero_entrada} (${resultado.nombre_base_entrada}) = `
          + `${resultado.resultado} (${resultado.nombre_base_salida})`,
      }),
    });
  }

  function vistaConversion() {
    const BASES_A_OTRA = ["binario", "octal", "hexadecimal"];
    const BASES_A_DECIMAL = ["binario", "octal", "hexadecimal", "decimal"];
    const NOMBRE_A_BASE = { binario: 2, octal: 8, decimal: 10, hexadecimal: 16 };

    let direccion = "a_otra_base";

    const panelResultado = el("div", { class: "resultado-panel" });
    const selectBase = el("select", {});

    function actualizarOpcionesBase() {
      const opciones = direccion === "a_otra_base" ? BASES_A_OTRA : BASES_A_DECIMAL;
      selectBase.innerHTML = "";
      for (const opcion of opciones) {
        selectBase.appendChild(el("option", { value: opcion, texto: opcion }));
      }
    }

    const radioAOtra = el("input", { type: "radio", name: "direccion-conv", value: "a_otra_base", checked: "checked" });
    const radioADecimal = el("input", { type: "radio", name: "direccion-conv", value: "a_decimal" });
    radioAOtra.addEventListener("change", () => { direccion = "a_otra_base"; actualizarOpcionesBase(); });
    radioADecimal.addEventListener("change", () => { direccion = "a_decimal"; actualizarOpcionesBase(); });

    const direccionMarco = el("div", { class: "controles" }, [
      el("span", { texto: "Dirección:" }),
      el("label", {}, [radioAOtra, document.createTextNode(" Decimal → otra base")]),
      el("label", {}, [radioADecimal, document.createTextNode(" Otra base → Decimal")]),
    ]);

    const entradaNumero = el("input", { type: "text", placeholder: "Número" });
    entradaNumero.style.width = "220px";

    async function convertir() {
      const numero = entradaNumero.value.trim();
      const baseNombre = selectBase.value;
      const baseNumero = NOMBRE_A_BASE[baseNombre];

      let baseEntrada, baseSalida;
      if (direccion === "a_otra_base") {
        baseEntrada = 10; baseSalida = baseNumero;
      } else {
        baseEntrada = baseNumero; baseSalida = 10;
      }

      let resultado;
      try {
        resultado = await llamarApi("/api/conversion", {
          numero, base_entrada: baseEntrada, base_salida: baseSalida,
        });
      } catch (error) {
        mostrarError(error.message);
        return;
      }

      panelResultado.innerHTML = "";
      panelResultado.appendChild(el("div", { class: "bloque-titulo", texto: "Procedimiento" }));

      if (resultado.pasos.length === 0) {
        panelResultado.appendChild(el("p", {
          class: "nota-sin-pasos",
          texto: "El número ya está en la base solicitada; no se requieren operaciones.",
        }));
      } else if (resultado.tipo === "a_otra_base") {
        panelResultado.appendChild(crearStepperGenerico(resultado.pasos, renderPasoDivision));
      } else {
        panelResultado.appendChild(crearStepperGenerico(resultado.pasos, renderPasoTermino));
      }

      panelResultado.appendChild(crearTarjetaResultadoConversion(resultado));
    }

    const controles = el("div", { class: "controles" }, [
      el("label", { texto: "Base:" }),
      selectBase,
      el("label", { texto: "Número:" }),
      entradaNumero,
      el("button", { class: "btn btn-grande", texto: "Convertir", onclick: convertir }),
    ]);

    actualizarOpcionesBase();

    return el("div", {}, [
      el("div", { class: "titulo", texto: "Conversión de bases" }),
      direccionMarco,
      controles,
      panelResultado,
    ]);
  }

  /* ==========================================================
     VISTA: VECTORES Y MATRICES
     ========================================================== */

  const TITULOS_OPERACION = {
    suma_vectores: "Suma de vectores",
    resta_vectores: "Resta de vectores",
    escalar_vector: "Multiplicación de vector por escalar",
    suma_matrices: "Suma de matrices",
    resta_matrices: "Resta de matrices",
    escalar_matriz: "Multiplicación de matriz por escalar",
    multiplicacion_matrices: "Multiplicación de matrices",
  };

  function renderFilaPasoVector(paso, indice, tipo) {
    let expresion;
    if (tipo === "suma_vectores") expresion = paso.valores.join(" + ");
    else if (tipo === "resta_vectores") expresion = `${paso.valor_a} - ${paso.valor_b}`;
    else expresion = `${paso.escalar} × ${paso.valor}`;

    return el("div", { class: "fila-paso", style: `animation-delay:${indice * 35}ms` }, [
      el("span", { class: "paso-etiqueta", texto: `Componente ${paso.componente + 1}` }),
      el("span", { class: "paso-expresion", texto: `${expresion} = ${paso.resultado}` }),
    ]);
  }

  function renderFilaPasoMatriz(paso, indice, tipo) {
    let expresion;
    if (tipo === "escalar_matriz") {
      expresion = `${paso.escalar} × ${paso.valor}`;
    } else if (tipo === "multiplicacion_matrices") {
      expresion = paso.factores.map(([a, b]) => `(${a}×${b})`).join(" + ");
    } else {
      const signo = tipo === "suma_matrices" ? "+" : "-";
      expresion = `${paso.valor_a} ${signo} ${paso.valor_b}`;
    }

    return el("div", { class: "fila-paso", style: `animation-delay:${indice * 35}ms` }, [
      el("span", { class: "paso-etiqueta", texto: `(${paso.fila + 1}, ${paso.columna + 1})` }),
      el("span", { class: "paso-expresion", texto: `${expresion} = ${paso.resultado}` }),
    ]);
  }

  function renderOperacionSimple(contenedor, bloque) {
    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: TITULOS_OPERACION[bloque.tipo] }));

    const esVector = bloque.tipo.endsWith("_vectores") || bloque.tipo === "escalar_vector";
    contenedor.appendChild(crearListaPasos(bloque.pasos, (paso, i) => (
      esVector ? renderFilaPasoVector(paso, i, bloque.tipo) : renderFilaPasoMatriz(paso, i, bloque.tipo)
    )));

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Resultado" }));
    if (Array.isArray(bloque.resultado[0])) {
      contenedor.appendChild(crearTablaMatriz(bloque.resultado, {}));
    } else {
      contenedor.appendChild(el("div", { class: "resultado-vector", texto: `(${bloque.resultado.join(", ")})` }));
    }
  }

  function renderCombinacionLineal(contenedor, bloque) {
    const planteamiento = bloque.entradas.vectores
      .map((v, i) => `c${i + 1}(${v.join(", ")})`)
      .join(" + ") + ` = (${bloque.entradas.objetivo.join(", ")})`;

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Combinación lineal" }));
    contenedor.appendChild(el("div", { class: "planteamiento", texto: `Planteamiento: ${planteamiento}` }));

    const encabezados = bloque.entradas.vectores.map((_, i) => `c${i + 1}`).concat(["obj"]);

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Sistema planteado" }));
    contenedor.appendChild(crearTablaMatriz(bloque.sistema, {
      encabezados, separadorAntesDe: encabezados.length - 1,
    }));

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Procedimiento" }));
    renderStepperYFinal(contenedor, bloque.sistema_resuelto, encabezados);

    if (bloque.es_combinacion) {
      const detalle = bloque.tipo_solucion === "infinitas"
        ? "Hay infinitas combinaciones posibles; se muestra una particular:"
        : "Los escalares encontrados son:";
      const chips = el("div", { class: "lista-escalares" }, bloque.escalares.map(
        (valor, i) => el("span", { class: "chip-escalar", texto: `c${i + 1} = ${valor}` })
      ));
      contenedor.appendChild(crearTarjetaVeredicto({
        tipoClase: "tipo-unica", icono: "✓", titulo: "Sí es combinación lineal",
        detalle, cuerpoNodo: chips,
      }));
    } else {
      contenedor.appendChild(crearTarjetaVeredicto({
        tipoClase: "tipo-incompatible", icono: "✕", titulo: "No es combinación lineal",
        detalle: "El sistema planteado es incompatible.",
      }));
    }
  }

  function renderEcuacionMatricial(contenedor, bloque) {
    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Ecuación matricial A·X = B" }));

    const columnasA = bloque.entradas.matriz_a[0].length;
    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Matriz aumentada [A | B]" }));
    contenedor.appendChild(crearTablaMatriz(bloque.matriz_aumentada, { separadorAntesDe: columnasA }));

    const encabezadosColumna = Array.from({ length: columnasA }, (_, j) => `x${j + 1}`).concat(["b"]);

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Resolución por columna de B" }));
    bloque.columnas.forEach((columna, indice) => {
      const cuerpo = el("div", { class: "accordion-body" });
      renderStepperYFinal(cuerpo, columna, encabezadosColumna);
      contenedor.appendChild(crearAccordion(`Columna ${indice + 1} de B`, cuerpo, indice === 0));
    });

    if (bloque.tipo_solucion === "incompatible") {
      contenedor.appendChild(crearTarjetaVeredicto({
        tipoClase: "tipo-incompatible", icono: "✕", titulo: "Sin solución",
        detalle: "La ecuación matricial no tiene solución.",
      }));
      return;
    }

    const detalle = bloque.tipo_solucion === "infinitas"
      ? "Tiene infinitas soluciones; se muestra una solución particular X:"
      : "Solución única X:";

    contenedor.appendChild(crearTarjetaVeredicto({
      tipoClase: "tipo-unica", icono: "✓", titulo: "Resultado", detalle,
      cuerpoNodo: crearTablaMatriz(bloque.resultado, {}),
    }));
  }

  function renderMatrizInversa(contenedor, bloque) {
    const n = bloque.entradas.matriz.length;
    const nombreMetodo = bloque.metodo === "pivoteo" ? "Pivoteo" : "Gauss-Jordan";
    const encabezados = Array.from({ length: n }, (_, j) => `a${j + 1}`)
      .concat(Array.from({ length: n }, (_, j) => `i${j + 1}`));

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: `Matriz inversa (${nombreMetodo})` }));
    contenedor.appendChild(el("div", {
      class: "planteamiento",
      texto: "Se reduce [A | I] hasta obtener [I | A⁻¹].",
    }));

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Matriz ampliada [A | I]" }));
    contenedor.appendChild(crearTablaMatriz(bloque.matriz_aumentada, {
      encabezados, separadorAntesDe: n,
    }));

    contenedor.appendChild(el("div", { class: "bloque-titulo", texto: "Procedimiento" }));
    renderStepperYFinal(contenedor, {
      pasos: bloque.pasos,
      pivotes: bloque.pivotes,
      matriz_final: bloque.matriz_final,
    }, encabezados, n);

    if (!bloque.existe) {
      contenedor.appendChild(crearTarjetaVeredicto({
        tipoClase: "tipo-incompatible", icono: "✕", titulo: "La inversa no existe",
        detalle: "La matriz A es singular (no invertible).",
        cuerpoTexto: bloque.motivo,
      }));
      return;
    }

    contenedor.appendChild(crearTarjetaVeredicto({
      tipoClase: "tipo-unica", icono: "✓", titulo: "La matriz es invertible",
      detalle: "A⁻¹ es el bloque derecho de la matriz reducida:",
      cuerpoNodo: crearTablaMatriz(bloque.resultado, {}),
    }));

    const comp = bloque.comprobacion;
    contenedor.appendChild(crearTarjetaVeredicto({
      tipoClase: comp.correcto ? "tipo-unica" : "tipo-incompatible",
      icono: comp.correcto ? "✓" : "✕",
      titulo: comp.correcto ? "Comprobación correcta" : "Comprobación incorrecta",
      detalle: "Se verifica que A · A⁻¹ = I",
      cuerpoNodo: el("div", { class: "ecuacion-comprobacion" }, [
        tablaConEtiqueta("A", bloque.entradas.matriz),
        el("span", { class: "simbolo-ecuacion", texto: "·" }),
        tablaConEtiqueta("A⁻¹", bloque.resultado),
        el("span", { class: "simbolo-ecuacion", texto: "=" }),
        tablaConEtiqueta("A · A⁻¹", comp.producto),
      ]),
    }));
  }

  function renderBloqueOperacion(contenedor, bloque) {
    contenedor.innerHTML = "";
    if (bloque.tipo === "matriz_inversa") renderMatrizInversa(contenedor, bloque);
    else if (bloque.tipo === "combinacion_lineal") renderCombinacionLineal(contenedor, bloque);
    else if (bloque.tipo === "ecuacion_matricial") renderEcuacionMatricial(contenedor, bloque);
    else renderOperacionSimple(contenedor, bloque);
  }

  function vistaVectoresMatrices() {
    let modo = "fraccion";
    const panelResultado = el("div", { class: "resultado-panel" });

    /* ---------- Sub-vista: Vectores ---------- */

    let entradasVectores = [];
    let entradasObjetivo = [];
    let entradaEscalarVector = null;

    const operacionVector = el("select", {}, [
      el("option", { value: "Suma", texto: "Suma" }),
      el("option", { value: "Resta", texto: "Resta" }),
      el("option", { value: "Vector por escalar", texto: "Vector por escalar" }),
      el("option", { value: "Combinación lineal", texto: "Combinación lineal" }),
    ]);

    const dimensionVector = el("input", { type: "number", min: "1", value: "3" });
    dimensionVector.style.width = "55px";
    const cantidadVectores = el("input", { type: "number", min: "1", value: "2" });
    cantidadVectores.style.width = "55px";

    const marcoVectores = el("div", { class: "grupo-vectores" });

    operacionVector.addEventListener("change", crearCamposVectores);

    function crearCamposVectores() {
      let dimension, cantidad;
      try {
        dimension = enteroPositivo(dimensionVector.value, "La dimensión");
      } catch (error) {
        mostrarError(error.message);
        return;
      }

      const operacion = operacionVector.value;

      if (operacion === "Suma" || operacion === "Combinación lineal") {
        try {
          cantidad = enteroPositivo(cantidadVectores.value, "La cantidad de vectores");
        } catch (error) {
          mostrarError(error.message);
          return;
        }
      } else {
        cantidad = 2;
      }

      marcoVectores.innerHTML = "";
      entradasVectores = [];
      entradasObjetivo = [];
      entradaEscalarVector = null;

      let total;
      if (operacion === "Suma" || operacion === "Combinación lineal") total = cantidad;
      else if (operacion === "Vector por escalar") total = 1;
      else total = 2;

      for (let j = 0; j < total; j++) {
        const columnaEntradas = [];
        const columna = el("div", { class: "columna-vector" });
        columna.appendChild(el("div", { class: "titulo-tabla", texto: `v${j + 1}` }));
        for (let i = 0; i < dimension; i++) {
          const entrada = el("input", { type: "text" });
          columna.appendChild(entrada);
          columnaEntradas.push(entrada);
        }
        entradasVectores.push(columnaEntradas);
        marcoVectores.appendChild(columna);
      }

      if (operacion === "Combinación lineal") {
        const columna = el("div", { class: "columna-vector" });
        columna.appendChild(el("div", { class: "titulo-tabla", texto: "objetivo" }));
        for (let i = 0; i < dimension; i++) {
          const entrada = el("input", { type: "text" });
          columna.appendChild(entrada);
          entradasObjetivo.push(entrada);
        }
        marcoVectores.appendChild(columna);
      } else if (operacion === "Vector por escalar") {
        entradaEscalarVector = el("input", { type: "text" });
        const columna = el("div", { class: "columna-vector" });
        columna.appendChild(el("div", { class: "titulo-tabla", texto: "Escalar" }));
        columna.appendChild(entradaEscalarVector);
        marcoVectores.appendChild(columna);
      }
    }

    function leerVector(entradas) {
      return entradas.map((entrada) => entrada.value.trim());
    }

    async function calcularVectores() {
      const operacion = operacionVector.value;
      const vectores = entradasVectores.map(leerVector);

      let cuerpo;
      if (operacion === "Suma") {
        cuerpo = { operacion, vectores, modo };
      } else if (operacion === "Resta") {
        cuerpo = { operacion, vectores: [vectores[0], vectores[1]], modo };
      } else if (operacion === "Vector por escalar") {
        cuerpo = {
          operacion,
          vectores: [vectores[0]],
          escalar: entradaEscalarVector.value.trim(),
          modo,
        };
      } else {
        cuerpo = { operacion, vectores, objetivo: leerVector(entradasObjetivo), modo };
      }

      try {
        const resultado = await llamarApi("/api/vectores", cuerpo);
        renderBloqueOperacion(panelResultado, resultado);
      } catch (error) {
        mostrarError(error.message);
      }
    }

    const controlesVectores = el("div", { class: "controles" }, [
      el("label", { texto: "Operación:" }),
      operacionVector,
      el("label", { texto: "Dimensión:" }),
      dimensionVector,
      el("label", { texto: "Vectores:" }),
      cantidadVectores,
      el("button", { class: "btn", texto: "Crear campos", onclick: crearCamposVectores }),
      el("button", { class: "btn", texto: "Calcular", onclick: calcularVectores }),
    ]);

    const tabVectores = el("div", {}, [controlesVectores, marcoVectores]);

    /* ---------- Sub-vista: Matrices ---------- */

    let entradasMatrizA = [];
    let entradasMatrizB = [];
    let entradaEscalarMatriz = null;

    const operacionMatriz = el("select", {}, [
      el("option", { value: "Suma", texto: "Suma" }),
      el("option", { value: "Resta", texto: "Resta" }),
      el("option", { value: "Matriz por escalar", texto: "Matriz por escalar" }),
      el("option", { value: "Multiplicación A × B", texto: "Multiplicación A × B" }),
    ]);

    const filasA = el("input", { type: "number", min: "1", value: "2" });
    filasA.style.width = "50px";
    const columnasA = el("input", { type: "number", min: "1", value: "2" });
    columnasA.style.width = "50px";
    const filasB = el("input", { type: "number", min: "1", value: "2" });
    filasB.style.width = "50px";
    const columnasB = el("input", { type: "number", min: "1", value: "2" });
    columnasB.style.width = "50px";

    const marcoMatrices = el("div", { class: "grupo-tablas" });

    operacionMatriz.addEventListener("change", crearCamposMatrices);

    function crearTabla(padre, filas, columnas, titulo) {
      const marco = el("div", { class: "marco-tabla" });
      marco.appendChild(el("div", { class: "titulo-tabla", texto: titulo }));
      const grid = el("div", {
        class: "tabla-genérica",
        style: `grid-template-columns: repeat(${columnas}, auto);`,
      });
      const entradas = [];
      for (let i = 0; i < filas; i++) {
        const fila = [];
        for (let j = 0; j < columnas; j++) {
          const entrada = el("input", { type: "text" });
          grid.appendChild(entrada);
          fila.push(entrada);
        }
        entradas.push(fila);
      }
      marco.appendChild(grid);
      padre.appendChild(marco);
      return entradas;
    }

    function crearCamposMatrices() {
      let fa, ca, fb, cb;
      try {
        fa = enteroPositivo(filasA.value, "Las filas de A");
        ca = enteroPositivo(columnasA.value, "Las columnas de A");
      } catch (error) {
        mostrarError(error.message);
        return;
      }

      const operacion = operacionMatriz.value;

      if (operacion !== "Matriz por escalar") {
        try {
          fb = enteroPositivo(filasB.value, "Las filas de B");
          cb = enteroPositivo(columnasB.value, "Las columnas de B");
        } catch (error) {
          mostrarError(error.message);
          return;
        }
      }

      marcoMatrices.innerHTML = "";
      entradasMatrizA = crearTabla(marcoMatrices, fa, ca, "Matriz A");
      entradasMatrizB = [];
      entradaEscalarMatriz = null;

      if (operacion === "Matriz por escalar") {
        const marco = el("div", { class: "marco-tabla" });
        marco.appendChild(el("div", { class: "titulo-tabla", texto: "Escalar" }));
        entradaEscalarMatriz = el("input", { type: "text" });
        marco.appendChild(entradaEscalarMatriz);
        marcoMatrices.appendChild(marco);
      } else {
        entradasMatrizB = crearTabla(marcoMatrices, fb, cb, "Matriz B");
      }
    }

    function leerMatriz(entradas) {
      return entradas.map((fila) => fila.map((entrada) => entrada.value.trim()));
    }

    async function calcularMatrices() {
      const operacion = operacionMatriz.value;
      const matrizA = leerMatriz(entradasMatrizA);

      let cuerpo;
      if (operacion === "Matriz por escalar") {
        cuerpo = { operacion, matriz_a: matrizA, escalar: entradaEscalarMatriz.value.trim(), modo };
      } else {
        cuerpo = { operacion, matriz_a: matrizA, matriz_b: leerMatriz(entradasMatrizB), modo };
      }

      try {
        const resultado = await llamarApi("/api/matrices", cuerpo);
        renderBloqueOperacion(panelResultado, resultado);
      } catch (error) {
        mostrarError(error.message);
      }
    }

    const controlesMatrices = el("div", { class: "controles" }, [
      el("label", { texto: "Operación:" }),
      operacionMatriz,
      el("label", { texto: "A filas:" }), filasA,
      el("label", { texto: "A cols:" }), columnasA,
      el("label", { texto: "B filas:" }), filasB,
      el("label", { texto: "B cols:" }), columnasB,
      el("button", { class: "btn", texto: "Crear", onclick: crearCamposMatrices }),
      el("button", { class: "btn", texto: "Calcular", onclick: calcularMatrices }),
    ]);

    const tabMatrices = el("div", {}, [controlesMatrices, marcoMatrices]);

    /* ---------- Sub-vista: Ecuación A·X = B ---------- */

    let entradasEcuacionA = [];
    let entradasEcuacionB = [];

    const ecFilasA = el("input", { type: "number", min: "1", value: "2" });
    ecFilasA.style.width = "50px";
    const ecColumnasA = el("input", { type: "number", min: "1", value: "2" });
    ecColumnasA.style.width = "50px";
    const ecColumnasB = el("input", { type: "number", min: "1", value: "1" });
    ecColumnasB.style.width = "50px";

    const marcoEcuacion = el("div", { class: "grupo-tablas" });

    function crearCamposEcuacion() {
      let filas, ca, cb;
      try {
        filas = enteroPositivo(ecFilasA.value, "Las filas de A");
        ca = enteroPositivo(ecColumnasA.value, "Las columnas de A");
        cb = enteroPositivo(ecColumnasB.value, "Las columnas de B");
      } catch (error) {
        mostrarError(error.message);
        return;
      }

      marcoEcuacion.innerHTML = "";
      entradasEcuacionA = crearTabla(marcoEcuacion, filas, ca, "Matriz A");
      entradasEcuacionB = crearTabla(marcoEcuacion, filas, cb, "Matriz B");
    }

    async function calcularEcuacion() {
      const cuerpo = {
        matriz_a: leerMatriz(entradasEcuacionA),
        matriz_b: leerMatriz(entradasEcuacionB),
        modo,
      };

      try {
        const resultado = await llamarApi("/api/ecuacion-matricial", cuerpo);
        renderBloqueOperacion(panelResultado, resultado);
      } catch (error) {
        mostrarError(error.message);
      }
    }

    const controlesEcuacion = el("div", { class: "controles" }, [
      el("label", { texto: "A filas:" }), ecFilasA,
      el("label", { texto: "A cols:" }), ecColumnasA,
      el("label", { texto: "B cols:" }), ecColumnasB,
      el("button", { class: "btn", texto: "Crear campos", onclick: crearCamposEcuacion }),
      el("button", { class: "btn", texto: "Resolver", onclick: calcularEcuacion }),
    ]);

    const tabEcuacion = el("div", {}, [controlesEcuacion, marcoEcuacion]);

    /* ---------- Sub-vista: Matriz inversa ---------- */

    let entradasInversa = [];

    const inversaN = el("input", { type: "number", min: "1", value: "3" });
    inversaN.style.width = "50px";
    const metodoInversa = el("select", {}, [
      el("option", { value: "gauss_jordan", texto: "Gauss-Jordan" }),
      el("option", { value: "pivoteo", texto: "Pivoteo" }),
    ]);
    const marcoInversa = el("div", { class: "grupo-tablas" });

    function crearCamposInversa() {
      let n;
      try {
        n = enteroPositivo(inversaN.value, "El tamaño n");
      } catch (error) {
        mostrarError(error.message);
        return;
      }

      marcoInversa.innerHTML = "";
      entradasInversa = crearTabla(marcoInversa, n, n, "Matriz A");
    }

    async function calcularInversa() {
      const cuerpo = {
        matriz: leerMatriz(entradasInversa),
        metodo: metodoInversa.value,
        modo,
      };

      try {
        const resultado = await llamarApi("/api/inversa", cuerpo);
        renderBloqueOperacion(panelResultado, resultado);
      } catch (error) {
        mostrarError(error.message);
      }
    }

    const controlesInversa = el("div", { class: "controles" }, [
      el("label", { texto: "Tamaño n (n × n):" }), inversaN,
      el("label", { texto: "Método:" }), metodoInversa,
      el("button", { class: "btn", texto: "Crear campos", onclick: crearCamposInversa }),
      el("button", { class: "btn", texto: "Calcular inversa", onclick: calcularInversa }),
    ]);

    const tabInversa = el("div", {}, [controlesInversa, marcoInversa]);

    /* ---------- Ensamblado de pestañas ---------- */

    const contenidoVectores = el("div", { class: "tab-contenido activa" }, [tabVectores]);
    const contenidoMatrices = el("div", { class: "tab-contenido" }, [tabMatrices]);
    const contenidoEcuacion = el("div", { class: "tab-contenido" }, [tabEcuacion]);
    const contenidoInversa = el("div", { class: "tab-contenido" }, [tabInversa]);

    const botonTabVectores = el("button", { class: "tab-btn active", texto: "Vectores" });
    const botonTabMatrices = el("button", { class: "tab-btn", texto: "Matrices" });
    const botonTabEcuacion = el("button", { class: "tab-btn", texto: "Ecuación A·X = B" });
    const botonTabInversa = el("button", { class: "tab-btn", texto: "Matriz inversa" });

    function activarPestana(boton, contenido) {
      for (const [b, c] of [
        [botonTabVectores, contenidoVectores],
        [botonTabMatrices, contenidoMatrices],
        [botonTabEcuacion, contenidoEcuacion],
        [botonTabInversa, contenidoInversa],
      ]) {
        b.classList.toggle("active", b === boton);
        c.classList.toggle("activa", c === contenido);
      }
      // El panel de resultado es compartido por todas las pestañas: se limpia
      // al cambiar de pestaña para no dejar visible el resultado de una
      // operación distinta (p. ej. un resultado de "Vectores" mientras se
      // mira la pestaña "Matrices").
      panelResultado.innerHTML = "";
    }

    botonTabVectores.addEventListener("click", () => activarPestana(botonTabVectores, contenidoVectores));
    botonTabMatrices.addEventListener("click", () => activarPestana(botonTabMatrices, contenidoMatrices));
    botonTabEcuacion.addEventListener("click", () => activarPestana(botonTabEcuacion, contenidoEcuacion));
    botonTabInversa.addEventListener("click", () => activarPestana(botonTabInversa, contenidoInversa));

    const tabs = el("div", { class: "tabs" }, [botonTabVectores, botonTabMatrices, botonTabEcuacion, botonTabInversa]);
    const panelTabs = el("div", { class: "tab-panel" }, [
      contenidoVectores, contenidoMatrices, contenidoEcuacion, contenidoInversa,
    ]);

    const radioFraccion = el("input", { type: "radio", name: "modo-vm", value: "fraccion", checked: "checked" });
    const radioDecimal = el("input", { type: "radio", name: "modo-vm", value: "decimal" });
    radioFraccion.addEventListener("change", () => { modo = "fraccion"; });
    radioDecimal.addEventListener("change", () => { modo = "decimal"; });

    const formato = el("div", { class: "formato" }, [
      el("span", { texto: "Mostrar resultados en:" }),
      el("label", {}, [radioFraccion, document.createTextNode(" Fracciones")]),
      el("label", {}, [radioDecimal, document.createTextNode(" Decimales")]),
    ]);

    crearCamposVectores();
    crearCamposMatrices();
    crearCamposEcuacion();
    crearCamposInversa();

    return el("div", {}, [
      el("div", { class: "titulo", texto: "Vectores y matrices" }),
      tabs,
      panelTabs,
      formato,
      panelResultado,
    ]);
  }

  /* ==========================================================
     VISTA: INICIO
     ========================================================== */

  function vistaInicio() {
    const tarjetas = METODOS.map((metodo) => el("button", {
      class: "inicio-tarjeta",
      type: "button",
      onclick: () => mostrarVista(metodo),
    }, [
      el("span", { class: "inicio-icono", html: icono(metodo.icono, 22) }),
      el("span", { class: "inicio-nombre", texto: metodo.nombre }),
      el("span", { class: "inicio-descripcion", texto: metodo.descripcion }),
    ]));

    return el("div", { class: "inicio" }, [
      el("div", { class: "titulo", texto: "Calculadora de Álgebra Lineal" }),
      el("p", {
        class: "inicio-subtitulo",
        texto: "Elige un método u operación para empezar.",
      }),
      el("div", { class: "inicio-cuadricula" }, tarjetas),
    ]);
  }

  construirSidebar();
  mostrarVista(INICIO);
})();
</script>
</body>
</html>
